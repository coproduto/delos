:root {

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; }
header { padding: 16px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; }
header h1 { font-size: 18px; margin: 0; }
header .muted { color: var(--muted); }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 4px 10px; border-radius: 6px; cursor: pointer; font: inherit; }
nav button.on { border-color: var(--accent); color: var(--accent); }
main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0; min-height: calc(100vh - 60px); }
@media (max-width: 860px) { main { grid-template-columns: 1fr; } }
#left, #right { padding: 16px; overflow: auto; }
#left { border-right: 1px solid var(--line); max-height: calc(100vh - 60px); }
#right { max-height: calc(100vh - 60px); }
@media (max-width: 860px) { #left, #right { max-height: none; border-right: 0; } }
code { background: var(--code-bg); padding: 0 3px; border-radius: 3px; font-size: 12.5px; }
a { color: var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
.st-Implemented { --c: var(--implemented); } .st-Partial { --c: var(--partial); } .st-Diverges { --c: var(--diverges); }
.st-Missing { --c: var(--missing); } .st-Deferred { --c: var(--deferred); } .st-Process { --c: var(--process); } .st-none { --c: var(--line); }
.dot { background: var(--c); }
.sec { font-weight: 600; margin: 18px 0 6px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.unit { padding: 3px 8px; border-left: 3px solid var(--c); margin: 2px 0; cursor: pointer; border-radius: 0 4px 4px 0; }
.unit:hover, .row:hover { background: var(--code-bg); }
.unit.code { font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; }
.unit .ids { color: var(--muted); font-size: 11px; margin-left: 6px; }
.unit.sel, .row.sel { background: var(--code-bg); }
.row { display: flex; gap: 8px; align-items: baseline; padding: 3px 6px; cursor: pointer; border-radius: 4px; }
.row .id { font-family: ui-monospace, monospace; font-size: 12px; min-width: 52px; }
.row .t { flex: 1; }
.detail h2 { font-size: 16px; margin: 0 0 4px; }
.detail .status { display: inline-block; padding: 1px 8px; border-radius: 10px; color: #fff; background: var(--c); font-size: 12px; }
.detail blockquote { margin: 8px 0; padding: 6px 10px; border-left: 3px solid var(--line); color: var(--muted); }
.detail .lab { font-weight: 600; margin-top: 12px; }
.detail ul { padding-left: 18px; margin: 4px 0; }
.detail p { margin: 4px 0; }
table.grid { border-collapse: collapse; font-size: 11px; }
table.grid th, table.grid td { border: 1px solid var(--line); padding: 2px 4px; text-align: center; }
table.grid th.v { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; font-weight: normal; }
table.grid td.l { text-align: left; white-space: nowrap; cursor: pointer; }
table.grid td.h { background: color-mix(in srgb, var(--accent) calc(var(--k) * 100%), transparent); }
.file { margin: 10px 0; }
.file h3 { font-size: 13px; margin: 0 0 4px; font-family: ui-monospace, monospace; }
.item { font-family: ui-monospace, monospace; font-size: 12px; padding: 1px 6px; }
.item.none { color: var(--muted); }
.anc { display: inline-block; min-width: 52px; font-size: 10px; color: var(--muted); }
.anc-u { color: var(--diverges); font-weight: 600; }
.item a { margin-left: 4px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 2px 0 6px; }
.bar > div { height: 100%; background: var(--accent); }
input[type=search] { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); font: inherit; margin-bottom: 8px; }
</style>

 and keeps results on the GPU as <code>Tile::Gpu<\/code> (<a href=\"../../src/engine/mod.rs#L283\" target=\"_blank\">engine/mod.rs:283-309<\/a>).<\/li><li>Source images are sampled on the GPU from resident pyramid levels by <code>source_on_gpu<\/code> (<a href=\"../../src/engine/mod.rs#L257\" target=\"_blank\">engine/mod.rs:257-271<\/a>); the levels are uploaded on a background thread (<code>upload_loop<\/code>) that <code>Resident::new<\/code> spawns (<a href=\"../../src/engine/resident.rs#L113\" target=\"_blank\">resident.rs:113-116<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/engine.rs::gpu_matches_cpu<\/code>, <code>tests/split.rs::gpu_split_matches_cpu<\/code>, <code>tests/resident.rs::gpu_sampling_matches_cpu<\/code>. <code>tests/kernel_profile.rs::kernels_on_cpu_and_gpu<\/code> times both backends but is an ignored benchmark.<\/p>", "Notes": "<p>The CPU-only steps: <code>fourier_resample<\/code> (<a href=\"../../src/nodes/resize.rs#L126\" target=\"_blank\">resize.rs:126-183<\/a>) and the background-removal <code>compute_mask<\/code> (<a href=\"../../src/nodes/bgremove.rs#L101\" target=\"_blank\">bgremove.rs:101-139<\/a>), both reached through <code>to_cpu<\/code>. See <a href=\"#\" data-goto=\"d-plat\">D-PLAT<\/a> for the web build.<\/p>"}, "quotes_html": ["Delos will extensively display and manipulate images.", "Using GPU acceleration wherever possible is a requirement for this project."]}, {"id": "R4", "title": "Graceful CPU fallback", "anchor": "r4", "file": "01-product-and-platform.md", "line": 67, "area": "1 · Product and platform requirements", "kind": "clause", "status": "Implemented", "quotes": ["However, in case GPU acceleration is not available, Delos should degrade gracefully to CPU rendering."], "sections": {"Status": "Implemented. The fallback works at four levels: no adapter, a kernel that does not compile, a device error during the session, and a tile larger than the GPU's texture limit.", "Implemented by": "- `Gpu::new` returns `None` when `DELOS_NO_GPU` is set, when no adapter exists, or when initialisation fails or panics ([gpu.rs:91-109](../../src/engine/gpu.rs#L91)); software adapters are refused in `init` ([gpu.rs:117-119](../../src/engine/gpu.rs#L117)).\n- A kernel whose WGSL fails validation is cached as `None` by `pipeline` and runs on the CPU ([gpu.rs:221-250](../../src/engine/gpu.rs#L221)).\n- A device error sets `failed`, so `healthy` turns false ([gpu.rs:134-137](../../src/engine/gpu.rs#L134)) and `active_gpu` stops returning the GPU ([engine/mod.rs:146](../../src/engine/mod.rs#L146)).\n- Tiles beyond `max_dim` are not sent to the GPU: `fits` ([gpu.rs:217-219](../../src/engine/gpu.rs#L217)), checked in `Ctx::kernel` ([engine/mod.rs:284-289](../../src/engine/mod.rs#L284)).\n- The CPU path of `Ctx::kernel` runs `run_cpu` ([engine/mod.rs:311-323](../../src/engine/mod.rs#L311)).", "Tests": "`tests/engine.rs::gpu_matches_cpu`, `tests/gpu_pool.rs::reused_textures_do_not_leak_stale_pixels`, `tests/resident.rs::gpu_sampling_matches_cpu`. The large-image tests run both backends: `tests/large_images.rs::preview_16k_is_interactive`.", "Notes": "The toolbar badge shows `backend_name` and toggles `use_gpu` at run time ([mod.rs:429-443](../../src/ui/mod.rs#L429)); `active_gpu` returns no GPU while `use_gpu` is off ([engine/mod.rs:143-145](../../src/engine/mod.rs#L143)). The spec asks only for the automatic fallback. Graceful means the same pixels: the parity tests compare every kernel on both backends. The fallback *paths* (compile failure, device loss) are not exercised by any test."}, "citations": [{"entry": "R4", "section": "Implemented by", "path": "src/engine/gpu.rs", "start": 91, "end": 109, "md": "01-product-and-platform.md:74"}, {"entry": "R4", "section": "Implemented by", "path": "src/engine/gpu.rs", "start": 117, "end": 119, "md": "01-product-and-platform.md:74"}, {"entry": "R4", "section": "Implemented by", "path": "src/engine/gpu.rs", "start": 221, "end": 250, "md": "01-product-and-platform.md:75"}, {"entry": "R4", "section": "Implemented by", "path": "src/engine/gpu.rs", "start": 134, "end": 137, "md": "01-product-and-platform.md:76"}, {"entry": "R4", "section": "Implemented by", "path": "src/engine/mod.rs", "start": 146, "end": 146, "md": "01-product-and-platform.md:76"}, {"entry": "R4", "section": "Implemented by", "path": "src/engine/gpu.rs", "start": 217, "end": 219, "md": "01-product-and-platform.md:77"}, {"entry": "R4", "section": "Implemented by", "path": "src/engine/mod.rs", "start": 284, "end": 289, "md": "01-product-and-platform.md:77"}, {"entry": "R4", "section": "Implemented by", "path": "src/engine/mod.rs", "start": 311, "end": 323, "md": "01-product-and-platform.md:78"}, {"entry": "R4", "section": "Notes", "path": "src/ui/mod.rs", "start": 429, "end": 443, "md": "01-product-and-platform.md:82"}, {"entry": "R4", "section": "Notes", "path": "src/engine/mod.rs", "start": 143, "end": 145, "md": "01-product-and-platform.md:82"}], "tests": ["tests/engine.rs::gpu_matches_cpu", "tests/gpu_pool.rs::reused_textures_do_not_leak_stale_pixels", "tests/resident.rs::gpu_sampling_matches_cpu", "tests/large_images.rs::preview_16k_is_interactive"], "links": [], "sections_html": {"Status": "<p>Implemented. The fallback works at four levels: no adapter, a kernel that does not compile, a device error during the session, and a tile larger than the GPU's texture limit.<\/p>", "Implemented by": "<ul><li><code>Gpu::new<\/code> returns <code>None<\/code> when <code>DELOS_NO_GPU<\/code> is set, when no adapter exists, or when initialisation fails or panics (<a href=\"../../src/engine/gpu.rs#L91\" target=\"_blank\">gpu.rs:91-109<\/a>); software adapters are refused in <code>init<\/code> (<a href=\"../../src/engine/gpu.rs#L117\" target=\"_blank\">gpu.rs:117-119<\/a>).<\/li><li>A kernel whose WGSL fails validation is cached as <code>None<\/code> by <code>pipeline<\/code> and runs on the CPU (<a href=\"../../src/engine/gpu.rs#L221\" target=\"_blank\">gpu.rs:221-250<\/a>).<\/li><li>A device error sets <code>failed<\/code>, so <code>healthy<\/code> turns false (<a href=\"../../src/engine/gpu.rs#L134\" target=\"_blank\">gpu.rs:134-137<\/a>) and <code>active_gpu<\/code> stops returning the GPU (<a href=\"../../src/engine/mod.rs#L146\" target=\"_blank\">engine/mod.rs:146<\/a>).<\/li><li>Tiles beyond <code>max_dim<\/code> are not sent to the GPU: <code>fits<\/code> (<a href=\"../../src/engine/gpu.rs#L217\" target=\"_blank\">gpu.rs:217-219<\/a>), checked in <code>Ctx::kernel<\/code> (<a href=\"../../src/engine/mod.rs#L284\" target=\"_blank\">engine/mod.rs:284-289<\/a>).<\/li><li>The CPU path of <code>Ctx::kernel<\/code> runs <code>run_cpu<\/code> (<a href=\"../../src/engine/mod.rs#L311\" target=\"_blank\">engine/mod.rs:311-323<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/engine.rs::gpu_matches_cpu<\/code>, <code>tests/gpu_pool.rs::reused_textures_do_not_leak_stale_pixels<\/code>, <code>tests/resident.rs::gpu_sampling_matches_cpu<\/code>. The large-image tests run both backends: <code>tests/large_images.rs::preview_16k_is_interactive<\/code>.<\/p>", "Notes": "<p>The toolbar badge shows <code>backend_name<\/code> and toggles <code>use_gpu<\/code> at run time (<a href=\"../../src/ui/mod.rs#L429\" target=\"_blank\">mod.rs:429-443<\/a>); <code>active_gpu<\/code> returns no GPU while <code>use_gpu<\/code> is off (<a href=\"../../src/engine/mod.rs#L143\" target=\"_blank\">engine/mod.rs:143-145<\/a>). The spec asks only for the automatic fallback. Graceful means the same pixels: the parity tests compare every kernel on both backends. The fallback *paths* (compile failure, device loss) are not exercised by any test.<\/p>"}, "quotes_html": ["However, in case GPU acceleration is not available, Delos should degrade gracefully to CPU rendering."]}, {"id": "F1", "title": "Load and display images as graph nodes", "anchor": "f1", "file": "02-editing-and-views.md", "line": 6, "area": "2 · Editing, views and export", "kind": "clause", "status": "Implemented", "quotes": ["Delos must be able to load and display existing images.", "Opening an image creates a \"layer\" containing that image.", "Layers are treated as graph nodes which can be connected using \"operators\"."], "sections": {"Status": "Implemented.", "Implemented by": "- Decoding goes through the `Codec` registry (`decode` picks the first codec that recognises the bytes) ([formats.rs:183-186](../../src/formats.rs#L183)). PNG, JPEG, WebP, GIF, BMP, TIFF and ICO are listed in `CODECS` ([formats.rs:152-164](../../src/formats.rs#L152)).\n- `Worker::import` reads and `decode`s the bytes in the background and builds a `SourceImage` with its mip pyramid, which it sends back as `Msg::Imported` ([worker.rs:248-256](../../src/worker.rs#L248), [worker.rs:266](../../src/worker.rs#L266), [worker.rs:270-277](../../src/worker.rs#L270)); `SourceImage::from_rgba8` premultiplies and builds the levels ([source.rs:43-65](../../src/engine/source.rs#L43)).\n- The \"layer\" is a `StaticImage` node ([basic.rs:62](../../src/nodes/basic.rs#L62)) whose `params` hold the image id and size as hidden parameters and whose `render` samples the image ([basic.rs:77-91](../../src/nodes/basic.rs#L77)). Nodes are connected by `Graph::connect` ([graph.rs:243-264](../../src/graph.rs#L243)).\n- Entry point: the toolbar's Import file input ([mod.rs:344-360](../../src/ui/mod.rs#L344)), through `session::import`, which hands the files to `start_imports` ([session.rs:100-103](../../src/ui/session.rs#L100), [session.rs:119-120](../../src/ui/session.rs#L119)).", "Tests": "`tests/engine.rs::native_render_reproduces_source`, `tests/project_e2e.rs::first_import_asks_and_creates_a_project`, `tests/project_e2e.rs::quick_mode_imports_without_copying`.", "Notes": "Dropping image files on the window (`ondrop`) also imports them through `session::import` ([mod.rs:86-90](../../src/ui/mod.rs#L86), [mod.rs:102-103](../../src/ui/mod.rs#L102))."}, "citations": [{"entry": "F1", "section": "Implemented by", "path": "src/formats.rs", "start": 183, "end": 186, "md": "02-editing-and-views.md:15"}, {"entry": "F1", "section": "Implemented by", "path": "src/formats.rs", "start": 152, "end": 164, "md": "02-editing-and-views.md:15"}, {"entry": "F1", "section": "Implemented by", "path": "src/worker.rs", "start": 248, "end": 256, "md": "02-editing-and-views.md:16"}, {"entry": "F1", "section": "Implemented by", "path": "src/worker.rs", "start": 266, "end": 266, "md": "02-editing-and-views.md:16"}, {"entry": "F1", "section": "Implemented by", "path": "src/worker.rs", "start": 270, "end": 277, "md": "02-editing-and-views.md:16"}, {"entry": "F1", "section": "Implemented by", "path": "src/engine/source.rs", "start": 43, "end": 65, "md": "02-editing-and-views.md:16"}, {"entry": "F1", "section": "Implemented by", "path": "src/nodes/basic.rs", "start": 62, "end": 62, "md": "02-editing-and-views.md:17"}, {"entry": "F1", "section": "Implemented by", "path": "src/nodes/basic.rs", "start": 77, "end": 91, "md": "02-editing-and-views.md:17"}, {"entry": "F1", "section": "Implemented by", "path": "src/graph.rs", "start": 243, "end": 264, "md": "02-editing-and-views.md:17"}, {"entry": "F1", "section": "Implemented by", "path": "src/ui/mod.rs", "start": 344, "end": 360, "md": "02-editing-and-views.md:18"}, {"entry": "F1", "section": "Implemented by", "path": "src/ui/session.rs", "start": 100, "end": 103, "md": "02-editing-and-views.md:18"}, {"entry": "F1", "section": "Implemented by", "path": "src/ui/session.rs", "start": 119, "end": 120, "md": "02-editing-and-views.md:18"}, {"entry": "F1", "section": "Notes", "path": "src/ui/mod.rs", "start": 86, "end": 90, "md": "02-editing-and-views.md:22"}, {"entry": "F1", "section": "Notes", "path": "src/ui/mod.rs", "start": 102, "end": 103, "md": "02-editing-and-views.md:22"}], "tests": ["tests/engine.rs::native_render_reproduces_source", "tests/project_e2e.rs::first_import_asks_and_creates_a_project", "tests/project_e2e.rs::quick_mode_imports_without_copying"], "links": [], "sections_html": {"Status": "<p>Implemented.<\/p>", "Implemented by": "<ul><li>Decoding goes through the <code>Codec<\/code> registry (<code>decode<\/code> picks the first codec that recognises the bytes) (<a href=\"../../src/formats.rs#L183\" target=\"_blank\">formats.rs:183-186<\/a>). PNG, JPEG, WebP, GIF, BMP, TIFF and ICO are listed in <code>CODECS<\/code> (<a href=\"../../src/formats.rs#L152\" target=\"_blank\">formats.rs:152-164<\/a>).<\/li><li><code>Worker::import<\/code> reads and <code>decode<\/code>s the bytes in the background and builds a <code>SourceImage<\/code> with its mip pyramid, which it sends back as <code>Msg::Imported<\/code> (<a href=\"../../src/worker.rs#L248\" target=\"_blank\">worker.rs:248-256<\/a>, <a href=\"../../src/worker.rs#L266\" target=\"_blank\">worker.rs:266<\/a>, <a href=\"../../src/worker.rs#L270\" target=\"_blank\">worker.rs:270-277<\/a>); <code>SourceImage::from_rgba8<\/code> premultiplies and builds the levels (<a href=\"../../src/engine/source.rs#L43\" target=\"_blank\">source.rs:43-65<\/a>).<\/li><li>The \"layer\" is a <code>StaticImage<\/code> node (<a href=\"../../src/nodes/basic.rs#L62\" target=\"_blank\">basic.rs:62<\/a>) whose <code>params<\/code> hold the image id and size as hidden parameters and whose <code>render<\/code> samples the image (<a href=\"../../src/nodes/basic.rs#L77\" target=\"_blank\">basic.rs:77-91<\/a>). Nodes are connected by <code>Graph::connect<\/code> (<a href=\"../../src/graph.rs#L243\" target=\"_blank\">graph.rs:243-264<\/a>).<\/li><li>Entry point: the toolbar's Import file input (<a href=\"../../src/ui/mod.rs#L344\" target=\"_blank\">mod.rs:344-360<\/a>), through <code>session::import<\/code>, which hands the files to <code>start_imports<\/code> (<a href=\"../../src/ui/session.rs#L100\" target=\"_blank\">session.rs:100-103<\/a>, <a href=\"../../src/ui/session.rs#L119\" target=\"_blank\">session.rs:119-120<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/engine.rs::native_render_reproduces_source<\/code>, <code>tests/project_e2e.rs::first_import_asks_and_creates_a_project<\/code>, <code>tests/project_e2e.rs::quick_mode_imports_without_copying<\/code>.<\/p>", "Notes": "<p>Dropping image files on the window (<code>ondrop<\/code>) also imports them through <code>session::import<\/code> (<a href=\"../../src/ui/mod.rs#L86\" target=\"_blank\">mod.rs:86-90<\/a>, <a href=\"../../src/ui/mod.rs#L102\" target=\"_blank\">mod.rs:102-103<\/a>).<\/p>"}, "quotes_html": ["Delos must be able to load and display existing images.", "Opening an image creates a \"layer\" containing that image.", "Layers are treated as graph nodes which can be connected using \"operators\"."]}, {"id": "F1.1", "title": "Import creates a Static Image connected to the output", "anchor": "f1-1", "file": "02-editing-and-views.md", "line": 24, "area": "2 · Editing, views and export", "kind": "clause", "status": "Implemented", "quotes": ["Importing an image to Delos specifically creates a \"Static Image\" node connected directly to the output."], "sections": {"Status": "Implemented.", "Implemented by": "- `finish_import` adds the `ids::IMAGE` node and, for `ImportTarget::Output`, connects it to the output's only port with `connect` ([mod.rs:255-268](../../src/ui/mod.rs#L255)). The target enum cites this spec item: `ImportTarget` ([state.rs:68-72](../../src/ui/state.rs#L68)). Image files dropped on the window are imported with `ImportTarget::Output` too (`ondrop`) ([mod.rs:86-90](../../src/ui/mod.rs#L86), [mod.rs:102-103](../../src/ui/mod.rs#L102)).\n- The kind's display name is \"Static Image\": `StaticImage::name` ([basic.rs:68-70](../../src/nodes/basic.rs#L68)).", "Tests": "`tests/project_e2e.rs::first_import_asks_and_creates_a_project` (checks the saved expression).", "Notes": "Connecting replaces whatever fed the output, so importing a second image leaves the first one in the graph but detached, and resets the relocated output and selection (`pinned`, `select`). That follows the clause literally; whether it is the intended experience is a decision ([D-IMPORT](findings.md#d-import)). Imports into a layer stack use `ImportTarget::StackLayer` instead."}, "citations": [{"entry": "F1.1", "section": "Implemented by", "path": "src/ui/mod.rs", "start": 255, "end": 268, "md": "02-editing-and-views.md:31"}, {"entry": "F1.1", "section": "Implemented by", "path": "src/ui/state.rs", "start": 68, "end": 72, "md": "02-editing-and-views.md:31"}, {"entry": "F1.1", "section": "Implemented by", "path": "src/ui/mod.rs", "start": 86, "end": 90, "md": "02-editing-and-views.md:31"}, {"entry": "F1.1", "section": "Implemented by", "path": "src/ui/mod.rs", "start": 102, "end": 103, "md": "02-editing-and-views.md:31"}, {"entry": "F1.1", "section": "Implemented by", "path": "src/nodes/basic.rs", "start": 68, "end": 70, "md": "02-editing-and-views.md:32"}], "tests": ["tests/project_e2e.rs::first_import_asks_and_creates_a_project"], "links": ["findings.md#d-import"], "sections_html": {"Status": "<p>Implemented.<\/p>", "Implemented by": "<ul><li><code>finish_import<\/code> adds the <code>ids::IMAGE<\/code> node and, for <code>ImportTarget::Output<\/code>, connects it to the output's only port with <code>connect<\/code> (<a href=\"../../src/ui/mod.rs#L255\" target=\"_blank\">mod.rs:255-268<\/a>). The target enum cites this spec item: <code>ImportTarget<\/code> (<a href=\"../../src/ui/state.rs#L68\" target=\"_blank\">state.rs:68-72<\/a>). Image files dropped on the window are imported with <code>ImportTarget::Output<\/code> too (<code>ondrop<\/code>) (<a href=\"../../src/ui/mod.rs#L86\" target=\"_blank\">mod.rs:86-90<\/a>, <a href=\"../../src/ui/mod.rs#L102\" target=\"_blank\">mod.rs:102-103<\/a>).<\/li><li>The kind's display name is \"Static Image\": <code>StaticImage::name<\/code> (<a href=\"../../src/nodes/basic.rs#L68\" target=\"_blank\">basic.rs:68-70<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/project_e2e.rs::first_import_asks_and_creates_a_project<\/code> (checks the saved expression).<\/p>", "Notes": "<p>Connecting replaces whatever fed the output, so importing a second image leaves the first one in the graph but detached, and resets the relocated output and selection (<code>pinned<\/code>, <code>select<\/code>). That follows the clause literally; whether it is the intended experience is a decision (<a href=\"#\" data-goto=\"d-import\">D-IMPORT<\/a>). Imports into a layer stack use <code>ImportTarget::StackLayer<\/code> instead.<\/p>"}, "quotes_html": ["Importing an image to Delos specifically creates a \"Static Image\" node connected directly to the output."]}, {"id": "F1.2", "title": "Operator parameters: WYSIWYG or form", "anchor": "f1-2", "file": "02-editing-and-views.md", "line": 38, "area": "2 · Editing, views and export", "kind": "clause", "status": "Implemented", "quotes": ["Operators may have parameters.", "In case they do, adding the operator node will allow the user to input the operator parameters either via a WYSIWYG interface or via form inputs."], "sections": {"Status": "Implemented. Every parameter has a generated form field; the five kinds of on-canvas control cover the spatial parameters (axes, borders, rectangles, points, canvas size).", "Implemented by": "- Parameters are declared as `ParamDef` values ([nodes/mod.rs:76-85](../../src/nodes/mod.rs#L76)) of a few `ParamKind`s ([nodes/mod.rs:53-66](../../src/nodes/mod.rs#L53)); on-canvas controls as `Overlay` values ([nodes/mod.rs:170-182](../../src/nodes/mod.rs#L170)).\n- `App::add_node` selects the new node ([state.rs:487](../../src/ui/state.rs#L487)), so the inspector's `NodePanel` shows its parameters ([inspector.rs:189-198](../../src/ui/inspector.rs#L189)), rendered per kind by `ParamField` ([inspector.rs:249-401](../../src/ui/inspector.rs#L249)).\n- The image view draws and drags each `Overlay` in `render_overlay` ([image_view.rs:370-510](../../src/ui/image_view.rs#L370)); drags write parameters with `set_param`, and the canvas corner writes `canvas_w`/`canvas_h` ([image_view.rs:245-286](../../src/ui/image_view.rs#L245)).", "Tests": "None for the forms or overlays (UI rendering is not tested).", "Notes": "Which nodes get WYSIWYG controls: Reflection (axis), Clip and Rectangle Split (rectangle), Vertical/Horizontal Split (line), Linear and Radial Gradient (points), and the output canvas of size-less content (corner handle). Fraction parameters show and accept pixels in the form (`ParamKind::Fraction`), converted with the extent of the space the controls live in."}, "citations": [{"entry": "F1.2", "section": "Implemented by", "path": "src/nodes/mod.rs", "start": 76, "end": 85, "md": "02-editing-and-views.md:46"}, {"entry": "F1.2", "section": "Implemented by", "path": "src/nodes/mod.rs", "start": 53, "end": 66, "md": "02-editing-and-views.md:46"}, {"entry": "F1.2", "section": "Implemented by", "path": "src/nodes/mod.rs", "start": 170, "end": 182, "md": "02-editing-and-views.md:46"}, {"entry": "F1.2", "section": "Implemented by", "path": "src/ui/state.rs", "start": 487, "end": 487, "md": "02-editing-and-views.md:47"}, {"entry": "F1.2", "section": "Implemented by", "path": "src/ui/inspector.rs", "start": 189, "end": 198, "md": "02-editing-and-views.md:47"}, {"entry": "F1.2", "section": "Implemented by", "path": "src/ui/inspector.rs", "start": 249, "end": 401, "md": "02-editing-and-views.md:47"}, {"entry": "F1.2", "section": "Implemented by", "path": "src/ui/image_view.rs", "start": 370, "end": 510, "md": "02-editing-and-views.md:48"}, {"entry": "F1.2", "section": "Implemented by", "path": "src/ui/image_view.rs", "start": 245, "end": 286, "md": "02-editing-and-views.md:48"}], "tests": [], "links": [], "sections_html": {"Status": "<p>Implemented. Every parameter has a generated form field; the five kinds of on-canvas control cover the spatial parameters (axes, borders, rectangles, points, canvas size).<\/p>", "Implemented by": "<ul><li>Parameters are declared as <code>ParamDef<\/code> values (<a href=\"../../src/nodes/mod.rs#L76\" atus": "Implemented", "quotes": ["While an image is being edited in Delos, we will be able to visualize the final results.", "During the process of editing, however, the image will be stored as a Directed Acyclic Graph (DAG) representing image layers and operations applied to them.", "That way, we can easily see and modify effects are being applied to which parts of the image."], "sections": {"Status": "Implemented.", "Implemented by": "- `Graph` holds `nodes`, the `output` node id and the decoded `images` ([graph.rs:66-72](../../src/graph.rs#L66)); edges live on the consumer as `inputs`, an `Option<Link>` per input port ([graph.rs:41](../../src/graph.rs#L41)).\n- Acyclicity: `connect` refuses an edge when `depends_on` finds a path back ([graph.rs:255-257](../../src/graph.rs#L255), [graph.rs:224-239](../../src/graph.rs#L224)). Wires drawn in the graph view go through `connect` (`connect_port`) ([graph_view.rs:115-118](../../src/ui/graph_view.rs#L115)); stack edits check the same with `depends_on` ([graph_view.rs:120-124](../../src/ui/graph_view.rs#L120)).\n- Rendering pulls through the graph: `Ctx::render` asks a node's `render_output`, which renders its inputs through `render_input` ([engine/mod.rs:208](../../src/engine/mod.rs#L208), [engine/mod.rs:219-224](../../src/engine/mod.rs#L219)).", "Tests": "`tests/engine.rs::cycles_are_rejected`, `tests/engine.rs::invert_and_stack`.", "Notes": "Some writers set `inputs` directly without the cycle check (`set_stack_layers`, `insert_resize`, the expression builder). They are safe by construction today; the invariants model lists this as fragile spot 2 ([../invariants/findings.md](../invariants/findings.md))."}, "citations": [{"entry": "F2", "section": "Implemented by", "path": "src/graph.rs", "start": 66, "end": 72, "md": "02-editing-and-views.md:63"}, {"entry": "F2", "section": "Implemented by", "path": "src/graph.rs", "start": 41, "end": 41, "md": "02-editing-and-views.md:63"}, {"entry": "F2", "section": "Implemented by", e's <code>render_output<\/code>, which renders its inputs through <code>render_input<\/code> (<a href=\"../../src/engine/mod.rs#L208\" target=\"_blank\">engine/mod.rs:208<\/a>, <a href=\"../../src/engine/mod.rs#L219\" target=\"_blank\">engine/mod.rs:219-224<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/engine.rs::cycles_are_rejected<\/code>, <code>tests/engine.rs::invert_and_stack<\/code>.<\/p>", "Notes": "<p>Some writers set <code>inputs<\/code> directly without the cycle check (<code>set_stack_layers<\/code>, <code>insert_resize<\/code>, the expression builder). They are safe by construction today; the invariants model lists this as fragile spot 2 (<a href=\"#\" data-goto=\"\">../invariants/findings.md<\/a>).<\/p>"}, "quotes_html": ["While an image is being edited in Delos, we will be able to visualize the final results.", "During the process of editing, however, the image will be stored as a Directed Acyclic Graph (DAG) representing image layers and operations applied to them.", "That way, we can easily see and modify effects are being applied to which parts of the image."]}, {"id": "F2.1", "title": "The image view shows what goes to the output", "anchor": "f2-1", "file": "02-editing-and-views.md", "line": 71, "area": "2 · Editing, views and export", "kind": "clause", "status": "Partial", "quotes": ["The image view must show the image that is being sent to the output."], "sections": {"Status": "Partial. By default the view shows the output, as specified. A known defect can leave a stale image on screen after an undo or a new document ([D-STALE](findings.md#d-stale)).", "Implemented by": "- `App::displayed` falls back to `output` (or the relocated output) as `base` when nothing is selected or the view is locked, and returns it as the `target` ([state.rs:351-356](../../src/ui/state.rs#L351), [state.rs:376-378](../../src/ui/state.rs#L376), [state.rs:385](../../src/ui/state.rs#L385)).\n- The image view sends a `PreviewJob` for `d.target` whenever its key changes ([image_view.rs:83-125](../../src/ui/image_view.rs#L83)). The worker renders it with latest-request-wins `run_preview` ([worker.rs:179-182](../../src/worker.rs#L179), [worker.rs:208-216](../../src/worker.rs#L208)); `pump` accepts only newer frames ([mod.rs:134-151](../../src/ui/mod.rs#L134)).", "Tests": "None for the default view (no test calls `displayed` without a relocation or selection). Rendering itself: `tests/engine.rs::invert_and_stack`.", "Notes": "The preview key is the structural hash of the target, so edits that do not change the shown image (moving nodes) do not re-render. That hash is also the root of the stale-image defect."}, "citations": [{"entry": "F2.1", "section": "Implemented by", "path": "src/ui/state.rs", "start": 351, "end": 356, "md": "02-editing-and-views.md:78"}, {"entry": "F2.1", "section": "Implemented by", "path": "src/ui/state.rs", "start": 376, "end": 378, "md": "02-editing-and-views.md:78"}, {"entry": "F2.1", "section": "Implemented by", "path": "src/ui/state.rs", "start": 385, "end": 385, "md": "02-editing-and-views.md:78"}, {"entry": "F2.1", "section": "Implemented by", "path": "src/ui/image_view.rs", "start": 83, "end": 125, "md": "02-editing-and-views.md:79"}, {"entry": "F2.1", "section": "Implemented by", "path": "src/worker.rs", "start": 179, "end": 182, "md": "02-editing-and-views.md:79"}, {"entry": "F2.1", "section": "Implemented by", "path": "src/worker.rs", "start": 208, "end": 216, "md": "02-editing-and-views.md:79"}, {"entry": "F2.1", "section": "Implemented by", "path": "src/ui/mod.rs", "start": 134, "end": 151, "md": "02-editing-and-views.md:79"}], "tests": ["tests/engine.rs::invert_and_stack"], "links": ["findings.md#d-stale"], "sections_html": {"Status": "<p>Partial. By default the view shows the output, as specified. A known defect can leave a stale image on screen after an undo or a new document (<a href=\"#\" data-goto=\"d-stale\">D-STALE<\/a>).<\/p>", "Implemented by": "<ul><li><code>App::displayed<\/code> falls back stead of the image view or alongside the image view.", "It must also be possible to visualize any part of the graph which produces an image."]}, {"id": "F3.1", "title": "Relocating the output", "anchor": "f3-1", "file": "02-editing-and-views.md", "line": 98, "area": "2 · Editing, views and export", "kind": "clause", "status": "Implemented", "quotes": ["In other terms, we can temporarily relocate the output to any image node."], "sections": {"Status": "Implemented.", "Implemented by": "- The relocated output is `App::pinned`, an `Option<Link>` ([state.rs:114-115](../../src/ui/state.rs#L114)); `displayed` uses it as the `base` while it names an existing output (`has_link`) ([state.rs:351-356](../../src/ui/state.rs#L351)).\n- Ways to set `pinned`: double-click in the graph view ([F3.1.1](#f3-1-1)) and the inspector's \"View as output\" buttons ([inspector.rs:131-153](../../src/ui/inspector.rs#L131)). The toolbar badge's Reset clears `pinned` ([mod.rs:422](../../src/ui/mod.rs#L422)).\n- Undo, redo and deletions drop a `pinned` link that no longer exists: `fix_selection` ([state.rs:291](../../src/ui/state.rs#L291), [state.rs:296-298](../../src/ui/state.rs#L296)), `delete_node` ([state.rs:531-533](../../src/ui/state.rs#L531)).", "Tests": "`tests/ui_state.rs::delete_relocated_node_resets_output`, `tests/ui_state.rs::delete_selected_node_while_output_is_relocated`, `tests/ui_state.rs::a_split_output_can_be_viewed_and_exported`.", "Notes": "\"Temporarily\": `pinned` is UI state, never saved in the project, and is cleared by `replace_document` when a project is opened or closed."}, "citations": [{"entry": "F3.1", "section": "Implemented by", "path": "src/ui/state.rs", "start": 114, "end": 115, "md": "02-editing-and-views.md:105"}, {"entry": "F3.1", "section": "Implemented by", "path": "src/ui/state.rs", "start": 351, "end": 356, "md": "02-editing-and-views.md:105"}, {"entry": "F3.1", "section": "Implemented by", "path": "src/ui/inspector.rs", "start": 131, "end": 153, "md": " 531\" target=\"_blank\">state.rs:531-533<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/ui_state.rs::delete_relocated_node_resets_output<\/code>, <code>tests/ui_state.rs::delete_selected_node_while_output_is_relocated<\/code>, <code>tests/ui_state.rs::a_split_output_can_be_viewed_and_exported<\/code>.<\/p>", "Notes": "<p>\"Temporarily\": <code>pinned<\/code> is UI state, never saved in the project, and is cleared by <code>replace_document<\/code> when a project is opened or closed.<\/p>"}, "quotes_html": ["In other terms, we can temporarily relocate the output to any image node."]}, {"id": "F3.1.1", "title": "Double-click to relocate and to reset", "anchor": "f3-1-1", "file": "02-editing-and-views.md", "line": 113, "area": "2 · Editing, views and export", "kind": "clause", "status": "Implemented", "quotes": ["Double-clicking a node in the graph view relocates the output to it.", "For nodes with several outputs, double-clicking one of its output ports relocates the output to that output.", "Double-clicking the relocated node again, or the Output node, moves the output back to its default."], "sections": {"Status": "Implemented.", "Implemented by": "- The node's `ondoubleclick` toggles `pinned`: the output node or an already relocated node resets it, any other node sets its first output ([graph_view.rs:346-354](../../src/ui/graph_view.rs#L346)).\n- Each output port has its own `ondoubleclick`, which pins `Link::new(id, o)` or resets it if that port is the one shown ([graph_view.rs:367-368](../../src/ui/graph_view.rs#L367), [graph_view.rs:381-385](../../src/ui/graph_view.rs#L381)).", "Tests": "None (graph-view events are not tested; `tests/ui_state.rs::a_split_output_can_be_viewed_and_exported` sets `pinned` directly).", "Notes": "Double-clicking the *body* of a split relocates to output 0 (`id.into()`), and double-clicking the body of a split pinned on output 1 resets the output instead of switching to output 0."}, "citations": [{"entry": "F3.1.1", "section": "Implemen  "area": "2 · Editing, views and export", "kind": "clause", "status": "Implemented", "quotes": ["If we select an operator node, the image view should show the image at the operator's output overlaid with controls for the specific operator (examples of controls: selection boxes, rules).", "Examples are given in the operators section below."], "sections": {"Status": "Implemented.", "Implemented by": "- `displayed`, when not locked, targets the selected node and sets `editing` with an identity `overlay_space` ([state.rs:357-365](../../src/ui/state.rs#L357)).\n- `ImageView` draws the overlays of the `editing` node ([image_view.rs:159-160](../../src/ui/image_view.rs#L159)) with `render_overlay` ([image_view.rs:370-510](../../src/ui/image_view.rs#L370)).\n- \"Preview selection\" is the `follow_selection` checkbox ([mod.rs:410-416](../../src/ui/mod.rs#L410)), on by default (`App::new`) ([state.rs:152](../../src/ui/state.rs#L152)).", "Tests": "`tests/ui_state.rs::previewing_a_split_shows_its_input_with_the_border`."}, "citations": [{"entry": "F3.2", "section": "Implemented by", "path": "src/ui/state.rs", "start": 357, "end": 365, "md": "02-editing-and-views.md:137"}, {"entry": "F3.2", "section": "Implemented by", "path": "src/ui/image_view.rs", "start": 159, "end": 160, "md": "02-editing-and-views.md:138"}, {"entry": "F3.2", "section": "Implemented by", "path": "src/ui/image_view.rs", "start": 370, "end": 510, "md": "02-editing-and-views.md:138"}, {"entry": "F3.2", "section": "Implemented by", "path": "src/ui/mod.rs", "start": 410, "end": 416, "md": "02-editing-and-views.md:139"}, {"entry": "F3.2", "section": "Implemented by", "path": "src/ui/state.rs", "start": 152, "end": 152, "md": "02-editing-and-views.md:139"}], "tests": ["tests/ui_state.rs::previewing_a_split_shows_its_input_with_the_border"], "links": [], "sections_html": {"Status": "<p>Implemented.<\/p>", "Implemented by": "<ul><li><code>displayed<\/code>, when not locked, targets the selected node and sets <code>editing<\/code> with an identity <code>overlay_space<\/code> (<a href=\"../../src/ui/state.rs#L357\" target=\"_blank\">state.rs:357-365<\/a>).<\/li><li><code>ImageView<\/code> draws the overlays of the <code>editing<\/code> node (<a href=\"../../src/ui/image_view.rs#L159\" target=\"_blank\">image_view.rs:159-160<\/a>) with <code>render_overlay<\/code> (<a href=\"../../src/ui/image_view.rs#L370\" target=\"_blank\">image_view.rs:370-510<\/a>).<\/li><li>\"Preview selection\" is the <code>follow_selection<\/code> checkbox (<a href=\"../../src/ui/mod.rs#L410\" target=\"_blank\">mod.rs:410-416<\/a>), on by default (<code>App::new<\/code>) (<a href=\"../../src/ui/state.rs#L152\" target=\"_blank\">state.rs:152<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/ui_state.rs::previewing_a_split_shows_its_input_with_the_border<\/code>.<\/p>"}, "quotes_html": ["If we select an operator node, the image view should show the image at the operator's output overlaid with controls for the specific operator (examples of controls: selection boxes, rules).", "Examples are given in the operators section below."]}, {"id": "F3.2.1", "title": "Some operators are edited on their input", "anchor": "f3-2-1", "file": "02-editing-and-views.md", "line": 143, "area": "2 · Editing, views and export", "kind": "clause", "status": "Implemented", "quotes": ["Some operators are edited on their input instead.", "For example, Clip shows the uncropped input with the crop rectangle."], "sections": {"Status": "Implemented.", "Implemented by": "- The `EditView` enum: `Output` or `Input(port)` ([nodes/mod.rs:184-192](../../src/nodes/mod.rs#L184)), returned by `NodeKind::edit_view` ([nodes/mod.rs:226-228](../../src/nodes/mod.rs#L226)).\n- `Clip::edit_view` and `Split::edit_view` return `EditView::Input(0)` ([basic.rs:340-342](../../src/nodes/basic.rs#L340), [split.rs:103-106](../../src/nodes/split.rs#L103)).\n- `displayed` shows the input link for `EditView::Input` ([state.rs:360-363](../../src/ui/state.rs#L360)); in the locked case it composes the kind's `input_map` so the controls land on the input's space ([state.rs:370-374](../../src/ui/state.rs#L370)).\n- The inspector converts fractions with the input's extent for such kinds (`param_extent`) ([inspector.rs:63-71](../../src/ui/inspector.rs#L63)).", "Tests": "`tests/ui_state.rs::previewing_a_split_shows_its_input_with_the_border`."}, "citations": [{"entry": "F3.2.1", "section": "Implemented by", "path": "src/nodes/mod.rs", "start": 184, "end": 192, "md": "02-editing-and-views.md:151"}, {"entry": "F3.2.1", "section": "Implemented by", "path": "src/nodes/mod.rs", "start": 226, "end": 228, "md": "02-editing-and-views.md:151"}, {"entry": "F3.2.1", "section": "Implemented by", "path": "src/nodes/basic.rs", "start": 340, "end": 342, "md": "02-editing-and-views.md:152"}, {"entry": "F3.2.1", "section": "Implemented by", "path": "src/nodes/split.rs", "start": 103, "end": 106, "md": "02-editing-and-views.md:152"}, {"entry": "F3.2.1", "section": "Implemented by", "path": "src/ui/state.rs", "start": 360, "end": 363, "md": "02-editing-and-views.md:153"}, {"entry": "F3.2.1", "section": "Implemented by", "path": "src/ui/state.rs", "start": 370, "end": 374, "md": "02-editing-and-views.md:153"}, {"entry": "F3.2.1", "section": "Implemented by", "path": "src/ui/inspector.rs", "start": 63, "end": 71, "md": "02-editing-and-views.md:154"}], "tests": ["tests/ui_state.rs::previewing_a_split_shows_its_input_with_the_border"], "links": [], "sections_html": {"Status": "<p>Implemented.<\/p>", "Implemented by": "<ul><li>The <code>EditView<\/code> enum: <code>Output<\/code> or <code>Input(port)<\/code> (<a href=\"../../src/nodes/mod.rs#L184\" target=\"_blank\">nodes/mod.rs:184-192<\/a>), returned by <code>NodeKind::edit_view<\/code> (<a href=\"../../src/nodes/mod.rs#L226\" target=\"_blank\">nodes/mod.rs:226-228<\/a>).<\/li><li><code>Clip::edit_view<\/code> and <code>Split::edit_view<\/code> return <code>EditView::Input(0)<\/code> (<a href=\"../../src/nodes/basic.rs#L340\" target=\"_blank\">basic.rs:340-342<\/a>, <a href=\"../../src/nodes/split.rs#L103\" target=\"_blank\">split.rs:103-106<\/a>).<\/li><li><code>displayed<\/code> shows the input link for <code>EditView::Input<\/code> (<a href=\"../../src/ui/state.rs#L360\" target=\"_blank\">state.rs:360-363<\/a>); in the locked case it composes the kind's <code>input_map<\/code> so the controls land on the input's space (<a href=\"../../src/ui/state.rs#L370\" target=\"_blank\">state.rs:370-374<\/a>).<\/li><li>The inspector converts fractions with the input's extent for such kinds (<code>param_extent<\/code>) (<a href=\"../../src/ui/inspector.rs#L63\" target=\"_blank\">inspector.rs:63-71<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/ui_state.rs::previewing_a_split_shows_its_input_with_the_border<\/code>.<\/p>"}, "quotes_html": ["Some operators are edited on their input instead.", "For example, Clip shows the uncropped input with the crop rectangle."]}, {"id": "F3.3", "title": "Keep the view fixed while editing upstream", "anchor": "f3-3", "file": "02-editing-and-views.md", "line": 158, "area": "2 · Editing, views and export", "kind": "clause", "status": "Implemented", "quotes": ["It must be possible to keep the image view fixed while editing a node further up the graph.", "While the output is relocated (or when \"Preview selection\" is turned off), selecting another node keeps the view as it is and draws that node's controls over the shown image.", "Editing those controls modifies the shown image directly."], "sections": {"Status": "Implemented.", "Implemented by": "- \"Preview selection\" is the toolbar's `follow_selection` checkbox ([mod.rs:403](../../src/ui/mod.rs#L403), [mod.rs:410-416](../../src/ui/mod.rs#L410)). `displayed` is `locked` when `pinned` is set or `follow_selection` is off; the target stays on `base` and `overlay_space` comes from `Graph::space_map` ([state.rs:356](../../src/ui/state.rs#L356), [state.rs:366-377](../../src/ui/state.rs#L366)).\n- The overlays are mapped into the shown image's coordinates through `to_frac` and `frac_to_screen` ([image_view.rs:161-165](../../src/ui/image_view.rs#L161)); the mapping is frozen while dragging (`frac_map`) ([image_view.rs:38-41](../../src/ui/image_view.rs#L38)).\n- A drag writes the upstream node's parameters (`set_param`, `edit_coalesced`); the shown image's hash changes and it is re-rendered ([image_view.rs:245-276](../../src/ui/image_view.rs#L245)).", "Tests": "`tests/engine.rs::space_map_follows_geometry_upstream` (the mapping). The locked UI path has no test.", "Notes": "The edit `badge` says \"Editing X · showing Y\" ([image_view.rs:171-172](../../src/ui/image_view.rs#L171))."}, "citations": [{"entry": "F3.3", "section": "Implemented by", "path": "src/ui/mod.rs", "start": 403, "end": 403, "md": "02-editing-and-views.md:167"}, {"entry": "F3.3", "section": "Implemented by", "path": "src/ui/mod.rs", "start": 410, "end": 416, "md": "02-editing-and-views.md:167"}, {"entry": "F3.3", "section": "Implemented by", "path": "src/ui/state.rs", "start": 356, "end": 356, "md": "02-editing-and-views.md:167"}, {"entry": "F3.3", "section": "Implemented by", "path": "src/ui/state.rs", "start": 366, "end": 377, "md": "02-editing-and-views.md:167"}, {"entry": "F3.3", "section": "Implemented by", "path": "src/ui/image_view.rs", "start": 161, "end": 165, "md": "02-editing-and-views.md:168"}, {"entry": "F3.3", "section": "Implemented by", "path": "src/ui/image_view.rs", "start": 38, "end": 41, "md": "02-editing-and-views.md:168"}, {"entry": "F3.3", "section": "Implemented by", "path": "src/ui/image_view.rs", "start": 245, "end": 276, "md": "02-editing-and-views.md:169"}, {"entry": "F3.3", "section": "Notes", "path": "src/ui/image_view.rs", "start": 171, "end": 172, "md": "02-editing-and-views.md:173"}], "tests": ["tests/engine.rs::space_map_follows_geometry_upstream"], "links": [], "sections_html": {"Status": "<p>Implemented.<\/p>", "Implemented by": "<ul><li>\"Preview selection\" is the toolbar's <code>follow_selection<\/code> checkbox (<a href=\"../../src/ui/mod.rs#L403\" target=\"_blank\">mod.rs:403<\/a>, <a href=\"../../src/ui/mod.rs#L410\" target=\"_blank\">mod.rs:410-416<\/a>). <code>displayed<\/code> is <code>locked<\/code> when <code>pinned<\/code> is set or <code>follow_selection<\/code> is off; the target stays on <code>base<\/code> and <code>overlay_space<\/code> comes from <code>Graph::space_map<\/code> (<a href=\"../../src/ui/state.rs#L356\" target=\"_blank\">state.rs:356<\/a>, <a href=\"../../src/ui/state.rs#L366\" target=\"_blank\">state.rs:366-377<\/a>).<\/li><li>The overlays are mapped into the shown image's coordinates through <code>to_frac<\/code> and <code>frac_to_screen<\/code> (<a href=\"../../src/ui/image_view.rs#L161\" target=\"_blank\">image_view.rs:161-165<\/a>); the mapping is frozen while dragging (<code>frac_map<\/code>) (<a href=\"../../src/ui/image_view.rs#L38\" target=\"_blank\">image_view.rs:38-41<\/a>).<\/li><li>A drag writes the upstream node's parameters (<code>set_param<\/code>, <code>edit_coalesced<\/code>); the shown image's hash changes and it is re-rendered (<a href=\"../../src/ui/image_view.rs#L245\" target=\"_blank\">image_view.rs:245-276<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/engine.rs::space_map_follows_geometry_upstream<\/code> (the mapping). The locked UI path has no test.<\/p>", "Notes": "<p>The edit <code>badge<\/code> says \"Editing X · showing Y\" (<a href=\"../../src/ui/image_view.rs#L171\" target=\"_blank\">image_view.rs:171-172<\/a>).<\/p>"}, "quotes_html": ["It must be possible to keep the image view fixed while editing a node further up the graph.", "While the output is relocated (or when \"Preview selection\" is turned off), selecting another node keeps the view as it is and draws that node's controls over the shown image.", "Editing those controls modifies the shown image directly."]}, {"id": "F3.3.1", "title": "Controls follow geometry through intermediate nodes", "anchor": "f3-3-1", "file": "02-editing-and-views.md", "line": 175, "area": "2 · Editing, views and export", "kind": "clause", "status": "Partial", "quotes": ["Controls must be placed correctly even when nodes between the edited node and the shown image move or scale pixels (Clip, Resize, Downscale, …).", "Every node type describes how it maps coordinates to its inputs, so new node types can take part."], "sections": {"Status": "Partial. Clip, Resize and Downscale describe their maps, and `space_map` composes them. The map model is a separable affine map along one path, so two cases are not handled: a node whose map is not affine (Reflection folds the image), and an edited node that reaches the shown image along several paths with different geometry, where only the first path is used ([D-OVERLAY](findings.md#d-overlay)).", "Implemented by": "- The extension point: `NodeKind::input_map`, defaulting to an identity, top-left aligned map ([nodes/mod.rs:229-235](../../src/nodes/mod.rs#L229)).\n- Overrides: `Clip::input_map` (offset) ([basic.rs:343-348](../../src/nodes/basic.rs#L343)), `Resize::input_map` (scale, using the rounded effective factor) ([resize.rs:73-81](../../src/nodes/resize.rs#L73)), `Downscale::input_map` ([resize.rs:238-245](../../src/nodes/resize.rs#L238)).\n- Composition: `Graph::space_map` and `space_map_rec` walk the inputs depth-first, compose `Map2`s with `after`, and return the first path that reaches the edited node ([graph.rs:313-343](../../src/graph.rs#L313)).\n- `Map2` is separable (no rotation or shear) ([geom.rs:95-102](../../src/engine/geom.rs#L95)).", "Tests": "`tests/engine.rs::space_map_follows_geometry_upstream`. `tests/engine.rs::clip_offsets_input` checks the rendered pixels, which supports the note below.", "Notes": "Renders use the same `input_map` (Clip, Resize and Downscale call it from `render`), so the overlay mapping and the pixels cannot disagree for these kinds."}, "citations": [{"entry": "F3.3.1", "section": "Implemented by", "path": "src/nodes/mod.rs", "start": 229, "end": 235, "md": "02-editing-and-views.md:183"}, {"entry": "F3.3.1", "section": "Implemented by", "path": "src/nodes/basic.rs", "start": 343, "end": 348, "md": "02-editing-and-views.md:184"}, {"entry": "F3.3.1", "section": "Implemented by", "path": "src/nodes/resize.rs", "start": 73, "end": 81, "md": "02-editing-and-views.md:184"}, {"entry": "F3.3.1", "section": "Implemented by", "path": "src/nodes/resize.rs", "start": 238, "end": 245, "md": "02-editing-and-views.md:184"}, {"entry": "F3.3.1", "section": "Implemented by", "path": "src/graph.rs", "start": 313, "end": 343, "md": "02-editing-and-views.md:185"}, {"entry": "F3.3.1", "section": "Implemented by", "path": "src/engine/geom.rs", "start": 95, "end": 102, "md": "02-editing-and-views.md:186"}], "tests": ["tests/engine.rs::space_map_follows_geometry_upstream", "tests/engine.rs::clip_offsets_input"], "links": ["findings.md#d-overlay"], "sections_html": {"Status": "<p>Partial. Clip, Resize and Downscale describe their maps, and <code>space_map<\/code> composes them. The map model is a separable affine map along one path, so two cases are not handled: a node whose map is not affine (Reflection folds the image), and an edited node that reaches the shown image along several paths with different geometry, where only the first path is used (<a href=\"#\" data-goto=\"d-overlay\">D-OVERLAY<\/a>).<\/p>", "Implemented by": "<ul><li>The extension point: <code>NodeKind::input_map<\/code>, defaulting to an identity, top-left aligned map (<a href=\"../../src/nodes/mod.rs#L229\" target=\"_blank\">nodes/mod.rs:229-235<\/a>).<\/li><li>Overrides: <code>Clip::input_map<\/code> (offset) (<a href=\"../../src/nodes/basic.rs#L343\" target=\"_blank\">basic.rs:343-348<\/a>), <code>Resize::input_map<\/code> (scale, using the rounded effective factor) (<a href=\"../../src/nodes/resize.rs#L73\" target=\"_blank\">resize.rs:73-81<\/a>), <code>Downscale::input_map<\/code> (<a href=\"../../src/nodes/resize.rs#L238\" target=\"_blank\">resize.rs:238-245<\/a>).<\/li><li>Composition: <code>Graph::space_map<\/code> and <code>space_map_rec<\/code> walk the inputs depth-first, compose <code>Map2<\/code>s with <code>after<\/code>, and return the first path that reaches the edited node (<a href=\"../../src/graph.rs#L313\" target=\"_blank\">graph.rs:313-343<\/a>).<\/li><li><code>Map2<\/code> is separable (no rotation or shear) (<a href=\"../../src/engine/geom.rs#L95\" target=\"_blank\">geom.rs:95-102<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/engine.rs::space_map_follows_geometry_upstream<\/code>. <code>tests/engine.rs::clip_offsets_input<\/code> checks the rendered pixels, which supports the note below.<\/p>", "Notes": "<p>Renders use the same <code>input_map<\/code> (Clip, Resize and Downscale call it from <code>render<\/code>), so the overlay mapping and the pixels cannot disagree for these kinds.<\/p>"}, "quotes_html": ["Controls must be placed correctly even when nodes between the edited node and the shown image move or scale pixels (Clip, Resize, Downscale, …).", "Every node type describes how it maps coordinates to its inputs, so new node types can take part."]}, {"id": "F3.3.2", "title": "Say so when the selected node does not contribute", "anchor": "f3-3-2", "file": "02-editing-and-views.md", "line": 192, "area": "2 · Editing, views and export", "kind": "clause", "status": "Implemented", "quotes": ["If the selected node does not contribute to the shown image, the view says so instead of showing controls."], "sections": {"Status": "Implemented.", "Implemented by": "- `space_map` returns `None` when the node does not feed the shown one, so `overlay_space` is `None` ([state.rs:368](../../src/ui/state.rs#L368), [state.rs:376](../../src/ui/state.rs#L376)).\n- With no `overlay_space`, no overlays are drawn and the badge reads \"X does not feed Y · double-click it in the graph to view it\" (`badge`) ([image_view.rs:159-160](../../src/ui/image_view.rs#L159), [image_view.rs:171](../../src/ui/image_view.rs#L171), [image_view.rs:173](../../src/ui/image_view.rs#L173)).", "Tests": "`tests/engine.rs::space_map_follows_geometry_upstream` asserts `space_map` is `None` for a node that does not feed the output. The badge is untested."}, "citations": [{"entry": "F3.3.2", "section": "Implemented by", "path": "src/ui/state.rs", "start": 368, "end": 368, "md": "02-editing-and-views.md:199"}, {"entry": "F3.3.2", "section": "Implemented by", "path": "src/ui/state.rs", "start": 376, "end": 376, "md": "02-editing-and-views.md:199"}, {"entry": "F3.3.2", "section": "Implemented by", "path": "src/ui/image_view.rs", "start": 159, "end": 160, "md": "02-editing-and-views.md:200"}, {"entry": "F3.3.2", "section": "Implemented by", "path": "src/ui/image_view.rs", "start": 171, "end": 171, "md": "02-editing-and-views.md:200"}, {"entry": "F3.3.2", "section": "Implemented by", "path": "src/ui/image_view.rs", "start": 173, "end": 173, "md": "02-editing-and-views.md:200"}], "tests": ["tests/engine.rs::space_map_follows_geometry_upstream"], "links": [], "sections_html": {"Status": "<p>Implemented.<\/p>", "Implemented by": "<ul><li><code>space_map<\/code> returns <code>None<\/code> when the node does not feed the shown one, so <code>overlay_space<\/code> is <code>None<\/code> (<a href=\"../../src/ui/state.rs#L368\" target=\"_blank\">state.rs:368<\/a>, <a href=\"../../src/ui/state.rs#L376\" target=\"_blank\">state.rs:376<\/a>).<\/li><li>With no <code>overlay_space<\/code>, no overlays are drawn and the badge reads \"X does not feed Y · double-click it in the graph to view it\" (<code>badge<\/code>) (<a href=\"../../src/ui/image_view.rs#L159\" target=\"_blank\">image_view.rs:159-160<\/a>, <a href=\"../../src/ui/image_view.rs#L171\" target=\"_blank\">image_view.rs:171<\/a>, <a href=\"../../src/ui/image_view.rs#L173\" target=\"_blank\">image_view.rs:173<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/engine.rs::space_map_follows_geometry_upstream<\/code> asserts <code>space_map<\/code> is <code>None<\/code> for a node that does not feed the output. The badge is untested.<\/p>"}, "quotes_html": ["If the selected node does not contribute to the shown image, the view says so instead of showing controls."]}, {"id": "F4", "title": "Export any operator's output; export the visible image by default", "anchor": "f4", "file": "02-editing-and-views.md", "line": 204, "area": "2 · Editing, views and export", "kind": "clause", "status": "Partial", "quotes": ["It must be possible to export the image output by any Delos image operator, but by default the easiest operation to perform should be to export the output currently visible in image view."], "sections": {"Status": "Partial. Any operator's output can be exported, and the default is the visible image, with one deliberate exception: while a node edited on its input (Clip, splits) is previewed, the default export is that node's output, not the input shown on screen ([D-EXPORT-TARGET](findings.md#d-export-target)).", "Implemented by": "- Default: the toolbar's Export button and ⌘E call `open_export(None)` ([mod.rs:387-393](../../src/ui/mod.rs#L387), [mod.rs:294](../../src/ui/mod.rs#L294)), which exports `displayed().export_target` ([state.rs:392-397](../../src/ui/state.rs#L392)) by opening the dialog on that `target` (`ExportState`) ([state.rs:407-408](../../src/ui/state.rs#L407)).\n- Any operator: every non-output node's inspector has one Export button; for a split it exports the output being viewed, else output 0 (`export_link`) ([inspector.rs:87-90](../../src/ui/inspector.rs#L87), [inspector.rs:154](../../src/ui/inspector.rs#L154)). To export a split's second output, view it first.\n- `export_target` is the edited node when not locked, else the shown target ([state.rs:380](../../src/ui/state.rs#L380)).", "Tests": "None for the default target or the inspector button; `tests/ui_state.rs::a_split_output_can_be_viewed_and_exported` covers the relocated case ([F4.1](#f4-1))."}, "citations": [{"entry": "F4", "section": "Implemented by", "path": "src/ui/mod.rs", "start": 387, "end": 393, "md": "02-editing-and-views.md:211"}, {"entry": "F4", "section": "Implemented by", "path": "src/ui/mod.rs", "start": 294, "end": 294, "md": "02-editing-and-views.md:211"}, {"entry": "F4", "section": "Implemented by", "path": "src/ui/state.rs", "start": 392, "end": 397, "md": "02-editing-and-views.md:211"}, {"entry": "F4", "section": "Implemented by", "path": "src/ui/state.rs", "start": 407, "end": 408, "md": "02-editing-and-views.md:211"}, {"entry": "F4", "section": "Implemented by", "path": "src/ui/inspector.rs", "start": 87, "end": 90, "md": "02-editing-and-views.md:212"}, {"entry": "F4", "section": "Implemented by", "path": "src/ui/inspector.rs", "start": 154, "end": 154, "md": "02-editing-and-views.md:212"}, {"entry": "F4", "section": "Implemented by", "path": "src/ui/state.rs", "start": 380, "end": 380, "md": "02-editing-and-views.md:213"}], "tests": ["tests/ui_state.rs::a_split_output_can_be_viewed_and_exported"], "links": ["findings.md#d-export-target", "02-editing-and-views.md#f4-1"], "sections_html": {"Status": "<p>Partial. Any operator's output can be exported, and the default is the visible image, with one deliberate exception: while a node edited on its input (Clip, splits) is previewed, the default export is that node's output, not the input shown on screen (<a href=\"#\" data-goto=\"d-export-target\">D-EXPORT-TARGET<\/a>).<\/p>", "Implemented by": "<ul><li>Default: the toolbar's Export button and ⌘E call <code>open_export(None)<\/code> (<a href=\"../../src/ui/mod.rs#L387\" target=\"_blank\">mod.rs:387-393<\/a>, <a href=\"../../src/ui/mod.rs#L294\" target=\"_blank\">mod.rs:294<\/a>), which exports <code>displayed().export_target<\/code> (<a href=\"../../src/ui/state.rs#L392\" target=\"_blank\">state.rs:392-397<\/a>) by opening the dialog on that <code>target<\/code> (<code>ExportState<\/code>) (<a href=\"../../src/ui/state.rs#L407\" target=\"_blank\">state.rs:407-408<\/a>).<\/li><li>Any operator: every non-output node's inspector has one Export button; for a split it exports the output being viewed, else output 0 (<code>export_link<\/code>) (<a href=\"../../src/ui/inspector.rs#L87\" target=\"_blank\">inspector.rs:87-90<\/a>, <a href=\"../../src/ui/inspector.rs#L154\" target=\"_blank\">inspector.rs:154<\/a>). To export a split's second output, view it first.<\/li><li><code>export_target<\/code> is the edited node when not locked, else the shown target (<a href=\"../../src/ui/state.rs#L380\" target=\"_blank\">state.rs:380<\/a>).<\/li><\/ul>", "Tests": "<p>None for the default target or the inspector button; <code>tests/ui_state.rs::a_split_output_can_be_viewed_and_exported<\/code> covers the relocated case (<a href=\"#\" data-goto=\"f4-1\">F4.1<\/a>).<\/p>"}, "quotes_html": ["It must be possible to export the image output by any Delos image operator, but by default the easiest operation to perform should be to export the output currently visible in image view."]}, {"id": "F4.1", "title": "Export follows the relocated output", "anchor": "f4-1", "file": "02-editing-and-views.md", "line": 217, "area": "2 · Editing, views and export", "kind": "clause", "status": "Implemented", "quotes": ["While the output is relocated, exporting the current image will export the content of the node that is currently attached to output."], "sections": {"Status": "Implemented.", "Implemented by": "- When `pinned` is set, `displayed` is `locked` and `export_target` is the pinned link, returned in `Displayed` ([state.rs:353-354](../../src/ui/state.rs#L353), [state.rs:356](../../src/ui/state.rs#L356), [state.rs:380](../../src/ui/state.rs#L380), [state.rs:385](../../src/ui/state.rs#L385)).\n- The export job carries that `Link`, so a split's specific output is exported: `ExportJob` ([worker.rs:28](../../src/worker.rs#L28), [worker.rs:31](../../src/worker.rs#L31)).", "Tests": "`tests/ui_state.rs::a_split_output_can_be_viewed_and_exported`."}, "citations": [{"entry": "F4.1", "section": "Implemented by", "path": "src/ui/state.rs", "start": 353, "end": 354, "md": "02-editing-and-views.md:224"}, {"entry": "F4.1", "section": "Implemented by", "path": "src/ui/state.rs", "start": 356, "end": 356, "md": "02-editing-and-views.md:224"}, {"entry": "F4.1", "section": "Implemented by", "path": "src/ui/state.rs", "start": 380, "end": 380, "md": "02-editing-and-views.md:224"}, {"entry": "F4.1", "section": "Implemented by", "path": "src/ui/state.rs", "start": 385, "end": 385, "md": "02-editing-and-views.md:224"}, {"entry": "F4.1", "section": "Implemented by", "path": "src/worker.rs", "start": 28, "end": 28, "md": "02-editing-and-views.md:225"}, {"entry": "F4.1", "section": "Implemented by", "path": "src/worker.rs", "start": 31, "end": 31, "md": "02-editing-and-views.md:225"}], "tests": ["tests/ui_state.rs::a_split_output_can_be_viewed_and_exported"], "links": [], "sections_html": {"Status": "<p>Implemented.<\/p>", "Implemented by": "<ul><li>When <code>pinned<\/code> is set, <code>displayed<\/code> is <code>locked<\/code> and <code>export_target<\/code> is the pinned link, returned in <code>Displayed<\/code> (<a href=\"../../src/ui/state.rs#L353\" target=\"_blank\">state.rs:353-354<\/a>, <a href=\"../../src/ui/state.rs#L356\" target=\"_blank\">state.rs:356<\/a>, <a href=\"../../src/ui/state.rs#L380\" target=\"_blank\">state.rs:380<\/a>, <a href=\"../../src/ui/state.rs#L385\" target=\"_blank\">state.rs:385<\/a>).<\/li><li>The export job carries that <code>Link<\/code>, so a split's specific output is exported: <code>ExportJob<\/code> (<a href=\"../../src/worker.rs#L28\" target=\"_blank\">worker.rs:28<\/a>, <a href=\"../../src/worker.rs#L31\" target=\"_blank\">worker.rs:31<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/ui_state.rs::a_split_output_can_be_viewed_and_exported<\/code>.<\/p>"}, "quotes_html": ["While the output is relocated, exporting the current image will export the content of the node that is currently attached to output."]}, {"id": "F4.2", "title": "Banded, bounded, cancellable export and its dialog", "anchor": "f4-2", "file": "02-editing-and-views.md", "line": 229, "area": "2 · Editing, views and export", "kind": "clause", "status": "Partial", "quotes": ["Export renders at full resolution in bands (to bound memory), shows progress and can be cancelled.", "The export dialog can be closed with its close button, the Escape key or by clicking outside it, and closes by itself after a successful export."], "sections": {"Status": "Partial. Rendering is banded for every format, but only the PNG encoder streams bands. The other encoders collect the whole RGBA8 image before encoding, and exports to memory (the web, and the mobile fallback) hold the whole encoded file, so memory is bounded only for PNG written to a file ([D-EXPORT-MEMORY](findings.md#d-export-memory)). The dialog behaviour is as specified.", "Implemented by": "- Bands: `GraphBands::new` picks about 4 Mpx per band and `next_band` renders each with `exact` requests ([formats.rs:230-233](../../src/formats.rs#L230), [formats.rs:244-256](../../src/formats.rs#L244)). On native targets `export` renders on another thread with a one-band channel; elsewhere bands render inline ([formats.rs:259-300](../../src/formats.rs#L259)). `ExportDest::Memory` collects the encoded file in a `Vec` ([worker.rs:311-315](../../src/worker.rs#L311)).\n- Streaming PNG: `Png::encode` writes each band to a `stream_writer` ([formats.rs:135-149](../../src/formats.rs#L135)).\n- Progress: `Prefetched::next_band` reports the fraction ([formats.rs:320-327](../../src/formats.rs#L320)), forwarded as `Msg::ExportProgress` by the `progress` callback that `Worker::export` passes to `formats::export` ([worker.rs:289-291](../../src/worker.rs#L289), [worker.rs:303](../../src/worker.rs#L303)), stored by `pump` ([mod.rs:188-193](../../src/ui/mod.rs#L188), [mod.rs:197-198](../../src/ui/mod.rs#L197)) and drawn as a `progress` bar ([dialogs.rs:170-173](../../src/ui/dialogs.rs#L170)).\n- Cancel: `Worker::export` registers a `cancel_flag` per job and passes it as `cancel` ([worker.rs:281-282](../../src/worker.rs#L281), [worker.rs:287](../../src/worker.rs#L287)); `cancel_export` sets the job's flag ([worker.rs:392-396](../../src/worker.rs#L392)), which `Ctx::render` and `Ctx::kernel` check through `cancelled` and stop with `Cancelled` ([engine/mod.rs:179-181](../../src/engine/mod.rs#L179), [engine/mod.rs:201-203](../../src/engine/mod.rs#L201), [engine/mod.rs:275-277](../../src/engine/mod.rs#L275)); a partial file is deleted (`remove_file`) ([worker.rs:304-307](../../src/worker.rs#L304)).\n- Closing: the × button and Close, both `export.set(None)` ([dialogs.rs:124-126](../../src/ui/dialogs.rs#L124), [dialogs.rs:194](../../src/ui/dialogs.rs#L194)), `Key::Escape` when no export runs ([mod.rs:297-304](../../src/ui/mod.rs#L297)), a click on the backdrop that also started there (`export_backdrop_clicked`) ([state.rs:436-440](../../src/ui/state.rs#L436)). `pump` closes the dialog after `ExportDone` succeeds ([mod.rs:199](../../src/ui/mod.rs#L199), [mod.rs:207-210](../../src/ui/mod.rs#L207)).", "Tests": "`tests/export.rs::export_matches_sequential_render`, `tests/export.rs::cancelling_stops_the_export`, `tests/export.rs::write_errors_stop_the_export`, `tests/large_images.rs::export_16k_streams_in_bands`, `tests/large_images.rs::export_16k_png`, `tests/ui_state.rs::dragging_out_of_the_export_dialog_keeps_it_open`.", "Notes": "The shortfall: other formats go through `ImageCrate::encode`, which appends every band to `all` first ([formats.rs:83-88](../../src/formats.rs#L83))."}, "citations": [{"entry": "F4.2", "section": "Implemented by", "path": "src/formats.rs", "start": 230, "end": 233, "md": "02-editing-and-views.md:237"}, {"entry": "F4.2", "section": "Implemented by", "path": "src/formats.rs", "start": 244, "end": 256, "md": "02-editing-and-views.md:237"}, {"entry": "F4.2", "section": "Implemented by", "path": "src/formats.rs", "start": 259, "end": 300, "md": de> requests (<a href=\"../../src/formats.rs#L230\" target=\"_blank\">formats.rs:230-233<\/a>, <a href=\"../../src/formats.rs#L244\" target=\"_blank\">formats.rs:244-256<\/a>). On native targets <code>export<\/code> renders on another thread with a one-band channel; elsewhere bands render inline (<a href=\"../../src/formats.rs#L259\" target=\"_blank\">formats.rs:259-300<\/a>). <code>ExportDest::Memory<\/code> collects the encoded file in a <code>Vec<\/code> (<a href=\"../../src/worker.rs#L311\" target=\"_blank\">worker.rs:311-315<\/a>).<\/li><li>Streaming PNG: <code>Png::encode<\/code> writes each band to a <code>stream_writer<\/code> (<a href=\"../../src/formats.rs#L135\" target=\"_blank\">formats.rs:135-149<\/a>).<\/li><li>Progress: <code>Prefetched::next_band<\/code> reports the fraction (<a href=\"../../src/formats.rs#L320\" target=\"_blank\">formats.rs:320-327<\/a>), forwarded as <code>Msg::ExportProgress<\/code> by the <code>progress<\/code> callback that <code>Worker::export<\/code> passes to <code>formats::export<\/code> (<a href=\"../../src/worker.rs#L289\" target=\"_blank\">worker.rs:289-291<\/a>, <a href=\"../../src/worker.rs#L303\" target=\"_blank\">worker.rs:303<\/a>), stored by <code>pump<\/code> (<a href=\"../../src/ui/mod.rs#L188\" target=\"_blank\">mod.rs:188-193<\/a>, <a href=\"../../src/ui/mod.rs#L197\" target=\"_blank\">mod.rs:197-198<\/a>) and drawn as a <code>progress<\/code> bar (<a href=\"../../src/ui/dialogs.rs#L170\" target=\"_blank\">dialogs.rs:170-173<\/a>).<\/li><li>Cancel: <code>Worker::export<\/code> registers a <code>cancel_flag<\/code> per job and passes it as <code>cancel<\/code> (<a href=\"../../src/worker.rs#L281\" target=\"_blank\">worker.rs:281-282<\/a>, <a href=\"../../src/worker.rs#L287\" target=\"_blank\">worker.rs:287<\/a>); <code>cancel_export<\/code> sets the job's flag (<a href=\"../../src/worker.rs#L392\" target=\"_blank\">worker.rs:392-396<\/a>), which <code>Ctx::render<\/code> and <code>Ctx::kernel<\/code> check through <code>cancelled<\/code> and stop with <code>Cancelled<\/code> (<a href=\"../../src/engine/mod.rs#L179\" target=\"_blank\">engine/mod.rs:179-181<\/a>, <a href=\"../../src/engine/mod.rs#L201\" target=\"_blank\">engine/mod.rs:201-203<\/a>, <a href=\"../../src/engine/mod.rs#L275\" target=\"_blank\">engine/mod.rs:275-277<\/a>); a partial file is deleted (<code>remove_file<\/code>) (<a href=\"../../src/worker.rs#L304\" target=\"_blank\">worker.rs:304-307<\/a>).<\/li><li>Closing: the × button and Close, both <code>export.set(None)<\/code> (<a href=\"../../src/ui/dialogs.rs#L124\" target=\"_blank\">dialogs.rs:124-126<\/a>, <a href=\"../../src/ui/dialogs.rs#L194\" target=\"_blank\">dialogs.rs:194<\/a>), <code>Key::Escape<\/code> when no export runs (<a href=\"../../src/ui/mod.rs#L297\" target=\"_blank\">mod.rs:297-304<\/a>), a click on the backdrop that also started there (<code>export_backdrop_clicked<\/code>) (<a href=\"../../src/ui/state.rs#L436\" target=\"_blank\">state.rs:436-440<\/a>). <code>pump<\/code> closes the dialog after <code>ExportDone<\/code> succeeds (<a href=\"../../src/ui/mod.rs#L199\" target=\"_blank\">mod.rs:199<\/a>, <a href=\"../../src/ui/mod.rs#L207\" target=\"_blank\">mod.rs:207-210<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/export.rs::export_matches_sequential_render<\/code>, <code>tests/export.rs::cancelling_stops_the_export<\/code>, <code>tests/export.rs::write_errors_stop_the_export<\/code>, <code>tests/large_images.rs::export_16k_streams_in_bands<\/code>, <code>tests/large_images.rs::export_16k_png<\/code>, <code>tests/ui_state.rs::dragging_out_of_the_export_dialog_keeps_it_open<\/code>.<\/p>", "Notes": "<p>The shortfall: other formats go through <code>ImageCrate::encode<\/code>, which appends every band to <code>all<\/code> first (<a href=\"../../src/formats.rs#L83\" target=\"_blank\">formats.rs:83-88<\/a>).<\/p>"}, "quotes_html": ["Export renders at full resolution in bands (to bound memory), shows progress and can be cancelled.", "The export dialog can be closed with its close button, the Escape key or by clicking outside it, and closes by itself after a successful export."]}, {"id": "F5", "title": "Combination through operators, with display modalities", "anchor": "f5", "file": "02-editing-and-views.md", "line": 248, "area": "2 · Editing, views and export", "kind": "clause", "status": "Partial", "quotes": ["All combinations of images will be done using operators.", "For example, rather than stacking layers by default, Delos should make it possible to combine layers with specific operators.", "Delos shall define specific \"display modalities\" for standard operators to make user experience more pleasurable - for example, if we combine a sequence of layers using the \"stack\" operator, we can display this as a layer stack rather than as a degenerate graph of the format `(layer3 STACK (layer2 STACK layer1))` (i.e. a Lisp list of stacks, with the exception that it will never be empty hence a NIL-node is not required.)"], "sections": {"Status": "Partial. All combination is done by operator nodes, and the layer stack has its display modality in the graph view, the inspector and the expression format. No other operator has one: the spec says modalities (plural) for standard operators, but only gives the stack as an example ([D-MODALITIES](findings.md#d-modalities)).", "Implemented by": "- Combining kinds are ordinary nodes (`Stack`, `Blend`) with `combines_inputs` ([basic.rs:114-133](../../src/nodes/basic.rs#L114), [basic.rs:213-234](../../src/nodes/basic.rs#L213)).\n- Chains: `is_interior_stack`, `chain_head` and `stack_chain` recognise a chain of stacks linked through the back port ([graph.rs:426-465](../../src/graph.rs#L426)); `set_stack_layers` rewrites it from a layer list ([graph.rs:470-491](../../src/graph.rs#L470)).\n- Graph view: interior stacks are hidden (`is_interior_stack`) and the head shows one row per layer plus \"+ add layer\" (`stack_chain`) ([graph_view.rs:66-68](../../src/ui/graph_view.rs#L66), [graph_view.rs:75-87](../../src/ui/graph_view.rs#L75)); a wire dropped on a row replaces that layer and one dropped on \"+ add layer\" appends it, through `set_stack_layers` (`connect_port`) ([graph_view.rs:125-132](../../src/ui/graph_view.rs#L125)).\n- Inspector: the `LayerStack` editor lists the chain's layers front to back ([inspector.rs:404-421](../../src/ui/inspector.rs#L404), [inspector.rs:439-443](../../src/ui/inspector.rs#L439), [inspector.rs:464-468](../../src/ui/inspector.rs#L464)).\n- Expression format: `(stack front … back)` (see [E4](05-expressions.md#e4)).", "Tests": "`tests/engine.rs::stack_chain_editing`, `src/expr.rs::stacks_are_lists_of_layers`.", "Notes": "\"Never empty\": a chain always has at least one stack node (`needed` is at least 1 in `set_stack_layers`), but layers can be empty slots (\"+ Empty slot\" in the inspector)."}, "citations": [{"entry": "F5", "section": "Implemented by", "path": "src/nodes/basic.rs", "start": 114, "end": 133, "md": "02-editing-and-views.md:257"}, {"entry": "F5", "section": "Implemented by", "path": "src/nodes/basic.rs", "start": 213, "end": 234, "md": "02-editing-and-views.md:257"}, {"entry": "F5", "section": "Implemented by", "path": "src/graph.rs", "start": 426, "end": 465, "md": "02-editing-and-views.md:258"}, {"entry": "F5", "section": "Implemented by", "path": "src/graph.rs", "start": 470, "end": 491, "md": "02-editing-and-views.md:258"}, {"entry": "F5", "section": "Implemented by", "path": "src/ui/graph_view.rs", "start": 66, "end": 68, "md": "02-editing-and-views.md:259"}, {"entry": "F5", "section": "Implemented by", "path": "src/ui/graph_view.rs", "start": 75, "end": 87, "md": "02-editing-and-views.md:259"}, {"entry": "F5", "section": "Implemented by", "path": "src/ui/graph_view.rs", "start": 125, "end": 132, "md": "02-editing-and-views.md:259"}, {"entry": "F5", "section": "Implemented by", "path": "src/ui/inspector.rs", "start": 404, "end": 421, "md": "02-editing-and-views.md:260"}, {"entry": ) (<a href=\"../../src/ui/graph_view.rs#L125\" target=\"_blank\">graph_view.rs:125-132<\/a>).<\/li><li>Inspector: the <code>LayerStack<\/code> editor lists the chain's layers front to back (<a href=\"../../src/ui/inspector.rs#L404\" target=\"_blank\">inspector.rs:404-421<\/a>, <a href=\"../../src/ui/inspector.rs#L439\" target=\"_blank\">inspector.rs:439-443<\/a>, <a href=\"../../src/ui/inspector.rs#L464\" target=\"_blank\">inspector.rs:464-468<\/a>).<\/li><li>Expression format: <code>(stack front … back)<\/code> (see <a href=\"#\" data-goto=\"e4\">E4<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/engine.rs::stack_chain_editing<\/code>, <code>src/expr.rs::stacks_are_lists_of_layers<\/code>.<\/p>", "Notes": "<p>\"Never empty\": a chain always has at least one stack node (<code>needed<\/code> is at least 1 in <code>set_stack_layers<\/code>), but layers can be empty slots (\"+ Empty slot\" in the inspector).<\/p>"}, "quotes_html": ["All combinations of images will be done using operators.", "For example, rather than stacking layers by default, Delos should make it possible to combine layers with specific operators.", "Delos shall define specific \"display modalities\" for standard operators to make user experience more pleasurable - for example, if we combine a sequence of layers using the \"stack\" operator, we can display this as a layer stack rather than as a degenerate graph of the format <code>(layer3 STACK (layer2 STACK layer1))<\/code> (i.e. a Lisp list of stacks, with the exception that it will never be empty hence a NIL-node is not required.)"]}, {"id": "O0", "title": "The basic operator set", "anchor": "o0", "file": "03-operators.md", "line": 8, "area": "3 · Operators, splits, generators and sizes", "kind": "clause", "status": "Implemented", "quotes": ["These are basic layer operators which must be implemented in the initial version of Delos:"], "sections": {"Status": "Implemented. All nine are registered.", "Implemented by": "- `basic::kinds` lists Output, Sta
