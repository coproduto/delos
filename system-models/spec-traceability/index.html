t programming language.", "digest": "25ec7c2ab4ff", "entries": ["R1"], "covered": 1.0}, {"index": 3, "line": 12, "end_line": 14, "section": "Requirements", "item": "", "kind": "text", "text": "Delos must be possible to run as a desktop application, a web-based application and a mobile application.", "digest": "52464e6f2ed6", "entries": ["R2"], "covered": 1.0}, {"index": 4, "line": 12, "end_line": 14, "section": "Requirements", "item": "", "kind": "text", "text": "We would like to use Dioxus as our framework for this purpose.", "digest": "fbadeb8694e3", "entries": ["R2"], "covered": 1.0}, {"index": 5, "line": 16, "end_line": 16, "section": "Requirements", "item": "", "kind": "text", "text": "Delos will extensively display and manipulate images.", "digest": "e2c0ac98e5fb", "entries": ["R3"], "covered": 1.0}, {"index": 6, "line": 16, "end_line": 16, "section": "Requirements", "item": "", "kind": "text", "text": "Using GPU acceleration wherever possible is a requirement for this project.", "digest": "8edd471e5fe9", "entries": ["R3"], "covered": 1.0}, {"index": 7, "line": 16, "end_line": 16, "section": "Requirements", "item": "", "kind": "text", "text": "However, in case GPU acceleration is not available, Delos should degrade gracefully to CPU rendering.", "digest": "adf4590b3115", "entries": ["R4"], "covered": 1.0}, {"index": 8, "line": 20, "end_line": 20, "section": "Basic functionalities", "item": "1", "kind": "text", "text": "Delos must be able to load and display existing images.", "digest": "aa975f5490bf", "entries": ["F1"], "covered": 1.0}, {"index": 9, "line": 20, "end_line": 20, "section": "Basic functionalities", "item": "1", "kind": "text", "text": "Opening an image creates a \"layer\" containing that image.", "digest": "676bb5bcc8da", "entries": ["F1"], "covered": 1.0}, {"index": 10, "line": 20, "end_line": 20, "section": "Basic functionalities", "item": "1", "kind": "text", "text": "Layers are treated as graph nodes which can be connected using \"operators\".", "digest": "bf2012b8c46d", "entries": ["F1"], "covered": 1.0}, {"index": 11, "line": 21, "end_line": 21, "section": "Basic functionalities", "item": "1.1", "kind": "text", "text": "Importing an image to Delos specifically creates a \"Static Image\" node connected directly to the output.", "digest": "592bc78a6ece", "entries": ["F1.1"], "covered": 1.0}, {"index": 12, "line": 22, "end_line": 22, "section": "Basic functionalities", "item": "1.2", "kind": "text", "text": "Operators may have parameters.", "digest": "8b111b2c0ef6", "entries": ["F1.2"], "covered": 1.0}, {"index": 13, "line": 22, "end_line": 22, "section": "Basic functionalities", "item": "1.2", "kind": "text", "text": "In case they do, adding the operator node will allow the user to input the operator parameters either via a WYSIWYG interface or via form inputs.", "digest": "0d552544d2c8", "entries": ["F1.2"], "covered": 1.0}, {"index": 14, "line": 23, "end_line": 23, "section": "Basic functionalities", "item": "2", "kind": "text", "text": "While an image is being edited in Delos, we will be able to visualize the final results.", "digest": "702be5909614", "entries": ["F2"], "covered": 1.0}, {"index": 15, "line": 23, "end_line": 23, "section": "Basic functionalities", "item": "2", "kind": "text", "text": "During the process of editing, however, the image will be stored as a Directed Acyclic Graph (DAG) representing image layers and operations applied to them.", "digest": "babc0130ec16", "entries": ["F2"], "covered": 1.0}, {"index": 16, "line": 23, "end_line": 23, "section": "Basic functionalities", "item": "2", "kind": "text", "text": "That way, we can easily see and modify effects are being applied to which parts of the image.", "digest": "3cc0ded918a9", "entries": ["F2"], "covered": 1.0}, {"index": 17, "line": 24, "end_line": 24, "section": "Basic functionalities", "item": "2.1", "kind": "text", "text": "The image view must show the image that is being sent to the output.", "digest": "483fdb40eae7", "entries": ["F2.1"], "covered": 1.0}, {"index": 18, "line": 25, "end_line": 25, "section": "Basic functionalities", "item": "3", "kind": "text", "text": "We must be able to open a graph view instead of the image view or alongside the image view.", "digest": "762f0677cd46", "entries": ["F3"], "covered": 1.0}, {"index": 19, "line": 25, "end_line": 25, "section": "Basic functionalities", "item": "3", "kind": "text", "text": "It must also be possible to visualize any part of the graph which produces an image.", "digest": "da4cf681c8ce", "entries": ["F3"], "covered": 1.0}, {"index": 20, "line": 26, "end_line": 26, "section": "Basic functionalities", "item": "3.1", "kind": "text", "text": "In other terms, we can temporarily relocate the output to any image node.", "digest": "e3611420d1dd", "entries": ["F3.1"], "covered": 1.0}, {"index": 21, "line": 27, "end_line": 27, "section": "Basic functionalities", "item": "3.1.1", "kind": "text", "text": "Double-clicking a node in the graph view relocates the output to it.", "digest": "0cd4f65ad0c8", "entries": ["F3.1.1"], "covered": 1.0}, {"index": 22, "line": 27, "end_line": 27, "section": "Basic functionalities", "item": "3.1.1", "kind": "text", "text": "For nodes with several outputs, double-clicking one of its output ports relocates the output to that output.", "digest": "72c5ad70c3c1", "entries": ["F3.1.1"], "covered": 1.0}, {"index": 23, "line": 27, "end_line": 27, "section": "Basic functionalities", "item": "3.1.1", "kind": "text", "text": "Double-clicking the relocated node again, or the Output node, moves the output back to its default.", "digest": "e96e0403259c", "entries": ["F3.1.1"], "covered": 1.0}, {"index": 24, "line": 28, "end_line": 28, "section": "Basic functionalities", "item": "3.2", "kind": "text", "text": "If we select an operator node, the image view should show the image at the operator's output overlaid with controls for the specific operator (examples of controls: selection boxes, rules).", "digest": "f558a7007cc8", "entries": ["F3.2"], "covered": 1.0}, {"index": 25, "line": 28, "end_line": 28, "section": "Basic functionalities", "item": "3.2", "kind": "text", "text": "Examples are given in the operators section below.", "digest": "ed4762ce8cee", "entries": ["F3.2"], "covered": 1.0}, {"index": 26, "line": 29, "end_line": 29, "section": "Basic functionalities", "item": "3.2.1", "kind": "text", "text": "Some operators are edited on their input instead.", "digest": "2dba763b60e1", "entries": ["F3.2.1"], "covered": 1.0}, {"index": 27, "line": 29, "end_line": 29, "section": "Basic functionalities", "item": "3.2.1", "kind": "text", "text": "For example, Clip shows the uncropped input with the crop rectangle.", "digest": "643968e7b0da", "entries": ["F3.2.1"], "covered": 1.0}, {"index": 28, "line": 30, "end_line": 30, "section": "Basic functionalities", "item": "3.3", "kind": "text", "text": "It must be possible to keep the image view fixed while editing a node further up the graph.", "digest": "f54c03ed1433", "entries": ["F3.3"], "covered": 1.0}, {"index": 29, "line": 30, "end_line": 30, "section": "Basic functionalities", "item": "3.3", "kind": "text", "text": "While the output is relocated (or when \"Preview selection\" is turned off), selecting another node keeps the view as it is and draws that node's controls over the shown image.", "digest": "fbfe73109e83", "entries": ["F3.3"], "covered": 1.0}, {"index": 30, "line": 30, "end_line": 30, "section": "Basic functionalities", "item": "3.3", "kind": "text", "text": "Editing those controls modifies the shown image directly.", "digest": "227ea825ae8f", "entries": ["F3.3"], "covered": 1.0}, {"index": 31, "line": 31, "end_line": 31, "section": "Basic functionalities", "item": "3.3.1", "kind": "text", "text": "Controls must be placed correctly even when nodes between the edited node and the shown image move or scale pixels (Clip, Resize, Downscale, …).", "digest": "c6ce50929e12", "entries": ["F3.3.1"], "covered": 1.0}, {"index": 32, "line": 31, "end_line": 31, "section": "Basic functionalities", "item": "3.3.1", "kind": "text", "text": "Every node type describes how it maps coordinates to its inputs, so new node types can take part.", "digest": "b622eae5d312", "entries": ["F3.3.1"], "covered": 1.0}, {"index": 33, "line": 32, "end_line": 32, "section": "Basic functionalities", "item": "3.3.2", "kind": "text", "text": "If the selected node does not contribute to the shown image, the view says so instead of showing controls.", "digest": "d40b05033b52", "entries": ["F3.3.2"], "covered": 1.0}, {"index": 34, "line": 33, "end_line": 33, "section": "Basic functionalities", "item": "4", "kind": "text", "text": "It must be possible to export the image output by any Delos image operator, but by default the easiest operation to perform should be to export the output currently visible in image view.", "digest": "4628d0bfc812", "entries": ["F4"], "covered": 1.0}, {"index": 35, "line": 34, "end_line": 34, "section": "Basic functionalities", "item": "4.1", "kind": "text", "text": "While the output is relocated, exporting the current image will export the content of the node that is currently attached to output.", "digest": "aa1eb2daa420", "entries": ["F4.1"], "covered": 1.0}, {"index": 36, "line": 35, "end_line": 35, "section": "Basic functionalities", "item": "4.2", "kind": "text", "text": "Export renders at full resolution in bands (to bound memory), shows progress and can be cancelled.", "digest": "074660bcd1fd", "entries": ["F4.2"], "covered": 1.0}, {"index": 37, "line": 35, "end_line": 35, "section": "Basic functionalities", "item": "4.2", "kind": "text", "text": "The export dialog can be closed with its close button, the Escape key or by clicking outside it, and closes by itself after a successful export.", "digest": "2597d032790e", "entries": ["F4.2"], "covered": 1.0}, {"index": 38, "line": 36, "end_line": 36, "section": "Basic functionalities", "item": "5", "kind": "text", "text": "All combinations of images will be done using operators.", "digest": "980ddc24ba3f", "entries": ["F5"], "covered": 1.0}, {"index": 39, "line": 36, "end_line": 36, "section": "Basic functionalities", "item": "5", "kind": "text", "text": "For example, rather than stacking layers by default, Delos should make it possible to combine layers with specific operators.", "digest": "bfea3f95fe90", "entries": ["F5"], "covered": 1.0}, {"index": 40, "line": 36, "end_line": 36, "section": "Basic functionalities", "item": "5", "kind": "text", "text": "Delos shall define specific \"display modalities\" for standard operators to make user experience more pleasurable - for example, if we combine a sequence of layers using the \"stack\" operator, we can display this as a layer stack rather than as a degenerate graph of the format `(layer3 STACK (layer2 STACK layer1))` (i.e. a Lisp list of stacks, with the exception that it will never be empty hence a NIL-node is not required.)", "digest": "f7946b3d3d1a", "entries": ["F5"], "covered": 1.0}, {"index": 41, "line": 40, "end_line": 40, "section": "Basic Operators", "item": "", "kind": "text", "text": "These are basic layer operators which must be implemented in the initial version of Delos:", "digest": "8cc9131afe23", "entries": ["O0"], "covered": 1.0}, {"index": 42, "line": 41, "end_line": 41, "section": "Basic Operators", "item": "", "kind": "text", "text": "Stack operator - this is a basic operator which is used to form layer stacks.", "digest": "b4c06a3d0220", "entries": ["O1"], "covered": 1.0}, {"index": 43, "line": 41, "end_line": 41, "section": "Basic Operators", "item": "", "kind": "text", "text": "A layer stack will be internally represented as `(frontmost STACK (second-frontmost STACK (third-frontmost STACK ... (second-backmost STACK last) ... )))`.", "digest": "c231b2269dba", "entries": ["O1"], "covered": 1.0}, {"index": 44, "line": 41, "end_line": 41, "section": "Basic Operators", "item": "", "kind": "text", "text": "A layer stack will show the first non-transparent pixel found along the stack for each position.", "digest": "650e59bb1b15", "entries": ["O1"], "covered": 1.0}, {"index": 45, "line": 41, "end_line": 41, "section": "Basic Operators", "item": "", "kind": "text", "text": "Delos implements this as standard \"over\" alpha compositing: this matches the rule for opaque pixels and also handles partly transparent ones.", "digest": "cbe17ee7fe3f", "entries": ["O1"], "covered": 1.0}, {"index": 46, "line": 41, "end_line": 41, "section": "Basic Operators", "item": "", "kind": "text", "text": "Takes no parameters.", "digest": "8a43269dcd82", "entries": ["O1"], "covered": 1.0}, {"index": 47, "line": 41, "end_line": 41, "section": "Basic Operators", "item": "", "kind": "text", "text": "If the stack operator is selected it should allow editing the stack, for example temporarily disabling inputs (which will be internally represented as a \"Disable\" operator which changes all pixels to transparent) or removing them completely.", "digest": "2e304956279d", "entries": ["O1.1"], "covered": 1.0}, {"index": 48, "line": 42, "end_line": 42, "section": "Basic Operators", "item": "", "kind": "text", "text": "Disable operator - mentioned with stack above.", "digest": "8725481e0426", "entries": ["O2"], "covered": 1.0}, {"index": 49, "line": 43, "end_line": 43, "section": "Basic Operators", "item": "", "kind": "text", "text": "Simple reflection operator - this should allow making reflections, i.e. placing axes of reflection on the image which will copy the pixels to one side of them to the other side.", "digest": "f57757e1592d", "entries": ["O3"], "covered": 1.0}, {"index": 50, "line": 43, "end_line": 43, "section": "Basic Operators", "item": "", "kind": "text", "text": "This tool, when selected, will allow (via WYSIWYG rule or form input) selecting where to position the axis of reflection.", "digest": "94dc32358205", "entries": ["O3"], "covered": 1.0}, {"index": 51, "line": 43, "end_line": 43, "section": "Basic Operators", "item": "", "kind": "text", "text": "Via form, it should allow selecting a vertical or horizontal axis of reflection.", "digest": "825378ac6b1e", "entries": ["O3"], "covered": 1.0}, {"index": 52, "line": 43, "end_line": 43, "section": "Basic Operators", "item": "", "kind": "text", "text": "It should also allow specifying whether the reflection should be additive, subtractive or replace the pixels where the reflection will fall.", "digest": "48916e7a80e9", "entries": ["O3"], "covered": 1.0}, {"index": 53, "line": 44, "end_line": 44, "section": "Basic Operators", "item": "", "kind": "text", "text": "Downscale operator - should allow for downscaling", "digest": "f6c0ec5fe93d", "entries": ["O4"], "covered": 1.0}, {"index": 54, "line": 45, "end_line": 45, "section": "Basic Operators", "item": "", "kind": "text", "text": "Background removal operator - this should allow removing the input image's background using the `rembg-rs` crate.", "digest": "72875de0a18a", "entries": ["O5"], "covered": 1.0}, {"index": 55, "line": 45, "end_line": 45, "section": "Basic Operators", "item": "", "kind": "text", "text": "Controls set the background removal parameters.", "digest": "72ae152e7ac6", "entries": ["O5"], "covered": 1.0}, {"index": 56, "line": 46, "end_line": 46, "section": "Basic Operators", "item": "", "kind": "text", "text": "Invert operator - inverts colors.", "digest": "4cf0e8adfd54", "entries": ["O6"], "covered": 1.0}, {"index": 57, "line": 46, "end_line": 46, "section": "Basic Operators", "item": "", "kind": "text", "text": "(i.e. (R,G,B) -> (1-R,1-G,1-B)) with 0 <= R, G, B <= 1.", "digest": "882fc09c2245", "entries": ["O6"], "covered": 1.0}, {"index": 58, "line": 46, "end_line": 46, "section": "Basic Operators", "item": "", "kind": "text", "text": "No controls.", "digest": "eff0a662eae3", "entries": ["O6"], "covered": 1.0}, {"index": 59, "line": 47, "end_line": 47, "section": "Basic Operators", "item": "", "kind": "text", "text": "Clip - allows selecting a subset of image.", "digest": "30210d845701", "entries": ["O7"], "covered": 1.0}, {"index": 60, "line": 48, "end_line": 48, "section": "Basic Operators", "item": "", "kind": "text", "text": "Resize - allows upscaling or downscaling input.", "digest": "662ecb9fa31d", "entries": ["O8"], "covered": 1.0}, {"index": 61, "line": 48, "end_line": 48, "section": "Basic Operators", "item": "", "kind": "text", "text": "Allows choosing upscale/downscale algorithm to use.", "digest": "a5b49eeb1323", "entries": ["O8"], "covered": 1.0}, {"index": 62, "line": 48, "end_line": 48, "section": "Basic Operators", "item": "", "kind": "text", "text": "Should offer nearest-neighbor, bilinear, bicubic and fourier-based interpolation.", "digest": "d11f3a8ec736", "entries": ["O8"], "covered": 1.0}, {"index": 63, "line": 49, "end_line": 49, "section": "Basic Operators", "item": "", "kind": "text", "text": "Blend operator - allows combining images with the blend modes specified at https://en.wikipedia.org/wiki/Blend_modes plus the following:", "digest": "47e87e943805", "entries": ["O9"], "covered": 1.0}, {"index": 64, "line": 50, "end_line": 50, "section": "Basic Operators", "item": "", "kind": "text", "text": "Logic Gate: applies logic operation (and, or, xor) to both images.", "digest": "a71345c8e98e", "entries": ["O10"], "covered": 1.0}, {"index": 65, "line": 50, "end_line": 50, "section": "Basic Operators", "item": "", "kind": "text", "text": "Note that nand, nor and xnor are not included bc they can be achieved with the invert operator.", "digest": "7fd580be1b55", "entries": ["O10"], "covered": 1.0}, {"index": 66, "line": 55, "end_line": 55, "section": "Split operators", "item": "", "kind": "text", "text": "Splitting an image produces two output images, one for each side of a split border.", "digest": "844df5cffb27", "entries": ["S1"], "covered": 1.0}, {"index": 67, "line": 55, "end_line": 55, "section": "Split operators", "item": "", "kind": "text", "text": "One output contains the pixels on one side of the border, with every pixel on the other side transparent.", "digest": "01c11b70df78", "entries": ["S1"], "covered": 1.0}, {"index": 68, "line": 55, "end_line": 55, "section": "Split operators", "item": "", "kind": "text", "text": "The other output contains the complementary pixels, with those present in the first output transparent.", "digest": "d14652afcf22", "entries": ["S1"], "covered": 1.0}, {"index": 69, "line": 55, "end_line": 55, "section": "Split operators", "item": "", "kind": "text", "text": "This makes localized effects possible, as selections do in a regular editor.", "digest": "367ae5d3563d", "entries": ["S1"], "covered": 1.0}, {"index": 70, "line": 57, "end_line": 57, "section": "Split operators", "item": "", "kind": "text", "text": "Vertical Split (`left` / `right`), Horizontal Split (`top` / `bottom`) and Rectangle Split (`inside` / `outside`) are provided.", "digest": "f3f9b7a36517", "entries": ["S2"], "covered": 1.0}, {"index": 71, "line": 57, "end_line": 57, "section": "Split operators", "item": "", "kind": "text", "text": "Each is controlled in the image view by dragging the border line, or by moving and resizing the rectangle, or via form inputs.", "digest": "b2422850e19f", "entries": ["S2"], "covered": 1.0}, {"index": 72, "line": 58, "end_line": 58, "section": "Split operators", "item": "", "kind": "text", "text": "Exact partition: every pixel belongs to exactly one output, decided by its centre.", "digest": "5860959c9a2b", "entries": ["S3"], "covered": 1.0}, {"index": 73, "line": 58, "end_line": 58, "section": "Split operators", "item": "", "kind": "text", "text": "Stacking the two outputs therefore reproduces the input exactly, at any zoom level.", "digest": "00d4527ebddc", "entries": ["S3"], "covered": 1.0}, {"index": 74, "line": 59, "end_line": 59, "section": "Split operators", "item": "", "kind": "text", "text": "Editing view: when a split is selected, the image view shows its whole input with the border controls.", "digest": "076fee223d5c", "entries": ["S4"], "covered": 1.0}, {"index": 75, "line": 60, "end_line": 60, "section": "Split operators", "item": "", "kind": "text", "text": "Outputs: the inputs of other nodes, the relocated output and exports can each refer to a specific output of a split.", "digest": "4ee1af094ab4", "entries": ["S5"], "covered": 1.0}, {"index": 76, "line": 61, "end_line": 61, "section": "Split operators", "item": "", "kind": "text", "text": "Size: splits keep their input's size, and splitting a size-less (generative) input splits it at whatever size is requested.", "digest": "b1593cd25987", "entries": ["S6"], "covered": 1.0}, {"index": 77, "line": 62, "end_line": 62, "section": "Split operators", "item": "", "kind": "text", "text": "Extensibility: nodes in general may have any number of outputs.", "digest": "67d49dd3468c", "entries": ["S7"], "covered": 1.0}, {"index": 78, "line": 62, "end_line": 62, "section": "Split operators", "item": "", "kind": "text", "text": "Each node type declares its outputs, and every output of a node has the node's size.", "digest": "fac2228aed84", "entries": ["S7"], "covered": 1.0}, {"index": 79, "line": 66, "end_line": 66, "section": "Generative operators", "item": "", "kind": "text", "text": "These operators are differentiated by not taking any inputs.", "digest": "f3146ad8f30c", "entries": ["N1"], "covered": 1.0}, {"index": 80, "line": 66, "end_line": 66, "section": "Generative operators", "item": "", "kind": "text", "text": "Rather, they should act as generators of data which can be input to other generators.", "digest": "edc1b419e045", "entries": ["N1"], "covered": 1.0}, {"index": 81, "line": 68, "end_line": 68, "section": "Generative operators", "item": "", "kind": "text", "text": "Note that generative operators do not have output size - if they are connected directly to output, the user must specify the desired output size (this should be possible to do via WYSIWYG).", "digest": "ea7fe1cbeee5", "entries": ["N2"], "covered": 1.0}, {"index": 82, "line": 68, "end_line": 68, "section": "Generative operators", "item": "", "kind": "text", "text": "The output size which fits naturally into the current Delos window should be selected by default.", "digest": "74b8a7a15356", "entries": ["N3"], "covered": 1.0}, {"index": 83, "line": 68, "end_line": 68, "section": "Generative operators", "item": "", "kind": "text", "text": "If generative operators are connected to combining operators, they will generate at whatever size is necessary to combine successfully with the other side.", "digest": "16f379ef8956", "entries": ["N4"], "covered": 1.0}, {"index": 84, "line": 70, "end_line": 70, "section": "Generative operators", "item": "", "kind": "text", "text": "The initial generators are: solid color, linear gradient, radial gradient, checkerboard, noise (fBm, turbulence, ridged), Voronoi and Mandelbrot.", "digest": "fb822720fea7", "entries": ["N5"], "covered": 1.0}, {"index": 85, "line": 70, "end_line": 70, "section": "Generative operators", "item": "", "kind": "text", "text": "An AI image-generation operator is planned.", "digest": "401154bfefab", "entries": ["N6"], "covered": 1.0}, {"index": 86, "line": 74, "end_line": 74, "section": "Handling image size differences", "item": "", "kind": "text", "text": "As said above, generative operators should generate at the size required of them and should not specify an output size.", "digest": "8429293088a8", "entries": ["N2"], "covered": 1.0}, {"index": 87, "line": 74, "end_line": 74, "section": "Handling image size differences", "item": "", "kind": "text", "text": "However, the outputs produced by imported images and by combining operators will have a definite size.", "digest": "d03f35511e5a", "entries": ["Z1"], "covered": 1.0}, {"index": 88, "line": 74, "end_line": 74, "section": "Handling image size differences", "item": "", "kind": "text", "text": "In this case, Delos should ask which output size must be used and insert a resizing node after one of the inputs as appropriate.", "digest": "922c797def06", "entries": ["Z1"], "covered": 1.0}, {"index": 89, "line": 78, "end_line": 78, "section": "Sessions: quick mode and projects", "item": "", "kind": "text", "text": "Delos supports two ways of working:", "digest": "9b6265ad0aea", "entries": ["P1"], "covered": 1.0}, {"index": 90, "line": 80, "end_line": 80, "section": "Sessions: quick mode and projects", "item": "1", "kind": "text", "text": "Quick mode is for one-off edits and quick work.", "digest": "12ba1070d6c6", "entries": ["P1"], "covered": 1.0}, {"index": 91, "line": 80, "end_line": 80, "section": "Sessions: quick mode and projects", "item": "1", "kind": "text", "text": "Imported images are used where they are and nothing is saved.", "digest": "9ca71df7ee52", "entries": ["P1"], "covered": 1.0}, {"index": 92, "line": 81, "end_line": 81, "section": "Sessions: quick mode and projects", "item": "2", "kind": "text", "text": "Project mode is for longer-term work, and for sharing and collaborating with others.", "digest": "684228608a1e", "entries": ["P2"], "covered": 1.0}, {"index": 93, "line": 83, "end_line": 83, "section": "Sessions: quick mode and projects", "item": "", "kind": "text", "text": "When the user imports an image and neither a project nor a quick-mode session is open, Delos asks whether to create a project.", "digest": "9ca2ad4b4b4c", "entries": ["P3"], "covered": 1.0}, {"index": 94, "line": 84, "end_line": 84, "section": "Sessions: quick mode and projects", "item": "", "kind": "text", "text": "The question makes clear that projects copy every imported image, so they take more storage.", "digest": "ab37c408d04b", "entries": ["P3.1"], "covered": 1.0}, {"index": 95, "line": 85, "end_line": 85, "section": "Sessions: quick mode and projects", "item": "", "kind": "text", "text": "If the user declines, a quick-mode session starts and later imports are added to it without asking again.", "digest": "05bb5c614e85", "entries": ["P3.2"], "covered": 1.0}, {"index": 96, "line": 86, "end_line": 86, "section": "Sessions: quick mode and projects", "item": "", "kind": "text", "text": "If the user accepts, a project is created (named by the user; by default in `~/.delos/projects/<name>`, overridable with `DELOS_PROJECTS_DIR`) and the image is added to it.", "digest": "ca4c66a26a64", "entries": ["P3.3"], "covered": 1.0}, {"index": 97, "line": 87, "end_line": 87, "section": "Sessions: quick mode and projects", "item": "", "kind": "text", "text": "The current work can also be turned into a project at any time (\"New project from current work\").", "digest": "808e91b4bbb2", "entries": ["P4"], "covered": 1.0}, {"index": 98, "line": 87, "end_line": 87, "section": "Sessions: quick mode and projects", "item": "", "kind": "text", "text": "The images the graph uses are copied into it.", "digest": "e8f86ec43df2", "entries": ["P4"], "covered": 1.0}, {"index": 99, "line": 88, "end_line": 88, "section": "Sessions: quick mode and projects", "item": "", "kind": "text", "text": "The bottom of the window always shows whether Delos is in quick mode or in a project (with its name and location), and whether the project's changes are saved.", "digest": "aecc4f11567c", "entries": ["P5"], "covered": 1.0}, {"index": 100, "line": 89, "end_line": 89, "section": "Sessions: quick mode and projects", "item": "", "kind": "text", "text": "Projects are saved automatically after every change.", "digest": "1da596225cb7", "entries": ["P6"], "covered": 1.0}, {"index": 101, "line": 90, "end_line": 90, "section": "Sessions: quick mode and projects", "item": "", "kind": "text", "text": "Saves are atomic, so a project file is never left half-written.", "digest": "abd1d9355c51", "entries": ["P6.1"], "covered": 1.0}, {"index": 102, "line": 91, "end_line": 91, "section": "Sessions: quick mode and projects", "item": "", "kind": "text", "text": "Opening a project does not change anything on disk until the user edits it.", "digest": "378de465f26c", "entries": ["P6.2"], "covered": 1.0}, {"index": 103, "line": 92, "end_line": 92, "section": "Sessions: quick mode and projects", "item": "", "kind": "text", "text": "Leaving a quick-mode session that has work in it asks for confirmation.", "digest": "0b22f218784c", "entries": ["P7"], "covered": 1.0}, {"index": 104, "line": 96, "end_line": 96, "section": "Sessions: quick mode and projects / Project structure", "item": "", "kind": "text", "text": "A project is a directory:", "digest": "c2f016c7d8b8", "entries": ["P8"], "covered": 1.0}, {"index": 105, "line": 98, "end_line": 102, "section": "Sessions: quick mode and projects / Project structure", "item": "", "kind": "code", "text": "<name>/ project.delos the node graph, as a Delos expression (see below) inputs/ copies of the images the graph uses", "digest": "fc47916460bf", "entries": [], "covered": 0.0}, {"index": 106, "line": 104, "end_line": 104, "section": "Sessions: quick mode and projects / Project structure", "item": "", "kind": "text", "text": "Imported images are copied into `inputs/` unchanged (no re-encoding) when their original bytes are available.", "digest": "0e62b4d8a7c0", "entries": ["P9"], "covered": 1.0}, {"index": 107, "line": 104, "end_line": 104, "section": "Sessions: quick mode and projects / Project structure", "item": "", "kind": "text", "text": "Images known only by their pixels are written as PNG.", "digest": "4a6a97623a88", "entries": ["P9"], "covered": 1.0}, {"index": 108, "line": 105, "end_line": 105, "section": "Sessions: quick mode and projects / Project structure", "item": "", "kind": "text", "text": "`inputs/` contains exactly the images the current graph uses.", "digest": "1bac38b9004b", "entries": ["P10"], "covered": 1.0}, {"index": 109, "line": 105, "end_line": 105, "section": "Sessions: quick mode and projects / Project structure", "item": "", "kind": "text", "text": "Images that are no longer used are removed from it.", "digest": "cbfebbe13ef8", "entries": ["P10"], "covered": 1.0}, {"index": 110, "line": 106, "end_line": 106, "section": "Sessions: quick mode and projects / Project structure", "item": "", "kind": "text", "text": "Undo history is not part of a project.", "digest": "bcb97eee5e8a", "entries": ["P11"], "covered": 1.0}, {"index": 111, "line": 106, "end_line": 106, "section": "Sessions: quick mode and projects / Project structure", "item": "", "kind": "text", "text": "It belongs to the editing session and is not expected to survive closing and reopening a project.", "digest": "e255393fbca2", "entries": ["P11"], "covered": 1.0}, {"index": 112, "line": 107, "end_line": 107, "section": "Sessions: quick mode and projects / Project structure", "item": "", "kind": "text", "text": "Within a session, images the history may still need are kept outside the project (in a temporary session folder).", "digest": "6c875dd06428", "entries": ["P11.1"], "covered": 1.0}, {"index": 113, "line": 108, "end_line": 108, "section": "Sessions: quick mode and projects / Project structure", "item": "", "kind": "text", "text": "If an undo brings an image back, it is copied back into `inputs/` unchanged.", "digest": "859b8b06daf5", "entries": ["P11.2"], "covered": 1.0}, {"index": 114, "line": 112, "end_line": 112, "section": "Sessions: quick mode and projects / Sharing and importing projects", "item": "", "kind": "text", "text": "Share Project exports the current project as a `.delosproject` file: a zip archive containing the project directory.", "digest": "f441ba042cac", "entries": ["P12"], "covered": 1.0}, {"index": 115, "line": 113, "end_line": 113, "section": "Sessions: quick mode and projects / Sharing and importing projects", "item": "", "kind": "text", "text": "Import Project accepts a `.delosproject` file, a `project.delos` file or a project directory.", "digest": "3d802f4bfde0", "entries": ["P13"], "covered": 1.0}, {"index": 116, "line": 114, "end_line": 114, "section": "Sessions: quick mode and projects / Sharing and importing projects", "item": "", "kind": "text", "text": "A `.delosproject` file is unpacked into the projects folder under a new name, so it never overwrites an existing project.", "digest": "ed7374062429", "entries": ["P13.1"], "covered": 1.0}, {"index": 117, "line": 115, "end_line": 115, "section": "Sessions: quick mode and projects / Sharing and importing projects", "item": "", "kind": "text", "text": "A directory is opened in place, without copying.", "digest": "8bc090909f09", "entries": ["P13.2"], "covered": 1.0}, {"index": 118, "line": 116, "end_line": 116, "section": "Sessions: quick mode and projects / Sharing and importing projects", "item": "", "kind": "text", "text": "Projects can also be opened by dropping them onto the window.", "digest": "3ce3edd6d7c9", "entries": ["P13.3"], "covered": 1.0}, {"index": 119, "line": 117, "end_line": 117, "section": "Sessions: quick mode and projects / Sharing and importing projects", "item": "", "kind": "text", "text": "Before opening, Delos verifies the structure:", "digest": "9eb8f1de6a36", "entries": ["P14"], "covered": 1.0}, {"index": 120, "line": 118, "end_line": 118, "section": "Sessions: quick mode and projects / Sharing and importing projects", "item": "", "kind": "text", "text": "`project.delos` exists and parses;", "digest": "72107b7669da", "entries": ["P14"], "covered": 1.0}, {"index": 121, "line": 119, "end_line": 119, "section": "Sessions: quick mode and projects / Sharing and importing projects", "item": "", "kind": "text", "text": "`inputs/` exists;", "digest": "80e715d7f673", "entries": ["P14"], "covered": 1.0}, {"index": 122, "line": 120, "end_line": 120, "section": "Sessions: quick mode and projects / Sharing and importing projects", "item": "", "kind": "text", "text": "every image the graph refers to exists inside `inputs/`.", "digest": "c658a0ee07eb", "entries": ["P14"], "covered": 1.0}, {"index": 123, "line": 122, "end_line": 122, "section": "Sessions: quick mode and projects / Sharing and importing projects", "item": "", "kind": "text", "text": "It reports precisely what is wrong otherwise.", "digest": "aa9539a8327d", "entries": ["P14"], "covered": 1.0}, {"index": 124, "line": 123, "end_line": 123, "section": "Sessions: quick mode and projects / Sharing and importing projects", "item": "", "kind": "text", "text": "Paths that would point outside the project, whether in the project file or inside an archive, are rejected.", "digest": "e853dea8d47c", "entries": ["P15"], "covered": 1.0}, {"index": 125, "line": 123, "end_line": 123, "section": "Sessions: quick mode and projects / Sharing and importing projects", "item": "", "kind": "text", "text": "A failed import leaves nothing behind.", "digest": "be26a9a57da1", "entries": ["P15"], "covered": 1.0}, {"index": 126, "line": 127, "end_line": 127, "section": "Sessions: quick mode and projects / Delos expressions", "item": "", "kind": "text", "text": "The node graph has a plain-text representation, so we can speak of Delos *expressions*.", "digest": "92e6ec22a138", "entries": ["E1"], "covered": 1.0}, {"index": 127, "line": 127, "end_line": 127, "section": "Sessions: quick mode and projects / Delos expressions", "item": "", "kind": "text", "text": "It is a Lisp-like format, in keeping with layer stacks being treated as non-empty lists:", "digest": "faa68d3dfb9e", "entries": ["E1"], "covered": 1.0}, {"index": 128, "line": 129, "end_line": 138, "section": "Sessions: quick mode and projects / Delos expressions", "item": "", "kind": "code", "text": "; Nodes used more than once are bound with def; everything else nests. (def photo (image \"inputs/photo.png\" :at (60 40))) (output (stack (invert photo) (blend photo (noise :scale 0.3) :mode screen)) :canvas_w 1920 :canvas_h 1080) (noise :seed 4) ; nodes not connected to anything are kept too", "digest": "c958171a8f4e", "entries": [], "covered": 0.0}, {"index": 129, "line": 140, "end_line": 140, "section": "Sessions: quick mode and projects / Delos expressions", "item": "", "kind": "text", "text": "A node is written `(kind input… :param value…)`.", "digest": "2a8a0638e7b4", "entries": ["E2"], "covered": 1.0}, {"index": 130, "line": 140, "end_line": 140, "section": "Sessions: quick mode and projects / Delos expressions", "item": "", "kind": "text", "text": "Inputs come in port order, and `_` leaves a port empty.", "digest": "ab9524452f31", "entries": ["E2"], "covered": 1.0}, {"index": 131, "line": 141, "end_line": 141, "section": "Sessions: quick mode and projects / Delos expressions", "item": "", "kind": "text", "text": "Nodes with several outputs (splits) are always bound with `def`, and each output is referred to as `name.output`, e.g. `s.left`.", "digest": "5579a2f64402", "entries": ["E3"], "covered": 1.0}, {"index": 132, "line": 142, "end_line": 142, "section": "Sessions: quick mode and projects / Delos expressions", "item": "", "kind": "text", "text": "`(stack front … back)` is a layer stack.", "digest": "509561e150bb", "entries": ["E4"], "covered": 1.0}, {"index": 133, "line": 143, "end_line": 143, "section": "Sessions: quick mode and projects / Delos expressions", "item": "", "kind": "text", "text": "`(image \"inputs/…\")` is a static image.", "digest": "148789040e66", "entries": ["E5"], "covered": 1.0}, {"index": 134, "line": 144, "end_line": 144, "section": "Sessions: quick mode and projects / Delos expressions", "item": "", "kind": "text", "text": "`:at (x y)` is a node's position in the graph view, and `:title \"…\"` gives it a custom title.", "digest": "9fb166ba35cc", "entries": ["E6"], "covered": 1.0}, {"index": 135, "line": 145, "end_line": 145, "section": "Sessions: quick mode and projects / Delos expressions", "item": "", "kind": "text", "text": "Values are numbers, `true`/`false`, choices as symbols, colors as `(r g b a)` lists and text as strings.", "digest": "851642b2b5fb", "entries": ["E7"], "covered": 1.0}, {"index": 136, "line": 145, "end_line": 145, "section": "Sessions: quick mode and projects / Delos expressions", "item": "", "kind": "text", "text": "Comments start with `;`.", "digest": "ae9e897cc648", "entries": ["E7"], "covered": 1.0}, {"index": 137, "line": 146, "end_line": 146, "section": "Sessions: quick mode and projects / Delos expressions", "item": "", "kind": "text", "text": "When saving, every parameter is written, including defaults, so a project keeps its meaning if a default changes later.", "digest": "f1c696069d5b", "entries": ["E8"], "covered": 1.0}, {"index": 138, "line": 146, "end_line": 146, "section": "Sessions: quick mode and projects / Delos expressions", "item": "", "kind": "text", "text": "When reading, omitted parameters take their defaults, and nodes without `:at` are laid out automatically, so expressions can be written by hand.", "digest": "0112f31a5b9b", "entries": ["E8"], "covered": 1.0}, {"index": 139, "line": 147, "end_line": 147, "section": "Sessions: quick mode and projects / Delos expressions", "item": "", "kind": "text", "text": "Serializing and deserializing must be fast.", "digest": "77f47f04cc0e", "entries": ["E9"], "covered": 1.0}, {"index": 140, "line": 147, "end_line": 147, "section": "Sessions: quick mode and projects / Delos expressions", "item": "", "kind": "text", "text": "Doing both must give a functionally identical graph: the same nodes, connections, parameters, titles and positions, rendering the same pixels.", "digest": "c306ce98d772", "entries": ["E10"], "covered": 1.0}, {"index": 141, "line": 148, "end_line": 148, "section": "Sessions: quick mode and projects / Delos expressions", "item": "", "kind": "text", "text": "Errors are reported with a line and column.", "digest": "017155f48612", "entries": ["E11"], "covered": 1.0}, {"index": 142, "line": 152, "end_line": 152, "section": "Sessions: quick mode and projects / Platform status", "item": "", "kind": "text", "text": "Projects are currently desktop-first:", "digest": "49dc5eebd78c", "entries": ["X1"], "covered": 1.0}, {"index": 143, "line": 154, "end_line": 154, "section": "Sessions: quick mode and projects / Platform status", "item": "", "kind": "text",
