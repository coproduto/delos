c.rs#L120)); `OVER` is Porter-Duff over on premultiplied pixels, front over back ([kernels.rs:228-242](../../src/engine/kernels.rs#L228)).", "Tests": "`tests/engine.rs::invert_and_stack`, `tests/engine.rs::stack_chain_editing`, `tests/split.rs::parts_stack_back_into_the_original`.", "Notes": "`Stack::size` is the union of the input sizes, top-left aligned (`union_size`) ([basic.rs:117-119](../../src/nodes/basic.rs#L117), [basic.rs:20-24](../../src/nodes/basic.rs#L20))."}, "citations": [{"entry": "O1", "section": "Implemented by", "path": "src/nodes/basic.rs", "start": 114, "end": 116, "md": "03-operators.md:31"}, {"entry": "O1", "section": "Implemented by", "path": "src/graph.rs", "start": 441, "end": 465, "md": "03-operators.md:31"}, {"entry": "O1", "section": "Implemented by", "path": "src/nodes/basic.rs", "start": 120, "end": 130, "md": "03-operators.md:32"}, {"entry": "O1", "section": "Implemented by", "path": "src/engine/kernels.rs", "start": 228, "end": 242, "md": "03-operators.md:32"}, {"entry": "O1", "section": "Notes", "path": "src/nodes/basic.rs", "start": 117, "end": 119, "md": "03-operators.md:36"}, {"entry": "O1", "section": "Notes", "path": "src/nodes/basic.rs", "start": 20, "end": 24, "md": "03-operators.md:36"}], "tests": ["tests/engine.rs::invert_and_stack", "tests/engine.rs::stack_chain_editing", "tests/split.rs::parts_stack_back_into_the_original"], "links": [], "sections_html": {"Status": "<p>Implemented.<\/p>", "Implemented by": "<ul><li><code>Stack<\/code> has the inputs <code>front<\/code> and <code>back<\/code> and no <code>params<\/code> (<a href=\"../../src/nodes/basic.rs#L114\" target=\"_blank\">basic.rs:114-116<\/a>). A chain links each stack's <code>back<\/code> to the next stack (<a href=\"../../src/graph.rs#L441\" target=\"_blank\">graph.rs:441-465<\/a>).<\/li><li><code>Stack::render<\/code> returns one side when the other is clear, else runs <code>OVER<\/code> (<a href=\"../../src/nodes/basic.rs#L120\" target=\"_blank\">basic.rs:120-130<\/a>); <code>OVER<\/code> is Porter-Duff over on premultiplied pixels, front over back (<a href=\"../../src/engine/kernels.rs#L228\" target=\"_blank\">kernels.rs:228-242<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/engine.rs::invert_and_stack<\/code>, <code>tests/engine.rs::stack_chain_editing<\/code>, <code>tests/split.rs::parts_stack_back_into_the_original<\/code>.<\/p>", "Notes": "<p><code>Stack::size<\/code> is the union of the input sizes, top-left aligned (<code>union_size<\/code>) (<a href=\"../../src/nodes/basic.rs#L117\" target=\"_blank\">basic.rs:117-119<\/a>, <a href=\"../../src/nodes/basic.rs#L20\" target=\"_blank\">basic.rs:20-24<\/a>).<\/p>"}, "quotes_html": ["Stack operator - this is a basic operator which is used to form layer stacks.", "A layer stack will be internally represented as <code>(frontmost STACK (second-frontmost STACK (third-frontmost STACK ... (second-backmost STACK last) ... )))<\/code>.", "A layer stack will show the first non-transparent pixel found along the stack for each position.", "Delos implements this as standard \"over\" alpha compositing: this matches the rule for opaque pixels and also handles partly transparent ones.", "Takes no parameters."]}, {"id": "O1.1", "title": "Editing a stack: disable, remove", "anchor": "o1-1", "file": "03-operators.md", "line": 38, "area": "3 · Operators, splits, generators and sizes", "kind": "clause", "status": "Implemented", "quotes": ["If the stack operator is selected it should allow editing the stack, for example temporarily disabling inputs (which will be internally represented as a \"Disable\" operator which changes all pixels to transparent) or removing them completely."], "sections": {"Status": "Implemented. Layers can also be reordered and added (image, generator, empty slot).", "Implemented by": "- `LayerStack` in the inspector lists the layers, marking disabled ones (`ids::DISABLE`), and edits them through `set_layers` ([inspector.rs:404-422](../../src/ui/inspector.rs#L404), [inspector.rs:428-436](../../src/ui/inspector.rs#L428)). The eye button wraps the layer in a new `ids::DISABLE` node or unwraps it ([inspector.rs:444-463](../../src/ui/inspector.rs#L444)); ✕ removes the layer from the list ([inspector.rs:483-488](../../src/ui/inspector.rs#L483)).\n- Every change goes through `set_stack_layers`, which reuses, adds or removes stack nodes and keeps the head's id ([graph.rs:470-491](../../src/graph.rs#L470)).\n- In the graph view, removing a layer's edge removes the layer (`disconnect_ref`) ([graph_view.rs:166-174](../../src/ui/graph_view.rs#L166)).", "Tests": "`tests/engine.rs::stack_chain_editing`.", "Notes": "Re-enabling deletes the Disable node with `remove_node`. The disabled layer's title is shown greyed (the `enabled` flag). ▲/▼ swap layers (`l.swap`) ([inspector.rs:469-482](../../src/ui/inspector.rs#L469)). \"+ Image layer\", \"+ Generator layer…\" and \"+ Empty slot\" add layers (`ImportTarget::StackLayer`, `l.insert`, `l.push`) ([inspector.rs:492-523](../../src/ui/inspector.rs#L492)). In the graph view, dropping a wire on a layer row or \"+ add layer\" edits the chain (`connect_port`) ([graph_view.rs:120-133](../../src/ui/graph_view.rs#L120))."}, "citations": [{"entry": "O1.1", "section": "Implemented by", "path": "src/ui/inspector.rs", "start": 404, "end": 422, "md": "03-operators.md:45"}, {"entry": "O1.1", "section": "Implemented by", "path": "src/ui/inspector.rs", "start": 428, "end": 436, "md": "03-operators.md:45"}, {"entry": "O1.1", "section": "Implemented by", "path": "src/ui/inspector.rs", "start": 444, "end": 463, "md": "03-operators.md:45"}, {"entry": "O1.1", "section": "Implemented by", "path": "src/ui/inspector.rs", "start": 483, "end": 488, "md": "03-operators.md:45"}, {"entry": "O1.1", "section": "Implemented by", "path": "src/graph.rs", "start": 470, "end": 491, "md": "03-operators.md:46"}, {"entry": "O1.1", "section": "Implemented by", "path": "src/ui/graph_view.rs", "start": 166, "end": 174, "md": "03-operators.m ggle is untested.<\/p>"}, "quotes_html": ["Disable operator - mentioned with stack above."]}, {"id": "O3", "title": "Simple reflection", "anchor": "o3", "file": "03-operators.md", "line": 64, "area": "3 · Operators, splits, generators and sizes", "kind": "clause", "status": "Implemented", "quotes": ["Simple reflection operator - this should allow making reflections, i.e. placing axes of reflection on the image which will copy the pixels to one side of them to the other side.", "This tool, when selected, will allow (via WYSIWYG rule or form input) selecting where to position the axis of reflection.", "Via form, it should allow selecting a vertical or horizontal axis of reflection.", "It should also allow specifying whether the reflection should be additive, subtractive or replace the pixels where the reflection will fall."], "sections": {"Status": "Implemented.", "Implemented by": "- `Reflect::params`: `orientation` (vertical/horizontal; `ORIENTATIONS`) ([basic.rs:241](../../src/nodes/basic.rs#L241), [basic.rs:263](../../src/nodes/basic.rs#L263)), `position` (a fraction) ([basic.rs:264](../../src/nodes/basic.rs#L264)) and `mode` (replace/additive/subtractive; `REFLECT_MODES`) ([basic.rs:243](../../src/nodes/basic.rs#L243), [basic.rs:266](../../src/nodes/basic.rs#L266)).\n- The WYSIWYG rule: `Overlay::Axis` ([basic.rs:272-274](../../src/nodes/basic.rs#L272)), drawn and dragged by `render_overlay` ([image_view.rs:384-411](../../src/ui/image_view.rs#L384)).\n- `Reflect::render` renders the input directly and once more through the `mirror` map, only when the destination interval meets the request ([basic.rs:275-301](../../src/nodes/basic.rs#L275)); `REFLECT` picks per pixel and applies the mode ([kernels.rs:290-335](../../src/engine/kernels.rs#L290)).", "Tests": "`tests/engine.rs::reflection_mirrors_pixels` (replace mode, vertical axis only), `tests/engine.rs::gpu_matches_cpu` (parity, includes additive). Subtractive and the horizontal axis are untested.", "Notes": "The `side` parameter (copy left→right or right→left; `SIDES`) is not in the spec ([basic.rs:242](../../src/nodes/basic.rs#L242), [basic.rs:265](../../src/nodes/basic.rs#L265)). Subtractive keeps the destination's alpha; additive clamps in premultiplied space."}, "citations": [{"entry": "O3", "section": "Implemented by", "path": "src/nodes/basic.rs", "start": 241, "end": 241, "md": "03-operators.md:74"}, {"entry": "O3", "section": "Implemented by", "path": "src/nodes/basic.rs", "start": 263, "end": 263, "md": "03-operators.md:74"}, {"entry": "O3", "section": "Implemented by", "path": "src/nodes/basic.rs", "start": 264, "end": 264, "md": "03-operators.md:74"}, {"entry": "O3", "section": "Implemented by", "path": "src/nodes/basic.rs", "start": 243, "end": 243, "md": "03-operators.md:74"}, {"entry": "O3", "section": "Implemented by", "path": "src/nodes/basic.rs", "start": 266, "end": 266, "md": "03-operators.md:74"}, {"entry": "O3", "section": "Implemented by", "path": "src/nodes/basic.rs", "start": 272, "end": 274, "md": "03-operators.md:75"}, {"entry": "O3", "section": "Implemented by", "path": "src/ui/image_view.rs", "start": 384, "end": 411, "md": "03-operators.md:75"}, {"entry": "O3", "section": "Implemented by", "path": "src/nodes/basic.rs", "start": 275, "end": 301, "md": "03-operators.md:76"}, {"entry": "O3", "section": "Implemented by", "path": "src/engine/kernels.rs", "start": 290, "end": 335, "md": "03-operators.md:76"}, {"entry": "O3", "section": "Notes", "path": "src/nodes/basic.rs", "start": 242, "end": 242, "md": "03-operators.md:80"}, {"entry": "O3", "section": "Notes", "path": "src/nodes/basic.rs", "start": 265, "end": 265, "md": "03-operators.md:80"}], "tests": ["tests/engine.rs::reflection_mirrors_pixels", "tests/engine.rs::gpu_matches_cpu"], "links": [], "sections_html": {"Status": "<p>Implemented.<\/p>", "Implemented by": "<ul><li><code>Reflect::params<\/code>: <code>orientation<\/code> (vertical/horizontal; <code>ORIENTATIONS<\/code>) (<a href=\"../../src/nodes/basic.rs#L241\" target=\"_blank\">basic.rs:241<\/a>, <a href=\"../../src/nodes/basic.rs#L263\" target=\"_blank\">basic.rs:263<\/a>), <code>position<\/code> (a fraction) (<a href=\"../../src/nodes/basic.rs#L264\" target=\"_blank\">basic.rs:264<\/a>) and <code>mode<\/code> (replace/additive/subtractive; <code>REFLECT_MODES<\/code>) (<a href=\"../../src/nodes/basic.rs#L243\" target=\"_blank\">basic.rs:243<\/a>, <a href=\"../../src/nodes/basic.rs#L266\" target=\"_blank\">basic.rs:266<\/a>).<\/li><li>The WYSIWYG rule: <code>Overlay::Axis<\/code> (<a href=\"../../src/nodes/basic.rs#L272\" target=\"_blank\">basic.rs:272-274<\/a>), drawn and dragged by <code>render_overlay<\/code> (<a href=\"../../src/ui/image_view.rs#L384\" target=\"_blank\">image_view.rs:384-411<\/a>).<\/li><li><code>Reflect::render<\/code> renders the input directly and once more through the <code>mirror<\/code> map, only when the destination interval meets the request (<a href=\"../../src/nodes/basic.rs#L275\" target=\"_blank\">basic.rs:275-301<\/a>); <code>REFLECT<\/code> picks per pixel and applies the mode (<a href=\"../../src/engine/kernels.rs#L290\" target=\"_blank\">kernels.rs:290-335<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/engine.rs::reflection_mirrors_pixels<\/code> (replace mode, vertical axis only), <code>tests/engine.rs::gpu_matches_cpu<\/code> (parity, includes additive). Subtractive and the horizontal axis are untested.<\/p>", "Notes": "<p>The <code>side<\/code> parameter (copy left→right or right→left; <code>SIDES<\/code>) is not in the spec (<a href=\"../../src/nodes/basic.rs#L242\" target=\"_blank\">basic.rs:242<\/a>, <a href=\"../../src/nodes/basic.rs#L265\" target=\"_blank\">basic.rs:265<\/a>). Subtractive keeps the destination's alpha; additive clamps in premultiplied space.<\/p>"}, "quotes_html": ["Simple reflection operator - this should allow making reflections, i.e. placing axes of reflection on the image which will copy the pixels to one side of them to the other side.", "This tool, when selected, will allow (via WYSIWYG rule or form input) selecting where to position the axis of reflection.", "Via form, it should allow selecting a vertical or horizontal axis of reflection.", "It should also allow specifying whether the reflection should be additive, subtractive or replace the pixels where the reflection will fall."]}, {"id": "O4", "title": "Downscale", "anchor": "o4", "file": "03-operators.md", "line": 82, "area": "3 · Operators, splits, generators and sizes", "kind": "clause", "status": "Partial", "quotes": ["Downscale operator - should allow for downscaling"], "sections": {"Status": "Partial. Downscaling works, but \"box\" is not a box over the chosen factor: below a factor of 2 it samples like nearest, above it uses a fixed power-of-two pyramid level, and size-less inputs are point-sampled ([D-RESIZE](findings.md#d-resize)).", "Implemented by": "- `Downscale` with `factor` (1 to 64) ([resize.rs:230-232](../../src/nodes/resize.rs#L230)). Its `size` floors the scaled size ([resize.rs:233-237](../../src/nodes/resize.rs#L233)); `render` maps the request onto the input with `input_map` ([resize.rs:238-248](../../src/nodes/resize.rs#L238), [resize.rs:252-253](../../src/nodes/resize.rs#L252)).\n- Box averaging comes from the source pyramid: `level_for` picks the level whose texels match the request ([source.rs:114-121](../../src/engine/source.rs#L114)).", "Tests": "None.", "Notes": "A `method` choice (box average or nearest, `DOWN_METHODS`) is not in the spec ([resize.rs:210](../../src/nodes/resize.rs#L210), [resize.rs:231](../../src/nodes/resize.rs#L231)); `render` uses `Sampling::Point` for nearest ([resize.rs:249-251](../../src/nodes/resize.rs#L249)). For imported images, `level_for` picks the level `floor(log2(step))`, so for steps below 2 it is level 0, sampled nearest ([source.rs:114-133](../../src/engine/source.rs#L114)); above that it samples the chosen power-of-two level bilinearly."}, "citations": [{"entry": "O4", "section": "Implemented by", "path": "src/nodes/resize.rs", "start": 230, "end": 232, "md": "03-operators.md:89"}, {"entry": "O4", "section": "Implemented by", "path": "src/nodes/resize.rs", "start": 233, "end": 237, "md": "03-operators.md:89"}, {"entry": "O4", "section": "Implemented by", "path": "src/nodes/resize.rs", "start": 238, "end": 248, "md": "03-operators.md:89"}, {"entry": "O4", "section": "Implemented by", "path": "src/nodes/resize.rs", "start": 252, "end": 253, "md": "03-operators.md:89"}, {"entry": "O4", "section": "Implemented by", "path": "src/engine/source.rs", "start": 114, "end": 121, "md": "03-operators.md:90"}, {"entry": "O4", "section": "Notes", "path": "src/nodes/resize.rs", "start": 210, "end": 210, "md": "03-operators.md:94"}, {"entry": "O4", "section": "Notes", "path": "src/nodes/resize.rs", "start": 231, "end": 231, "md": "03-operators.md:94"}, {"entry": "O4", "section": "Notes", "path": "src/nodes/resize.rs", "start": 249, "end": 251, "md": "03-operators.md:94"}, {"entry": "O4", "section": "Notes", "path": "src/engine/source.rs", "start": 114, "end": 133, "md": "03-operators.md:94"}], "tests": [], "links": ["findings.md#d-resize"], "sections_html": {"Status": "<p>Partial. Downscaling works, but \"box\" is not a box over the chosen factor: below a factor of 2 it samples like nearest, above it uses a fixed power-of-two pyramid level, and size-less inputs are point-sampled (<a href=\"#\" data-goto=\"d-resize\">D-RESIZE<\/a>).<\/p>", "Implemented by": "<ul><li><code>Downscale<\/code> with <code>factor<\/code> (1 to 64) (<a href=\"../../src/nodes/resize.rs#L230\" target=\"_blank\">resize.rs:230-232<\/a>). Its <code>size<\/code> floors the scaled size (<a href=\"../../src/nodes/resize.rs#L233\" target=\"_blank\">resize.rs:233-237<\/a>); <code>render<\/code> maps the request onto the input with <code>input_map<\/code> (<a href=\"../../src/nodes/resize.rs#L238\" target=\"_blank\">resize.rs:238-248<\/a>, <a href=\"../../src/nodes/resize.rs#L252\" target=\"_blank\">resize.rs:252-253<\/a>).<\/li><li>Box averaging comes from the source pyramid: <code>level_for<\/code> picks the level whose texels match the request (<a href=\"../../src/engine/source.rs#L114\" target=\"_blank\">source.rs:114-121<\/a>).<\/li><\/ul>", "Tests": "<p>None.<\/p>", "Notes": "<p>A <code>method<\/code> choice (box average or nearest, <code>DOWN_METHODS<\/code>) is not in the spec (<a href=\"../../src/nodes/resize.rs#L210\" target=\"_blank\">resize.rs:210<\/a>, <a href=\"../../src/nodes/resize.rs#L231\" target=\"_blank\">resize.rs:231<\/a>); <code>render<\/code> uses <code>Sampling::Point<\/code> for nearest (<a href=\"../../src/nodes/resize.rs#L249\" target=\"_blank\">resize.rs:249-251<\/a>). For imported images, <code>level_for<\/code> picks the level <code>floor(log2(step))<\/code>, so for steps below 2 it is level 0, sampled nearest (<a href=\"../../src/engine/source.rs#L114\" target=\"_blank\">source.rs:114-133<\/a>); above that it samples the chosen power-of-two level bilinearly.<\/p>"}, "quotes_html": ["Downscale operator - should allow for downscaling"]}, {"id": "O5", "title": "Background removal with rembg-rs", "anchor": "o5", "file": "03-operators.md", "line": 96, "area": "3 · Operators, splits, generators and sizes", "kind": "clause", "status": "Partial", "quotes": ["Background removal operator - this should allow removing the input image's background using the `rembg-rs` crate.", "Controls set the background removal parameters."], "sections": {"Status": "Partial. Implemented with `rembg-rs` on desktop. The web and mobile builds compile a stub that reports an error, and on desktop the user must supply the ONNX model and the ONNX Runtime library ([D-PLAT](findings.md#d-plat)).", "Implemented by": "- `BackgroundRemoval::params`: `threshold`, `binary`, `sticker` (the `rembg-rs` `RemovalOptions`) ([bgremove.rs:42-46](../../src/nodes/bgremove.rs#L42)).\n- `render` renders the input over its whole extent (`src_req`), calls `compute_mask`, and applies the mask with the `MASK` kernel at any resolution ([bgremove.rs:62](../../src/nodes/bgremove.rs#L62), [bgremove.rs:77-81](../../src/nodes/bgremove.rs#L77), [bgremove.rs:83](../../src/nodes/bgremove.rs#L83), [bgremove.rs:89-97](../../src/nodes/bgremove.rs#L89)).\n- `compute_mask` calls `rembg_rs::rembg` with a shared `ModelManager` ([bgremove.rs:101-126](../../src/nodes/bgremove.rs#L101), [bgremove.rs:133-139](../../src/nodes/bgremove.rs#L133)).\n- Without the `rembg` feature, `compute_mask` bails ([bgremove.rs:169-172](../../src/nodes/bgremove.rs#L169)); `rembg` is only in the `desktop` feature ([Cargo.toml:8](../../Cargo.toml#L8)).", "Tests": "None (no model is available to the test suite).", "Notes": "Extra parameters `invert`, `resolution` and `model` ([bgremove.rs:47-49](../../src/nodes/bgremove.rs#L47)). `render` computes the mask once per input hash and settings, at the chosen `resolution`, and caches it in `engine.cache` ([bgremove.rs:64-77](../../src/nodes/bgremove.rs#L64), [bgremove.rs:84-85](../../src/nodes/bgremove.rs#L84)). `compute_mask` turns a missing ONNX Runtime into an error message (`catch_unwind`) ([bgremove.rs:127-132](../../src/nodes/bgremove.rs#L127)); `resolve_model` searches the parameter, `DELOS_REMBG_MODEL` and `~/.delos/models` ([bgremove.rs:146-167](../../src/nodes/bgremove.rs#L146)). The mask cache key builds on the structural hash, so it inherits the stale-identity defect ([D-STALE](findings.md#d-stale))."}, "citations": [{"entry": "O5", "section": "Implemented by", "path": "src/nodes/bgremove.rs", "start": 42, "end": 46, "md": "03-operators.md:104"}, {"entry": "O5", "section": "Implemented by", "path": "src/nodes/bgremove.rs", "start": 62, "end": 62, "md": "03-operators.md:105"}, {"entry": "O5", "section": "Implemented by", "path": "src/nodes/bgremove.rs", "start": 77, "end": 81, "md": "03-operators.md:105"}, {"entry": "O5", "section": "Implemented by", "path": "src/nodes/bgremove.rs", "start": 83, "end": 83, "md": "03-operators.md:105"}, {"entry": "O5", "section": "Implemented by", "path": "src/nodes/bgremove.rs", "start": 89, "end": 97, "md": "03-operators.md:105"}, {"entry": "O5", "section": "Implemented by", "path": "src/nodes/bgremove.rs", "start": 101, "end": 126, "md": "03-operators.md:106"}, {"entry": "O5", "section": "Implemented by", "path": "src/nodes/bgremove.rs", "start": 133, "end": 139, "md": "03-operators.md:106"}, {"entry": "O5", "section": "Implemented by", "path": "src/nodes/bgremove.rs", "start": 169, "end": 172, "md": "03-operators.md:107"}, {"entry": "O5", "section": "Implemented by", "path": "Cargo.toml", "start": 8, "end": 8, "md": "03-operators.md:107"}, {"entry": "O5", "section": "Notes", "path": "src/nodes/bgremove.rs", "start": 47, "end": 49, "md": "03-operators.md:111"}, {"entry": "O5", "section": "Notes", "path": "src/nodes/bgremove.rs", "start": 64, "end": 77, "md": "03-operators.md:111"}, {"entry": "O5", "section": "Notes", "path": "src/nodes/bgremove.rs", "start": 84, "end": 85, "md": "03-operators.md:111"}, {"entry": "O5", "section": "Notes", "path": "src/nodes/bgremove.rs", "start": 127, "end": 132, "md": "03-operators.md:111"}, {"entry": "O5", "section": "Notes", "path": "src/nodes/bgremove.rs", "start": 146, "end": 167, "md": "03-operators.md:111"}], "tests": [], "links": ["findings.md#d-plat", "findings.md#d-stale"], "sections_html": {"Status": "<p>Partial. Implemented with <code>rembg-rs<\/code> on desktop. The web and mobile builds compile a stub that reports an error, and on desktop the user must supply the ONNX model and the ONNX Runtime library (<a href=\"#\" data-goto=\"d-plat\">D-PLAT<\/a>).<\/p>", "Implemented by": "<ul><li><code>BackgroundRemoval::params<\/code>: <code>threshold<\/code>, <code>binary<\/code>, <code>sticker<\/code> (the <code>rembg-rs<\/code> <code>RemovalOptions<\/code>) (<a href=\"../../src/nodes/bgremove.rs#L42\" target=\"_blank\">bgremove.rs:42-46<\/a>).<\/li><li><code>render<\/code> renders the input over its whole extent (<code>src_req<\/code>), calls <code>compute_mask<\/code>, and applies the mask with the <code>MASK<\/code> kernel at any resolution (<a href=\"../../src/nodes/bgremove.rs#L62\" target=\"_blank\">bgremove.rs:62<\/a>, <a href=\"../../src/nodes/bgremove.rs#L77\" target=\"_blank\">bgremove.rs:77-81<\/a>, <a href=\"../../src/nodes/bgremove.rs#L83\" target=\"_blank\">bgremove.rs:83<\/a>, <a href=\"../../src/nodes/bgremove.rs#L89\" target=\"_blank\">bgremove.rs:89-97<\/a>).<\/li><li><code>compute_mask<\/code> calls <code>rembg_rs::rembg<\/code> with a shared <code>ModelManager<\/code> (<a href=\"../../src/nodes/bgremove.rs#L101\" target=\"_blank\">bgremove.rs:101-126<\/a>, <a href=\"../../src/nodes/bgremove.rs#L133\" target=\"_blank\">bgremove.rs:133-139<\/a>).<\/li><li>Without the <code>rembg<\/code> feature, <code>compute_mask<\/code> bails (<a href=\"../../src/nodes/bgremove.rs#L169\" target=\"_blank\">bgremove.rs:169-172<\/a>); <code>rembg<\/code> is only in the <code>desktop<\/code> feature (<a href=\"../../Cargo.toml#L8\" target=\"_blank\">Cargo.toml:8<\/a>).<\/li><\/ul>", "Tests": "<p>None (no model is available to the test suite).<\/p>", "Notes": "<p>Extra parameters <code>invert<\/code>, <code>resolution<\/code> and <code>model<\/code> (<a href=\"../../src/nodes/bgremove.rs#L47\" target=\"_blank\">bgremove.rs:47-49<\/a>). <code>render<\/code> computes the mask once per input hash and settings, at the chosen <code>resolution<\/code>, and caches it in <code>engine.cache<\/code> (<a href=\"../../src/nodes/bgremove.rs#L64\" target=\"_blank\">bgremove.rs:64-77<\/a>, <a href=\"../../src/nodes/bgremove.rs#L84\" target=\"_blank\">bgremove.rs:84-85<\/a>). <code>compute_mask<\/code> turns a missing ONNX Runtime into an error message (<code>catch_unwind<\/code>) (<a href=\"../../src/nodes/bgremove.rs#L127\" target=\"_blank\">bgremove.rs:127-132<\/a>); <code>resolve_model<\/code> searches the parameter, <code>DELOS_REMBG_MODEL<\/code> and <code>~/.delos/models<\/code> (<a href=\"../../src/nodes/bgremove.rs#L146\" target=\"_blank\">bgremove.rs:146-167<\/a>). The mask cache key builds on the structural hash, so it inherits the stale-identity defect (<a href=\"#\" data-goto=\"d-stale\">D-STALE<\/a>).<\/p>"}, "quotes_html": ["Background removal operator - this should allow removing the input image's background using the <code>rembg-rs<\/code> crate.", "Controls set the background removal parameters."]}, {"id": "O6", "title": "Invert", "anchor": "o6", "file": "03-operators.md", "line": 113, "area": "3 · Operators, splits, generators and sizes", "kind": "clause", "status": "Implemented", "quotes": ["Invert operator - inverts colors.", "(i.e. (R,G,B) -> (1-R,1-G,1-B)) with 0 <= R, G, B <= 1.", "No controls."], "sections": {"Status": "Implemented.", "Implemented by": "- `Invert` has no `params` and its `render` runs `INVERT` ([basic.rs:187-193](../../src/nodes/basic.rs#L187)).\n- `INVERT` computes `a − c` per channel on premultiplied pixels, which is `a·(1 − C)` for the straight colour `C`: the spec's formula, with alpha kept ([kernels.rs:215-226](../../src/engine/kernels.rs#L215)).", "Tests": "`tests/engine.rs::invert_and_stack`, `tests/engine.rs::gpu_matches_cpu`.", "Notes": "Values are sRGB-encoded, not linear (the `tile.rs` header); the spec does not say which."}, "citations": [{"entry": "O6", "section": "Implemented by", "path": "src/nodes/basic.rs", "start": 187, "end": 193, "md": "03-operators.md:122"}, {"entry": "O6", "section": "Implemented by", "path": "src/engine/kernels.rs", "start": 215, "end": 226, "md": "03-operators.md:123"}], "tests": ["tests/engine.rs::invert_and_stack", "tests/engine.rs::gpu_matches_cpu"], "links": [], "sections_html": {"Status": "<p>Implemented.<\/p>", "Implemented by": "<ul><li><code>Invert<\/code> has no <code>params<\/code> and its <code>render<\/code> runs <code>INVERT<\/code> (<a href=\"../../src/nodes/basic.rs#L187\" target=\"_blank\">basic.rs:187-193<\/a>).<\/li><li><code>INVERT<\/code> computes <code>a − c<\/code> per channel on premultiplied pixels, which is <code>a·(1 − C)<\/code> for the straight colour <code>C<\/code>: the spec's formula, with alpha kept (<a href=\"../../src/engine/kernels.rs#L215\" target=\"_blank\">kernels.rs:215-226<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/engine.rs::invert_and_stack<\/code>, <code>tests/engine.rs::gpu_matches_cpu<\/code>.<\/p>", "Notes": "<p>Values are sRGB-encoded, not linear (the <code>tile.rs<\/code> header); the spec does not say which.<\/p>"}, "quotes_html": ["Invert operator - inverts colors.", "(i.e. (R,G,B) -&gt; (1-R,1-G,1-B)) with 0 &lt;= R, G, B &lt;= 1.", "No controls."]}, {"id": "O7", "title": "Clip", "anchor": "o7", "file": "03-operators.md", "line": 129, "area": "3 · Operators, splits, generators and sizes", "kind": "clause", "status": "Implemented", "quotes": ["Clip - allows selecting a subset of image."], "sections": {"Status": "Implemented.", "Implemented by": "- `Clip` keeps the rectangle `x`, `y`, `w`, `h` (fractions of the input) ([basic.rs:324-331](../../src/nodes/basic.rs#L324)) with an `Overlay::Rect` and is edited on its input (`EditView::Input`) ([basic.rs:337-342](../../src/nodes/basic.rs#L337)). `size` rounds to whole pixels ([basic.rs:332-336](../../src/nodes/basic.rs#L332)) and `render` maps the request with `input_map` ([basic.rs:343-352](../../src/nodes/basic.rs#L343)).", "Tests": "`tests/engine.rs::clip_offsets_input`."}, "citations": [{"entry": "O7", "section": "Implemented by", "path": "src/nodes/basic.rs", "start": 324, "end": 331, "md": "03-operators.md:136"}, {"entry": "O7", "section": "Implemented by", "path": "src/nodes/basic.rs", "start": 337, "end": 342, "md": "03-operators.md:136"}, {"entry": "O7", "section": "Implemented by", "path": "src/nodes/basic.rs", "start": 332, "end": 336, "md": "03-operators.md:136"}, {"entry": "O7", "section": "Implemented by", "path": "src/nodes/basic.rs", "start": 343, "end": 352, "md": "03-operators.md:136"}], "tests": ["tests/engine.rs::clip_offsets_input"], "links": [], "sections_html": {"Status": "<p>Implemented.<\/p>", "Implemented by": "<ul><li><code>Clip<\/code> keeps the rectangle <code>x<\/code>, <code>y<\/code>, <code>w<\/code>, <code>h<\/code> (fractions of the input) (<a href=\"../../src/nodes/basic.rs#L324\" target=\"_blank\">basic.rs:324-331<\/a>) with an <code>Overlay::Rect<\/code> and is edited on its input (<code>EditView::Input<\/code>) (<a href=\"../../src/nodes/basic.rs#L337\" target=\"_blank\">basic.rs:337-342<\/a>). <code>size<\/code> rounds to whole pixels (<a href=\"../../src/nodes/basic.rs#L332\" target=\"_blank\">basic.rs:332-336<\/a>) and <code>render<\/code> maps the request with <code>input_map<\/code> (<a href=\"../../src/nodes/basic.rs#L343\" target=\"_blank\">basic.rs:343-352<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/engine.rs::clip_offsets_input<\/code>.<\/p>"}, "quotes_html": ["Clip - allows selecting a subset of image."]}, {"id": "O8", "title": "Resize with selectable interpolation", "anchor": "o8", "file": "03-operators.md", "line": 140, "area": "3 · Operators, splits, generators and sizes", "kind": "clause", "status": "Partial", "quotes": ["Resize - allows upscaling or downscaling input.", "Allows choosing upscale/downscale algorithm to use.", "Should offer nearest-neighbor, bilinear, bicubic and fourier-based interpolation."], "sections": {"Status": "Partial. All four filters are offered and used when upscaling. When downscaling on both axes, bilinear, bicubic and Fourier all give the same area-averaged result, so the choice only matters between \"nearest\" and the rest ([D-RESIZE](findings.md#d-resize)).", "Implemented by": "- `FILTERS` and `Resize::params` (`scale` and `filter`) ([resize.rs:15](../../src/nodes/resize.rs#L15), [resize.rs:55-56](../../src/nodes/resize.rs#L55), [resize.rs:58](../../src/nodes/resize.rs#L58), [resize.rs:61-63](../../src/nodes/resize.rs#L61)).\n- `Resize::render`: nearest uses `Sampling::Point` ([resize.rs:88-91](../../src/nodes/resize.rs#L88)); coarse grids and size-less inputs return the area-filtered input regardless of filter ([resize.rs:92-98](../../src/nodes/resize.rs#L92)); upsampling fetches native pixels and runs `RESAMPLE` with bilinear or bicubic sampling ([resize.rs:99-103](../../src/nodes/resize.rs#L99), [resize.rs:107-108](../../src/nodes/resize.rs#L107), [resize.rs:119-120](../../src/nodes/resize.rs#L119)).\n- Fourier: `render` calls `fourier_resample` and resamples its result ([resize.rs:109](../../src/nodes/resize.rs#L109), [resize.rs:111-113](../../src/nodes/resize.rs#L111), [resize.rs:115-118](../../src/nodes/resize.rs#L115)); `fourier_resample` zero-pads or truncates the spectrum, rows then columns ([resize.rs:124-206](../../src/nodes/resize.rs#L124)).\n- Bicubic is Catmull-Rom (`catmull_rom`) in both backends ([tile.rs:109-120](../../src/engine/tile.rs#L109)).", "Tests": "`tests/engine.rs::resize_nearest_is_exact_and_fourier_is_close`.", "Notes": "Upscaling also falls back to the area path when the native cover exceeds four times the output, with a floor of 65,536 pixels (`native.pixel_count()`), so very large upscales of large regions ignore the filter too ([resize.rs:104-106](../../src/nodes/resize.rs#L104)). A `mode` choice between a scale factor and an exact `width`/`height` (`MODES`) is not in the spec ([resize.rs:14](../../src/nodes/resize.rs#L14), [resize.rs:57](../../src/nodes/resize.rs#L57), [resize.rs:59-60](../../src/nodes/resize.rs#L59))."}, "citations": [{"entry": "O8", "section": "Implemented by", "path": "src/nodes/resize.rs", "start": 15, "end": 15, "md": "03-operators.md:149"}, {"entry": "O8", "section": "Implemented by", "path": "src/nodes/resize.rs", "start": 55, "end": 56, "md": "03-operators.md:149"}, {"entry": "O8", "section": "Implemented by", "path": "src/nodes/resize.rs", "start": 58, "end": 58, "md": "03-operators.md:149"}, {"entry": "O8", "section": "Implemented by", "path": "src/nodes/resize.rs", "start": 61, "end": 63, "md": "03-operators.md:149"}, {"entry": "O8", "section": "Implemented by", "path": "src/nodes/resize.rs", "start": 88, "end": 91, "md": "03-operators.md:150"}, {"entry": "O8", "section": "Implemented by", "path": "src/nodes/resize.rs", "start": 92, "end": 98, "md": "03-operators.md:150"}, {"entry": "O8", "section": "Implemented by", "path": "src/nodes/resize.rs", "start": 99, "end": 103, "md": "03-operators.md:150"}, {"entry": "O8", "section": "Implemented by", "path": "src/nodes/resize.rs", "start": 107, "end": 108, "md": "03-operators.md:150"}, {"entry": "O8", "section": "Implemented by", "path": "src/nodes/resize.rs", "start": 119, "end": 120, "md": "03-operators.md:150"}, {"entry": "O8", "section": "Implemented by", "path": "src/nodes/resize.rs", "start": 109, "end": 109, "md": "03-operators.md:151"}, {"entry": "O8", "section": "Implemented by", "path": "src/nodes/resize.rs", "start": 111, "end": 113, "md": "03-operators.md:151"}, {"entry": "O8", "section": "Implemented by", "path": "src/nodes/resize.rs", "start": 115, "end": 118, "md": "03-operators.md:151"}, {"entry": "O8", "section": "Implemented by", "path": "src/nodes/resize.rs", "start": 124, "end": 206, "md": "03-operators.md:151"}, {"entry": "O8", "section": "Implemented by", "path": "src/engine/tile.rs", "start": 109, "end": 120, "md": "03-operators.md:152"}, {"entry": "O8", "section": "Notes", "path": "src/nodes/resize.rs", "start": 104, "end": 106, "md": "03-operators.md:156"}, {"entry": "O8", "section": "Notes", "path": "src/nodes/resize.rs", "start": 14, "end": 14, "md": "03-operators.md:156"}, {"entry": "O8", "section": "Notes", "path": "src/nodes/resize.rs", "start": 57, "end": 57, "md": "03-operators.md:156"}, {"entry": "O8", "section": "Notes", "path": "src/nodes/resize.rs", "start": 59, "end": 60, "md": "03-operators.md:156"}], "tests": ["tests/engine.rs::resize_nearest_is_exact_and_fourier_is_close"], "links": ["findings.md#d-resize"], "sections_html": {"Status": "<p>Partial. All four filters are offered and used when upscaling. When downscaling on both axes, bilinear, bicubic and Fourier all give the same area-averaged result, so the choice only matters between \"nearest\" and the rest (<a href=\"#\" data-goto=\"d-resize\">D-RESIZE<\/a>).<\/p>", "Implemented by": "<ul><li><code>FILTERS<\/code> and <code>Resize::params<\/code> (<code>scale<\/code> and <code>filter<\/code>) (<a href=\"../../src/nodes/resize.rs#L15\" target=\"_blank\">resize.rs:15<\/a>, <a href=\"../../src/nodes/resize.rs#L55\" target=\"_blank\">resize.rs:55-56<\/a>, <a href=\"../../src/nodes/resize.rs#L58\" target=\"_blank\">resize.rs:58<\/a>, <a href=\"../../src/nodes/resize.rs#L61\" target=\"_blank\">resize.rs:61-63<\/a>).<\/li><li><code>Resize::render<\/code>: nearest uses <code>Sampling::Point<\/code> (<a href=\"../../src/nodes/resize.rs#L88\" target=\"_blank\">resize.rs:88-91<\/a>); coarse grids and size-less inputs return the area-filtered input regardless of filter (<a href=\"../../src/nodes/resize.rs#L92\" target=\"_blank\">resize.rs:92-98<\/a>); upsampling fetches native pixels and runs <code>RESAMPLE<\/code> with bilinear or bicubic sampling (<a href=\"../../src/nodes/resize.rs#L99\" target=\"_blank\">resize.rs:99-103<\/a>, <a href=\"../../src/nodes/resize.rs#L107\" target=\"_blank\">resize.rs:107-108<\/a>, <a href=\"../../src/nodes/resize.rs#L119\" target=\"_blank\">resize.rs:119-120<\/a>).<\/li><li>Fourier: <code>render<\/code> calls <code>fourier_resample<\/code> and resamples its result (<a href=\"../../src/nodes/resize.rs#L109\" target=\"_blank\">resize.rs:109<\/a>, <a href=\"../../src/nodes/resize.rs#L111\" target=\"_blank\">resize.rs:111-113<\/a>, <a href=\"../../src/nodes/resize.rs#L115\" target=\"_blank\">resize.rs:115-118<\/a>); <code>fourier_resample<\/code> zero-pads or truncates the spectrum, rows then columns (<a href=\"../../src/nodes/resize.rs#L124\" target=\"_blank\">resize.rs:124-206<\/a>).<\/li><li>Bicubic is Catmull-Rom (<code>catmull_rom<\/code>) in both backends (<a href=\"../../src/engine/tile.rs#L109\" target=\"_blank\">tile.rs:109-120<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/engine.rs::resize_nearest_is_exact_and_fourier_is_close<\/code>.<\/p>", "Notes": "<p>Upscaling also falls back to the area path when the native cover exceeds four times the output, with a floor of 65,536 pixels (<code>native.pixel_count()<\/code>), so very large upscales of large regions ignore the filter too (<a href=\"../../src/nodes/resize.rs#L104\" target=\"_blank\">resize.rs:104-106<\/a>). A <code>mode<\/code> choice between a scale factor and an exact <code>width<\/code>/<code>height<\/code> (<code>MODES<\/code>) is not in the spec (<a href=\"../../src/nodes/resize.rs#L14\" target=\"_blank\">resize.rs:14<\/a>, <a href=\"../../src/nodes/resize.rs#L57\" target=\"_blank\">resize.rs:57<\/a>, <a href=\"../../src/nodes/resize.rs#L59\" target=\"_blank\">resize.rs:59-60<\/a>).<\/p>"}, "quotes_html": ["Resize - allows upscaling or downscaling input.", "Allows choosing upscale/downscale algorithm to use.", "Should offer nearest-neighbor, bilinear, bicubic and fourier-based interpolation."]}, {"id": "O9", "title": "Blend with the Wikipedia blend modes", "anchor": "o9", "file": "03-operators.md", "line": 158, "area": "3 · Operators, splits, generators and sizes", "kind": "clause", "status": "Implemented", "quotes": ["Blend operator - allows combining images with the blend modes specified at https://en.wikipedia.org/wiki/Blend_modes plus the following:"], "sections": {"Status": "Implemented. Every mode the article names is present: normal, dissolve, multiply, screen, overlay, hard light, soft light, colour dodge and burn, linear dodge (addition) and burn, divide, subtract, difference, darken only, lighten only, hue, saturation, colour and luminosity. The code adds the modes the article mentions in passing or Photoshop defines (vivid, linear and pin light, hard mix, exclusion), and an `opacity` parameter.", "Implemented by": "- `BLEND_MODES` lists `normal` to `linear_burn` ([kernels.rs:341-352](../../src/engine/kernels.rs#L341)), `divide`, `subtract`, `difference` ([kernels.rs:357-359](../../src/engine/kernels.rs#L357)) and `darken` to `luminosity` ([kernels.rs:361-366](../../src/engine/kernels.rs#L361)); `Blend::params` (`mode`) and `render` ([basic.rs:216-218](../../src/nodes/basic.rs#L216), [basic.rs:222-228](../../src/nodes/basic.rs#L222), [basic.rs:230-231](../../src/nodes/basic.rs#L230)).\n- Separable modes: `blend_channel` ([kernels.rs:413-423](../../src/engine/kernels.rs#L413), [kernels.rs:432-436](../../src/engine/kernels.rs#L432), [kernels.rs:438-439](../../src/engine/kernels.rs#L438), [kernels.rs:443-445](../../src/engine/kernels.rs#L443)); non-separable modes: `blend_color` with `set_lum` and `set_sat` ([kernels.rs:468-493](../../src/engine/kernels.rs#L468)); the GPU versions of the same modes are WGSL helpers in `BLEND` (`screen1` to `soft_light`, `blend_channel`, `blend_color` with `set_lum` and `set_sat`) ([kernels.rs:501-521](../../src/engine/kernels.rs#L501), [kernels.rs:534-544](../../src/engine/kernels.rs#L534), [kernels.rs:555-560](../../src/engine/kernels.rs#L555), [kernels.rs:562-563](../../src/engine/kernels.rs#L562), [kernels.rs:567](../../src/engine/kernels.rs#L567), [kernels.rs:570-599](../../src/engine/kernels.rs#L570)); compositing with the backdrop's alpha in `BLEND`'s WGSL `kernel` ([kernels.rs:600-617](../../src/engine/kernels.rs#L600)) and `cpu` closure ([kernels.rs:619-646](../../src/engine/kernels.rs#L619)).", "Tests": "`tests/engine.rs::every_blend_mode_renders`, `tests/engine.rs::gpu_matches_cpu`.", "Notes": "Extra modes `vivid_light`, `linear_light`, `pin_light`, `hard_mix` ([kernels.rs:353-356](../../src/engine/kernels.rs#L353)) and `exclusion` ([kernels.rs:360](../../src/engine/kernels.rs#L360)), computed in `blend_channel` ([kernels.rs:424-431](../../src/engine/kernels.rs#L424), [kernels.rs:437](../../src/engine/kernels.rs#L437)) with the `vivid_light` helper ([kernels.rs:397-400](../../src/engine/kernels.rs#L397)), and in the WGSL ([kernels.rs:522-525](../../src/engine/kernels.rs#L522), [kernels.rs:545-554](../../src/engine/kernels.rs#L545), [kernels.rs:561](../../src/engine/kernels.rs#L561), exclusion is `case 18u`). The `opacity` parameter ([basic.rs:217](../../src/nodes/basic.rs#L217), [basic.rs:229](../../src/nodes/basic.rs#L229)). Soft light uses the W3C formula (the article lists several). The mode list was checked against the article on 2026-10-14."}, "citations": [{"entry": "O9", "section": "Implemented by", "path": "src/engine/kernels.rs", "start": 341, "end": 352, "md": "03-operators.md:165"}, {"entry": "O9", "section": "Implemented by", "path": "src/engine/kernels.rs", "start": 357, "end": 359, "md": "03-operators.md:165"}, {"entry": "O9", "section": "Implemented by", "path": "src/engine/kernels.rs", "start": 361, "end": 366, "md": "03-operators.md:165"}, {"entry": "O9", "section": "Implemented by", "path": "src/nodes/basic.rs", "start": 216, "end": 218, "md": "03-operators.md:165"}, {"entry": "O9", "section": "Implemented by", "path": "src/nodes/basic.rs", "start": 222, "end": 228, "md": "03-operators.md:165"}, {"entry": "O9", "section": "Implemented by", "path": "src/nodes/basic.rs", "start": 230, "end": 231, "md": "03-operators.md:165"}, {"entry": "O9", "section": "Implemented by", "path": "src/engine/kernels.rs", "start": 413, "end": 423, "md": "03-operators.md:166"}, {"entry": "O9", "section": "Implemented by", "path": "src/engine/kernels.rs", "start": 432, "end": 436, "md": "03-operators.md:166"}, {"entry": "O9", "section": "Implemented by", "path": "src/engine/kernels.rs", "start": 438, "end": 439, "md": "03-operators.md:166"}, {"entry": "O9", "section": "Implemented by", "path": "src/engine/kernels.rs", "start": 443, "end": 445, "md": "03-operators.md:166"}, {"entry": "O9", "section": "Implemented by", "path": "src/engine/kernels.rs", "start": 468, "end": 493, "md": "03-operators.md:166"}, {"entry": "O9", "section": "Implement arget=\"_blank\">kernels.rs:437<\/a>) with the <code>vivid_light<\/code> helper (<a href=\"../../src/engine/kernels.rs#L397\" target=\"_blank\">kernels.rs:397-400<\/a>), and in the WGSL (<a href=\"../../src/engine/kernels.rs#L522\" target=\"_blank\">kernels.rs:522-525<\/a>, <a href=\"../../src/engine/kernels.rs#L545\" target=\"_blank\">kernels.rs:545-554<\/a>, <a href=\"../../src/engine/kernels.rs#L561\" target=\"_blank\">kernels.rs:561<\/a>, exclusion is <code>case 18u<\/code>). The <code>opacity<\/code> parameter (<a href=\"../../src/nodes/basic.rs#L217\" target=\"_blank\">basic.rs:217<\/a>, <a href=\"../../src/nodes/basic.rs#L229\" target=\"_blank\">basic.rs:229<\/a>). Soft light uses the W3C formula (the article lists several). The mode list was checked against the article on 2026-10-14.<\/p>"}, "quotes_html": ["Blend operator - allows combining images with the blend modes specified at https://en.wikipedia.org/wiki/Blend_modes plus the following:"]}, {"id": "O10", "title": "Logic-gate blend modes", "anchor": "o10", "file": "03-operators.md", "line": 172, "area": "3 · Operators, splits, generators and sizes", "kind": "clause", "status": "Implemented", "quotes": ["Logic Gate: applies logic operation (and, or, xor) to both images.", "Note that nand, nor and xnor are not included bc they can be achieved with the invert operator."], "sections": {"Status": "Implemented.", "Implemented by": "- `and`, `or` and `xor` are entries 25 to 27 of `BLEND_MODES` ([kernels.rs:367-369](../../src/engine/kernels.rs#L367)); `logic` quantises each straight colour channel to 8 bits and applies the operation ([kernels.rs:402-411](../../src/engine/kernels.rs#L402)); `blend_channel` dispatches the three modes to it ([kernels.rs:440-442](../../src/engine/kernels.rs#L440)), and the WGSL `logic` and `blend_channel` do the same on the GPU ([kernels.rs:526-533](../../src/engine/kernels.rs#L526), [kernels.rs:564-566](../../src/engine/kernels.rs#L564)).", "Tests": "`tests/engine.rs::every_blend_mode_renders`.", "Notes": "The gates apply to colour only; alpha is composited like any other blend mode."}, "citations": [{"entry": "O10", "section": "Implemented by", "path": "src/engine/kernels.rs", "start": 367, "end": 369, "md": "03-operators.md:180"}, {"entry": "O10", "section": "Implemented by", "path": "src/engine/kernels.rs", "start": 402, "end": 411, "md": "03-operators.md:180"}, {"entry": "O10", "section": "Implemented by", "path": "src/engine/kernels.rs", "start": 440, "end": 442, "md": "03-operators.md:180"}, {"entry": "O10", "section": "Implemented by", "path": "src/engine/kernels.rs", "start": 526, "end": 533, "md": "03-operators.md:180"}, {"entry": "O10", "section": "Implemented by", "path": "src/engine/kernels.rs", "start": 564, "end": 566, "md": "03-operators.md:180"}], "tests": ["tests/engine.rs::every_blend_mode_renders"], "links": [], "sections_html": {"Status": "<p>Implemented.<\/p>", "Implemented by": "<ul><li><code>and<\/code>, <code>or<\/code> and <code>xor<\/code> are entries 25 to 27 of <code>BLEND_MODES<\/code> (<a href=\"../../src/engine/kernels.rs#L367\" target=\"_blank\">kernels.rs:367-369<\/a>); <code>logic<\/code> quantises each straight colour channel to 8 bits and applies the operation (<a href=\"../../src/engine/kernels.rs#L402\" target=\"_blank\">kernels.rs:402-411<\/a>); <code>blend_channel<\/code> dispatches the three modes to it (<a href=\"../../src/engine/kernels.rs#L440\" target=\"_blank\">kernels.rs:440-442<\/a>), and the WGSL <code>logic<\/code> and <code>blend_channel<\/code> do the same on the GPU (<a href=\"../../src/engine/kernels.rs#L526\" target=\"_blank\">kernels.rs:526-533<\/a>, <a href=\"../../src/engine/kernels.rs#L564\" target=\"_blank\">kernels.rs:564-566<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/engine.rs::every_blend_mode_renders<\/code>.<\/p>", "Notes": "<p>The gates apply to colour only; alpha is composited like any other blend mode.<\/p>"}, "quotes_html": ["Logic Gate: applies logic operation (and, or, xor) to both images.", "Note that nand, nor and xnor are not included bc they can be achieved with the invert operator."]}, {"id": "S1", "title": "Splits produce two complementary outputs", "anchor": "s1", "file": "03-operators.md", "line": 186, "area": "3 · Operators, splits, generators and sizes", "kind": "clause", "status": "Implemented", "quotes": ["Splitting an image produces two output images, one for each side of a split border.", "One output contains the pixels on one side of the border, with every pixel on the other side transparent.", "The other output contains the complementary pixels, with those present in the first output transparent.", "This makes localized effects possible, as selections do in a regular editor."], "sections": {"Status": "Implemented.", "Implemented by": "- `Split` kinds declare two `outputs`; output 0 keeps the `region`, output 1 the rest ([split.rs:21-31](../../src/nodes/split.rs#L21)). `render_output` short-cuts tiles wholly on one side and otherwise runs `SPLIT` with `keep_inside` ([split.rs:110-131](../../src/nodes/split.rs#L110)).\n- `SPLIT` keeps the input pixel or returns transparent ([kernels.rs:267-288](../../src/engine/kernels.rs#L267)).", "Tests": "`tests/split.rs::vertical_split_partitions_at_the_border`, `tests/split.rs::localized_effect_on_one_side`."}, "citations": [{"entry": "S1", "section": "Implemented by", "path": "src/nodes/split.rs", "start": 21, "end": 31, "md": "03-operators.md:196"}, {"entry": "S1", "section": "Implemented by", "path": "src/nodes/split.rs", "start": 110, "end": 131, "md": "03-operators.md:196"}, {"entry": "S1", "section": "Implemented by", "path": "src/engine/kernels.rs", "start": 267, "end": 288, "md": "03-operators.md:197"}], "tests": ["tests/split.rs::vertical_split_partitions_at_the_border", "tests/split.rs::localized_effect_on_one_side"], "links": [], "sections_html": {"Status": "<p>Implemented.<\/p>", "Implemented by": "<ul><li><code>Split<\/code> kinds declare two <code>outputs<\/code>; output 0 keeps the <code>region<\/code>, output 1 the rest (<a href=\"../../src/nodes/split.rs#L21\" target=\"_blank\">split.rs:21-31<\/a>). <code>render_output<\/code> short-cuts tiles wholly on one side and otherwise runs <code>SPLIT<\/code> with <code>keep_inside<\/code> (<a href=\"../../src/nodes/split.rs#L110\" target=\"_blank\">split.rs:110-131<\/a>).<\/li><li><code>SPLIT<\/code> keeps the input pixel or returns transparent (<a href=\"../../src/engine/kernels.rs#L267\" target=\"_blank\">kernels.rs:267-288<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/split.rs::vertical_split_partitions_at_the_border<\/code>, <code>tests/split.rs::localized_effect_on_one_side<\/code>.<\/p>"}, "quotes_html": ["Splitting an image produces two output images, one for each side of a split border.", "One output contains the pixels on one side of the border, with every pixel on the other side transparent.", "The other output contains the complementary pixels, with those present in the first output transparent.", "This makes localized effects possible, as selections do in a regular editor."]}, {"id": "S2", "title": "Vertical, horizontal and rectangle splits and their controls", "anchor": "s2", "file": "03-operators.md", "line": 201, "area": "3 · Operators, splits, generators and sizes", "kind": "clause", "status": "Implemented", "quotes": ["Vertical Split (`left` / `right`), Horizontal Split (`top` / `bottom`) and Rectangle Split (`inside` / `outside`) are provided.", "Each is controlled in the image view by dragging the border line, or by moving and resizing the rectangle, or via form inputs."], "sections": {"Status": "Implemented.", "Implemented by": "- `VERTICAL`, `HORIZONTAL` and `RECTANGLE` with their `outputs`, fraction `params` and `overlays` ([split.rs:33-73](../../src/nodes/split.rs#L33)).\n- `Overlay::Line` is drawn and dragged (`Drag::Axis`) ([image_view.rs:412-418](../../src/ui/image_view.rs#L412), [image_view.rs:427-441](../../src/ui/image_view.rs#L427)); `Overlay::Rect` c/ui/image_view.rs#L277)). Form: the Output node's integer fields.", "Tests": "`tests/large_images.rs::export_16k_streams_in_bands` (a generator exported at a set canvas)."}, "citations": [{"entry": "N2", "section": "Implemented by", "path": "src/nodes/mod.rs", "start": 212, "end": 214, "md": "03-operators.md:303"}, {"entry": "N2", "section": "Implemented by", "path": "src/nodes/generators.rs", "start": 37, "end": 39, "md": "03-operators.md:303"}, {"entry": "N2", "section": "Implemented by", "path": "src/engine/kernels.rs", "start": 649, "end": 652, "md": "03-operators.md:303"}, {"entry": "N2", "section": "Implemented by", "path": "src/nodes/basic.rs", "start": 46, "end": 51, "md": "03-operators.md:304"}, {"entry": "N2", "section": "Implemented by", "path": "src/graph.rs", "start": 301, "end": 308, "md": "03-operators.md:304"}, {"entry": "N2", "section": "Implemented by", "path": "src/ui/image_view.rs", "start": 305, "end": 322, "md": "03-operators.md:305"}, {"entry": "N2", "section": "Implemented by", "path": "src/ui/image_view.rs", "start": 277, "end": 286, "md": "03-operators.md:305"}], "tests": ["tests/large_images.rs::export_16k_streams_in_bands"], "links": [], "sections_html": {"Status": "<p>Implemented.<\/p>", "Implemented by": "<ul><li><code>NodeKind::size<\/code> returns an <code>Option<\/code>, where <code>None<\/code> means size-less (<a href=\"../../src/nodes/mod.rs#L212\" target=\"_blank\">nodes/mod.rs:212-214<\/a>); <code>Generator::size<\/code> returns <code>None<\/code> (<a href=\"../../src/nodes/generators.rs#L37\" target=\"_blank\">generators.rs:37-39<\/a>); generator kernels normalise coordinates against the requested <code>extent<\/code> (kernel header) (<a href=\"../../src/engine/kernels.rs#L649\" target=\"_blank\">kernels.rs:649-652<\/a>).<\/li><li>The output's <code>canvas_w<\/code> and <code>canvas_h<\/code> give the size when its input is size-less: <code>Output::params<\/code> and <code>Output::size<\/code> (<a href=\"../../src/nodes/basic. cted to combining operators, they will generate at whatever size is necessary to combine successfully with the other side."], "sections": {"Status": "Implemented.", "Implemented by": "- A combining node's size comes from its definite inputs (`union_size`, `Blend::size`) ([basic.rs:20-24](../../src/nodes/basic.rs#L20), [basic.rs:219-221](../../src/nodes/basic.rs#L219)).\n- `input_request` passes the consumer's `extent` to inputs without a size of their own ([basic.rs:14-18](../../src/nodes/basic.rs#L14)); `size_conflict` ignores size-less inputs (`size_of`) ([graph.rs:352-353](../../src/graph.rs#L352)).", "Tests": "None checks that a generator adapts to its consumer's size; `tests/project.rs::save_and_load_give_the_same_graph` renders a stack of an image and noise without asserting the size."}, "citations": [{"entry": "N4", "section": "Implemented by", "path": "src/nodes/basic.rs", "start": 20, "end": 24, "md": "03-operators.md:330"}, {"entry": "N4", "section": "Implemented by", "path": "src/nodes/basic.rs", "start": 219, "end": 221, "md": "03-operators.md:330"}, {"entry": "N4", "section": "Implemented by", "path": "src/nodes/basic.rs", "start": 14, "end": 18, "md": "03-operators.md:331"}, {"entry": "N4", "section": "Implemented by", "path": "src/graph.rs", "start": 352, "end": 353, "md": "03-operators.md:331"}], "tests": ["tests/project.rs::save_and_load_give_the_same_graph"], "links": [], "sections_html": {"Status": "<p>Implemented.<\/p>", "Implemented by": "<ul><li>A combining node's size comes from its definite inputs (<code>union_size<\/code>, <code>Blend::size<\/code>) (<a href=\"../../src/nodes/basic.rs#L20\" target=\"_blank\">basic.rs:20-24<\/a>, <a href=\"../../src/nodes/basic.rs#L219\" target=\"_blank\">basic.rs:219-221<\/a>).<\/li><li><code>input_request<\/code> passes the consumer's <code>extent<\/code> to inputs without a size of their own (<a href=\"../../src/nodes/basic.rs#L14\" target=\"_blank\">basic.rs:14-18<\/a>); <code>size_conflict<\/code> ignores size-less inputs (<code>size_of<\/code>) (<a href=\"../../src/graph.rs#L352\" target=\"_blank\">graph.rs:352-353<\/a>).<\/li><\/ul>", "Tests": "<p>None checks that a generator adapts to its consumer's size; <code>tests/project.rs::save_and_load_give_the_same_graph<\/code> renders a stack of an image and noise without asserting the size.<\/p>"}, "quotes_html": ["If generative operators are connected to combining operators, they will generate at whatever size is necessary to combine successfully with the other side."]}, {"id": "N5", "title": "The initial generators", "anchor": "n5", "file": "03-operators.md", "line": 335, "area": "3 · Operators, splits, generators and sizes", "kind": "clause", "status": "Implemented", "quotes": ["The initial generators are: solid color, linear gradient, radial gradient, checkerboard, noise (fBm, turbulence, ridged), Voronoi and Mandelbrot."], "sections": {"Status": "Implemented.", "Implemented by": "- `SOLID`, `LINEAR`, `RADIAL`, `CHECKER`, `NOISE` (with `NOISE_TYPES` fbm, turbulence, ridged), `VORONOI` and `MANDELBROT` ([generators.rs:61-220](../../src/nodes/generators.rs#L61)).\n- Their kernels, `SOLID` to `MANDELBROT` ([kernels.rs:738-976](../../src/engine/kernels.rs#L738)).", "Tests": "`tests/engine.rs::gpu_matches_cpu` (renders every generator; skipped without a GPU)."}, "citations": [{"entry": "N5", "section": "Implemented by", "path": "src/nodes/generators.rs", "start": 61, "end": 220, "md": "03-operators.md:342"}, {"entry": "N5", "section": "Implemented by", "path": "src/engine/kernels.rs", "start": 738, "end": 976, "md": "03-operators.md:343"}], "tests": ["tests/engine.rs::gpu_matches_cpu"], "links": [], "sections_html": {"Status": "<p>Implemented.<\/p>", "Implemented by": "<ul><li><code>SOLID<\/code>, <code>LINEAR<\/code>, <code>RADIAL<\/code>, <code>CHECKER<\/code>, <code>NOISE<\/code> (with <code>NOISE_TYPES<\/code> fbm, turbulence, ridged), <code>VORONOI<\/code> and <code>MANDELBROT<\/code> (<a href=\"../../src/nodes/generators.rs#L61\" target=\"_blank\">generators.rs:61-220<\/a>).<\/li><li>Their kernels, <code>SOLID<\/code> to <code>MANDELBROT<\/code> (<a href=\"../../src/engine/kernels.rs#L738\" target=\"_blank\">kernels.rs:738-976<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/engine.rs::gpu_matches_cpu<\/code> (renders every generator; skipped without a GPU).<\/p>"}, "quotes_html": ["The initial generators are: solid color, linear gradient, radial gradient, checkerboard, noise (fBm, turbulence, ridged), Voronoi and Mandelbrot."]}, {"id": "N6", "title": "AI image generation (planned)", "anchor": "n6", "file": "03-operators.md", "line": 347, "area": "3 · Operators, splits, generators and sizes", "kind": "clause", "status": "Deferred", "quotes": ["An AI image-generation operator is planned."], "sections": {"Status": "Deferred. The spec plans it; nothing implements it.", "Implemented by": "Nothing. The expensive-result `Cache` used by background removal is the README's intended hook ([cache.rs:12-15](../../src/engine/cache.rs#L12))."}, "citations": [{"entry": "N6", "section": "Implemented by", "path": "src/engine/cache.rs", "start": 12, "end": 15, "md": "03-operators.md:353"}], "tests": [], "links": [], "sections_html": {"Status": "<p>Deferred. The spec plans it; nothing implements it.<\/p>", "Implemented by": "<p>Nothing. The expensive-result <code>Cache<\/code> used by background removal is the README's intended hook (<a href=\"../../src/engine/cache.rs#L12\" target=\"_blank\">cache.rs:12-15<\/a>).<\/p>"}, "quotes_html": ["An AI image-generation operator is planned."]}, {"id": "Z1", "title": "Ask which size to use, insert a Resize", "anchor": "z1", "file": "03-operators.md", "line": 355, "area": "3 · Operators, splits, generators and sizes", "kind": "clause", "status": "Implemented", "quotes": ["However, the outputs produced by imported images and by combining operators will have a definite size.", "In this case, Delos should ask which output size must be used and insert a resizing node after one of the inputs as appropriate."], "sections": {"Status": "Implemented. A third answer, \"Keep both sizes (align top-left)\", is not in the spec.", "Implemented by": "- `Graph::size_conflict` finds two definite input sizes that differ on a node with `combines_inputs` ([graph.rs:347-363](../../src/graph.rs#L347)).\n- `after_edit` looks for a conflict after every edit ([state.rs:304-313](../../src/ui/state.rs#L304)).\n- `ConflictDialog` asks and calls `insert_resize` on the other input ([dialogs.rs:11-57](../../src/ui/dialogs.rs#L11)); `insert_resize` adds a `Resize` set by `resize_to` ([graph.rs:367-375](../../src/graph.rs#L367)).", "Tests": "`tests/engine.rs::size_inference_and_conflicts`.", "Notes": "The third answer calls `ignore_conflict` ([dialogs.rs:58](../../src/ui/dialogs.rs#L58), [state.rs:315-319](../../src/ui/state.rs#L315)), and `after_edit` then skips ignored conflicts. The two resize buttons call `edit`, whose `after_edit` records the next conflict, and then `conflict.set(None)` erases it ([dialogs.rs:42-55](../../src/ui/dialogs.rs#L42)). A second conflict elsewhere in the graph is therefore not shown until the next edit ([D-CONFLICT](findings.md#d-conflict))."}, "citations": [{"entry": "Z1", "section": "Implemented by", "path": "src/graph.rs", "start": 347, "end": 363, "md": "03-operators.md:363"}, {"entry": "Z1", "section": "Implemented by", "path": "src/ui/state.rs", "start": 304, "end": 313, "md": "03-operators.md:364"}, {"entry": "Z1", "section": "Implemented by", "path": "src/ui/dialogs.rs", "start": 11, "end": 57, "md": "03-operators.md:365"}, {"entry": "Z1", "section": "Implemented by", "path": "src/graph.rs", "start": 367, "end": 375, "md": "03-operators.md:365"}, {"entry": "Z1", "section": "Notes", "path": "src/ui/dialogs.rs", "start": 58, "end": 58, "md": "03-operators.md:369"}, {"entry": "Z1", "section": "Notes", "path": "src/ui/state.rs", "start": 315, "end": 319, "md": "03-operators.md:369"}, {"entry": "Z1", "section": "Notes", "path": "src/ui/dialogs.rs", "start": 42, "end": 55, "md": "03-operators.md:369"}], "tests": ["tests/engine.rs::size_inference_and_conflicts"], "links": ["findings.md#d-conflict"], "sections_html": {"Status": "<p>Implemented. A third answer, \"Keep both sizes (align top-left)\", is not in the spec.<\/p>", "Implemented by": "<ul><li><code>Graph::size_conflict<\/code> finds two definite input sizes that differ on a node with <code>combines_inputs<\/code> (<a href=\"../../src/graph.rs#L347\" target=\"_blank\">graph.rs:347-363<\/a>).<\/li><li><code>after_edit<\/code> looks for a conflict after every edit (<a href=\"../../src/ui/state.rs#L304\" target=\"_blank\">state.rs:304-313<\/a>).<\/li><li><code>ConflictDialog<\/code> asks and calls <code>insert_resize<\/code> on the other input (<a href=\"../../src/ui/dialogs.rs#L11\" target=\"_blank\">dialogs.rs:11-57<\/a>); <code>insert_resize<\/code> adds a <code>Resize<\/code> set by <code>resize_to<\/code> (<a href=\"../../src/graph.rs#L367\" target=\"_blank\">graph.rs:367-375<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/engine.rs::size_inference_and_conflicts<\/code>.<\/p>", "Notes": "<p>The third answer calls <code>ignore_conflict<\/code> (<a href=\"../../src/ui/dialogs.rs#L58\" target=\"_blank\">dialogs.rs:58<\/a>, <a href=\"../../src/ui/state.rs#L315\" target=\"_blank\">state.rs:315-319<\/a>), and <code>after_edit<\/code> then skips ignored conflicts. The two resize buttons call <code>edit<\/code>, whose <code>after_edit<\/code> records the next conflict, and then <code>conflict.set(None)<\/code> erases it (<a href=\"../../src/ui/dialogs.rs#L42\" target=\"_blank\">dialogs.rs:42-55<\/a>). A second conflict elsewhere in the graph is therefore not shown until the next edit (<a href=\"#\" data-goto=\"d-conflict\">D-CONFLICT<\/a>).<\/p>"}, "quotes_html": ["However, the outputs produced by imported images and by combining operators will have a definite size.", "In this case, Delos should ask which output size must be used and insert a resizing node after one of the inputs as appropriate."]}, {"id": "P1", "title": "Two ways of working; quick mode", "anchor": "p1", "file": "04-sessions-and-projects.md", "line": 8, "area": "4 · Sessions and projects", "kind": "clause", "status": "Implemented", "quotes": ["Delos supports two ways of working:", "Quick mode is for one-off edits and quick work.", "Imported images are used where they are and nothing is saved."], "sections": {"Status": "Implemented.", "Implemented by": "- `Session` is `Fresh`, `Quick` or `Project` ([session.rs:14-24](../../src/ui/session.rs#L14)).\n- In quick mode, `start_imports` sets `keep_bytes` to false, so nothing is copied ([session.rs:277](../../src/ui/session.rs#L277)); `Worker::import` decodes the image from its path or bytes and keeps that path as its `origin` ([worker.rs:250-256](../../src/worker.rs#L250), [worker.rs:266-269](../../src/worker.rs#L266)).\n- `use_autosave` saves only a `Session::Project` ([session.rs:255](../../src/ui/session.rs#L255), [session.rs:263-265](../../src/ui/session.rs#L263)).", "Tests": "`tests/project_e2e.rs::quick_mode_imports_without_copying`."}, "citations": [{"entry": "P1", "section": "Implemented by", "path": "src/ui/session.rs", "start": 14, "end": 24, "md": "04-sessions-and-projects.md:17"}, {"entry": "P1", "section": "Implemented by", "path": "src/ui/session.rs", "start": 277, "end": 277, "md": "04-sessions-and-projects.md:18"}, {"entry": "P1", "section": "Implemented by", "path": "src/worker.rs", "start": 250, "end": 256, "md": "04-sessions-and-projects.md:18"}, {"entry": "P1", "section": "Implemented by", "path": "src/worker.rs", "start": 266, "end": 269, "md": "04-sessions-and-projects.md:18"}, {"entry": "P1", "section": "Implemented by", "path": "src/ui/session.rs", "start": 255, "end": 255, "md": "04-sessions-and-projects.md:19"}, {"entry": "P1", "section": "Implemented by", "path": "src/ui/session.rs", "start": 263, "end": 265, "md": "04-sessions-and-projects.md:19"}], "tests": ["tests/project_e2e.rs::quick_mode_imports_without_copying"], "links": [], "sections_html": {"Status": "<p>Implemented.<\/p>", "Implemented by": "<ul><li><code>Session<\/code> is <code>Fresh<\/code>, <code>Quick<\/code> or <code>Project<\/code> (<a href=\"../../src/ui/session.rs#L14\" target=\"_blank\">session.rs:14-24<\/a>).<\/li><li>In quick mode, <code>start_imports<\/code> sets <code>keep_bytes<\/code> to false, so nothing is copied (<a href=\"../../src/ui/session.rs#L277\" target=\"_blank\">session.rs:277<\/a>); <code>Worker::import<\/code> decodes the image from its path or bytes and keeps that path as its <code>origin<\/code> (<a href=\"../../src/worker.rs#L250\" target=\"_blank\">worker.rs:250-256<\/a>, <a href=\"../../src/worker.rs#L266\" target=\"_blank\">worker.rs:266-269<\/a>).<\/li><li><code>use_autosave<\/code> saves only a <code>Session::Project<\/code> (<a href=\"../../src/ui/session.rs#L255\" target=\"_blank\">session.rs:255<\/a>, <a href=\"../../src/ui/session.rs#L263\" target=\"_blank\">session.rs:263-265<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/project_e2e.rs::quick_mode_imports_without_copying<\/code>.<\/p>"}, "quotes_html": ["Delos supports two ways of working:", "Quick mode is for one-off edits and quick work.", "Imported images are used where they are and nothing is saved."]}, {"id": "P2", "title": "Project mode", "anchor": "p2", "file": "04-sessions-and-projects.md", "line": 23, "area": "4 · Sessions and projects", "kind": "clause", "status": "Implemented", "quotes": ["Project mode is for longer-term work, and for sharing and collaborating with others."], "sections": {"Status": "Implemented, as far as a purpose statement can be: projects persist, reopen and can be shared as archives. There is no collaboration beyond exchanging archives (no merging, no concurrent editing); the spec does not ask for more.", "Implemented by": "- `Project` is a directory ([project.rs:33-36](../../src/project.rs#L33)); see [P8](#p8) to [P15](#p15).", "Tests": "`tests/project_e2e.rs::edits_are_autosaved_and_reopen_identically`, `tests/project_e2e.rs::share_and_import_a_project`."}, "citations": [{"entry": "P2", "section": "Implemented by", "path": "src/project.rs", "start": 33, "end": 36, "md": "04-sessions-and-projects.md:30"}], "tests": ["tests/project_e2e.rs::edits_are_autosaved_and_reopen_identically", "tests/project_e2e.rs::share_and_import_a_project"], "links": ["04-sessions-and-projects.md#p8", "04-sessions-and-projects.md#p15"], "sections_html": {"Status": "<p>Implemented, as far as a purpose statement can be: projects persist, reopen and can be shared as archives. There is no collaboration beyond exchanging archives (no merging, no concurrent editing); the spec does not ask for more.<\/p>", "Implemented by": "<ul><li><code>Project<\/code> is a directory (<a href=\"../../src/project.rs#L33\" target=\"_blank\">project.rs:33-36<\/a>); see <a href=\"#\" data-goto=\"p8\">P8<\/a> to <a href=\"#\" data-goto=\"p15\">P15<\/a>.<\/li><\/ul>", "Tests": "<p><code>tests/project_e2e.rs::edits_are_autosaved_and_reopen_identically<\/code>, <code>tests/project_e2e.rs::share_and_import_a_project<\/code>.<\/p>"}, "quotes_html": ["Project mode is for longer-term work, and for sharing and collaborating with others."]}, {"id": "P3", "title": "First import asks whether to start a project", "anchor": "p3", "file": "04-sessions-and-projects.md", "line": 34, "area": "4 · Sessions and projects", "kind": "clause", "status": "Implemented", "quotes": ["When the user imports an image and neither a project nor a quick-mode session is open, Delos asks whether to create a project."], "sections": {"Status": "Implemented on desktop and mobile. On the web, where projects are not supported, the first import starts quick mode without asking (as [X2](#x2) expects).", "Implemented by": "- `session::import` opens a `ProjectPrompt` holding the pending imports when the session is `Fresh` and `PROJECTS_SUPPORTED` ([session.rs:105-115](../../src/ui/session.rs#L105)); `PROJECTS_SUPPORTED` is the `native` feature ([session.rs:86-87](../../src/ui/session.rs#L86)).\n- `ProjectDialog` titles it \"Start a project?\" when imports are pending (`from_import`) and offers \"Quick mode\" and \"Create project\" ([dialogs.rs:210](../../src/ui/dialogs.rs#L210), [dialogs.rs:221](../../src/ui/dialogs.rs#L221), [dialogs.rs:281-288](../../src/ui/dialogs.rs#L281), [dialogs.rs:292-302](../../src/ui/dialogs.rs#L292)).", "Tests": "`tests/project_e2e.rs::first_import_asks_and_creates_a_project`, `tests/project_e2e.rs::cancelling_the_prompt_imports_nothing`.", "Notes": "Cancelling the prompt (× or Escape) drops the pending imports and stays `Fresh`."}, "citations": [{"entry": "P3", "section": "Implemented by", "path": "src/ui/session.rs", "start": 105, "end": 115, "md": "04-sessions-and-projects.md:41"}, {"entry": "P3", "section": "Implemented by", "path": "src/ui/session.rs", "start": 86, "end": 87, "md": "04-sessions-and-projects.md:41"}, {"entry": "P3", "section": "Implemented by", "path": "src/ui/dialogs.rs", "start": 210, "end": 210, "md": "04-sessions-and-projects.md:42"}, {"entry": "P3", "section": "Implemented by", "path": "src/ui/dialogs.rs", "start": 221, "end": 221, "md": "04-sessions-and-projects.md:42"}, {"entry": "P3", "section": "Implemented by", "path": "src/ui/dialogs.rs", "start": 281, "end": 288, "md": "04-sessions-and-projects.md:42"}, {"entry": "P3", "section": "Implemented by", "path": "src/ui/dialogs.rs", "start": 292, "end": 302, "md": "04-sessions-and-projects.md:42"}], "tests": ["tests/project_e2e.rs::first_import_asks_and_creates_a_project", "tests/project_e2e.rs::cancelling_the_prompt_imports_nothing"], "links": ["04-sessions-and-projects.md#x2"], "sections_html": {"Status": "<p>Implemented on desktop and mobile. On the web, where projects are not supported, the first import starts quick mode without asking (as <a href=\"#\" data-goto=\"x2\">X2<\/a> expects).<\/p>", "Implemented by": "<ul><li><code>session::import<\/code> opens a <code>ProjectPrompt<\/code> holding the pending imports when the session is <code>Fresh<\/code> and <code>PROJECTS_SUPPORTED<\/code> (<a href=\"../../src/ui/session.rs#L105\" target=\"_blank\">session.rs:105-115<\/a>); <code>PROJECTS_SUPPORTED<\/code> is the <code>native<\/code> feature (<a href=\"../../src/ui/session.rs#L86\" target=\"_blank\">session.rs:86-87<\/a>).<\/li><li><code>ProjectDialog<\/code> titles it \"Start a project?\" when imports are pending (<code>from_import<\/code>) and offers \"Quick mode\" and \"Create project\" (<a href=\"../../src/ui/dialogs.rs#L210\" target=\"_blank\">dialogs.rs:210<\/a>, <a href=\"../../src/ui/dialogs.rs#L221\" target=\"_blank\">dialogs.rs:221<\/a>, <a href=\"../../src/ui/dialogs.rs#L281\" target=\"_blank\">dialogs.rs:281-288<\/a>, <a href=\"../../src/ui/dialogs.rs#L292\" target=\"_blank\">dialogs.rs:292-302<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/project_e2e.rs::first_import_asks_and_creates_a_project<\/code>, <code>tests/project_e2e.rs::cancelling_the_prompt_imports_nothing<\/code>.<\/p>", "Notes": "<p>Cancelling the prompt (× or Escape) drops the pending imports and stays <code>Fresh<\/code>.<\/p>"}, "quotes_html": ["When the user imports an image and neither a project nor a quick-mode session is open, Delos asks whether to create a project."]}, {"id": "P3.1", "title": "The question mentions the storage cost", "anchor": "p3-1", "file": "04-sessions-and-projects.md", "line": 48, "area": "4 · Sessions and projects", "kind": "clause", "status": "Implemented", "quotes": ["The question makes clear that projects copy every imported image, so they take more storage."], "sections": {"Status": "Implemented.", "Implemented by": "- The dialog text: every image is `copied` into `inputs/`, \"so projects take more disk space than the original files\" ([dialogs.rs:231-238](../../src/ui/dialogs.rs#L231)).", "Tests": "None (UI text)."}, "citations": [{"entry": "P3.1", "section": "Implemented by", "path": "src/ n::Quick<\/code> and runs the pending imports (<a href=\"../../src/ui/session.rs#L123\" target=\"_blank\">session.rs:123-131<\/a>); <code>import<\/code> asks only while <code>Fresh<\/code> and otherwise goes straight to <code>start_imports<\/code> (<a href=\"../../src/ui/session.rs#L105\" target=\"_blank\">session.rs:105<\/a>, <a href=\"../../src/ui/session.rs#L119\" target=\"_blank\">session.rs:119<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/project_e2e.rs::quick_mode_imports_without_copying<\/code>.<\/p>"}, "quotes_html": ["If the user declines, a quick-mode session starts and later imports are added to it without asking again."]}, {"id": "P3.3", "title": "Accepting creates a named project in the default location", "anchor": "p3-3", "file": "04-sessions-and-projects.md", "line": 70, "area": "4 · Sessions and projects", "kind": "clause", "status": "Implemented", "quotes": ["If the user accepts, a project is created (named by the user; by default in `~/.delos/projects/<name>`, overridable with `DELOS_PROJECTS_DIR`) and the image is added to it."], "sections": {"Status": "Implemented.", "Implemented by": "- `default_root` reads `DELOS_PROJECTS_DIR`, else `~/.delos/projects` ([project.rs:38-45](../../src/project.rs#L38)); the prompt's name defaults to the image's file `stem` and its folder to `projects_root` ([session.rs:107-112](../../src/ui/session.rs#L107)); the user edits the name through `set_prompt_name` ([session.rs:140-143](../../src/ui/session.rs#L140)).\n- `create_project` joins the name to the chosen folder and asks `Worker::create_project` to run `Project::create`, which makes the folder ([session.rs:156](../../src/ui/session.rs#L156), [session.rs:164](../../src/ui/session.rs#L164), [worker.rs:326-333](../../src/worker.rs#L326), [project.rs:73-76](../../src/project.rs#L73)).\n- `pump` hands `Msg::ProjectCreated` to `on_project_created` ([mod.rs:221](../../src/ui/mod.rs#L221)), which switches to `Session::Project` and starts the pending imports (`start_im
