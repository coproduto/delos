e2e.rs", "start": 39, "end": 77, "md": "06-quality.md:29"}], "tests": ["tests/project.rs::create_makes_the_project_layout", "tests/project_e2e.rs::first_import_asks_and_creates_a_project"], "links": ["04-sessions-and-projects.md#p3-1", "04-sessions-and-projects.md#p6-1", "04-sessions-and-projects.md#p7", "04-sessions-and-projects.md#p13-3", "04-sessions-and-projects.md#x1", "04-sessions-and-projects.md#x2"], "sections_html": {"Status": "<p>Process. Both suites exist. Every project clause in <a href=\"#\" data-goto=\"\">04-sessions-and-projects.md<\/a> except <a href=\"#\" data-goto=\"p3-1\">P3.1<\/a>, <a href=\"#\" data-goto=\"p6-1\">P6.1<\/a>, <a href=\"#\" data-goto=\"p7\">P7<\/a>, <a href=\"#\" data-goto=\"p13-3\">P13.3<\/a>, <a href=\"#\" data-goto=\"x1\">X1<\/a> and <a href=\"#\" data-goto=\"x2\">X2<\/a> cites at least one test.<\/p>", "Implemented by": "<ul><li><code>use_services<\/code> builds the same <code>App<\/code>, <code>Worker<\/code>, message <code>pump<\/code> and <code>use_autosave<\/code> for the window and for tests (<a href=\"../../src/ui/mod.rs#L44\" target=\"_blank\">mod.rs:44-46<\/a>, <a href=\"../../src/ui/mod.rs#L49\" target=\"_blank\">mod.rs:49-54<\/a>); session actions are plain functions of <code>App<\/code> so tests call what buttons call (<code>session.rs<\/code> header) (<a href=\"../../src/ui/session.rs#L4\" target=\"_blank\">session.rs:4-6<\/a>).<\/li><li>The harness <code>Delos::start<\/code> runs a headless <code>VirtualDom<\/code> and drives it with <code>run<\/code> and <code>until<\/code> (<a href=\"../../tests/project_e2e.rs#L39\" target=\"_blank\">project_e2e.rs:39-77<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/project.rs::create_makes_the_project_layout<\/code> (and the rest of <code>tests/project.rs<\/code>), <code>tests/project_e2e.rs::first_import_asks_and_creates_a_project<\/code> (and the rest of <code>tests/project_e2e.rs<\/code>).<\/p>"}, "quotes_html": ["Project features must be covered by unit tests and by end-to-end tests.", "The end-to-end tests run the application's real state, background worker and autosave without a window, and drive them as the user interface does."]}, {"id": "Q3", "title": "16K performance tests", "anchor": "q3", "file": "06-quality.md", "line": 33, "area": "6 · Quality requirements", "kind": "clause", "status": "Process", "quotes": ["Performance at 16K resolution is tested: previews must stay interactive, and exports must run in bounded memory."], "sections": {"Status": "Process. The tests exist and assert time budgets on both backends. Bounded export memory is asserted only for the band size of a generator export, and only PNG is exported at 16K; the formats that buffer the whole image are not tested ([D-EXPORT-MEMORY](findings.md#d-export-memory)).", "Implemented by": "- `build_graph` makes a 16384² image through invert, reflect, an overlay blend with noise and a stack with a gradient ([large_images.rs:60-69](../../tests/large_images.rs#L60), [large_images.rs:82-102](../../tests/large_images.rs#L82)).\n- Previews of 1080² and 1920×1080 must take under 400 ms each (`budget`) ([large_images.rs:106-140](../../tests/large_images.rs#L106)); the band `peak` is asserted in `export_16k_streams_in_bands` ([large_images.rs:183-195](../../tests/large_images.rs#L183)).", "Tests": "`tests/large_images.rs::preview_16k_is_interactive`, `tests/large_images.rs::export_16k_png`, `tests/large_images.rs::export_16k_streams_in_bands`.", "Notes": "`export_16k_png` is ignored in debug builds; run the suite with `--release`."}, "citations": [{"entry": "Q3", "section": "Implemented by", "path": "tests/large_images.rs", "start": 60, "end": 69, "md": "06-quality.md:40"}, {"entry": "Q3", "section": "Implemented by", "path": "tests/large_images.rs", "start": 82, "end": 102, "md": "06-quality.md:40"}, {"entry": "Q3", "section": "Implemented by", "path": "tests/large_images.rs", "start": 106, "end": 140, "md": "06-quality.md:41"}, {"entry": "Q3", "section": "Implemented by", "path": "tests/large_images.rs", "start": 183, "end": 195, "md": "06-quality.md:41"}], "tests": ["tests/large_images.rs::preview_16k_is_interactive", "tests/large_images.rs::export_16k_png", "tests/large_images.rs::export_16k_streams_in_bands"], "links": ["findings.md#d-export-memory"], "sections_html": {"Status": "<p>Process. The tests exist and assert time budgets on both backends. Bounded export memory is asserted only for the band size of a generator export, and only PNG is exported at 16K; the formats that buffer the whole image are not tested (<a href=\"#\" data-goto=\"d-export-memory\">D-EXPORT-MEMORY<\/a>).<\/p>", "Implemented by": "<ul><li><code>build_graph<\/code> makes a 16384² image through invert, reflect, an overlay blend with noise and a stack with a gradient (<a href=\"../../tests/large_images.rs#L60\" target=\"_blank\">large_images.rs:60-69<\/a>, <a href=\"../../tests/large_images.rs#L82\" target=\"_blank\">large_images.rs:82-102<\/a>).<\/li><li>Previews of 1080² and 1920×1080 must take under 400 ms each (<code>budget<\/code>) (<a href=\"../../tests/large_images.rs#L106\" target=\"_blank\">large_images.rs:106-140<\/a>); the band <code>peak<\/code> is asserted in <code>export_16k_streams_in_bands<\/code> (<a href=\"../../tests/large_images.rs#L183\" target=\"_blank\">large_images.rs:183-195<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/large_images.rs::preview_16k_is_interactive<\/code>, <code>tests/large_images.rs::export_16k_png<\/code>, <code>tests/large_images.rs::export_16k_streams_in_bands<\/code>.<\/p>", "Notes": "<p><code>export_16k_png<\/code> is ignored in debug builds; run the suite with <code>--release<\/code>.<\/p>"}, "quotes_html": ["Performance at 16K resolution is tested: previews must stay interactive, and exports must run in bounded memory."]}, {"id": "D-ADD-AFTER-SPLIT", "title": "Add node after a split rewires the second output", "anchor": "d-add-after-split", "file": "findings.md", "line": 41, "area": "Findings: where the code and the spec disagree", "kind": "note", "status": "", "quotes": [], "sections": {"Kind": "Defect. Confirmed by the probe `add_node_after_a_split_keeps_each_consumer_on_its_output` of the invariants model (its finding 2).", "Clauses": "[S5](03-operators.md#s5): \"the inputs of other nodes … can each refer to a specific output of a split\".", "Observed": "With a split selected, \"Add node\" moves *every* `consumers` of the split, from both outputs, onto the new node, and feeds the new node the split's output 0 ([state.rs:470-476](../../src/ui/state.rs#L470)). A node that read `split.right` now reads an effect applied to `split.left`.", "Consequence": "The localised-effect pattern the spec motivates splits with (split, effect on one side, stack) quietly breaks: both layers show the same half. Undo restores it.", "Decision": "Which output should \"Add node after this split\" attach to: output 0, the output being viewed, or one the user picks? Or should it be refused for nodes with several outputs? A regression test should come with the fix ([Q1](06-quality.md#q1))."}, "citations": [{"entry": "D-ADD-AFTER-SPLIT", "section": "Observed", "path": "src/ui/state.rs", "start": 470, "end": 476, "md": "findings.md:47"}], "tests": [], "links": ["03-operators.md#s5", "06-quality.md#q1"], "sections_html": {"Kind": "<p>Defect. Confirmed by the probe <code>add_node_after_a_split_keeps_each_consumer_on_its_output<\/code> of the invariants model (its finding 2).<\/p>", "Clauses": "<p><a href=\"#\" data-goto=\"s5\">S5<\/a>: \"the inputs of other nodes … can each refer to a specific output of a split\".<\/p>", "Observed": "<p>With a split selected, \"Add node\" moves *every* <code>consumers<\/code> of the split, from both outputs, onto the new node, and feeds the new node the split's output 0 (<a href=\"../../src/ui/state.rs#L470\" target=\"_blank\">state.rs:470-476<\/a>). A node that read <code>split.right<\/code> now reads an effect applied to <code>split.left<\/code>.<\/p>", "Consequence": "<p>The localised-effect pattern the spec motivates splits with (split, effect on one side, stack) quietly breaks: both layers show the same half. Undo restores it.<\/p>", "Decision": "<p>Which output should \"Add node after this split\" attach to: output 0, the output being viewed, or one the user picks? Or should it be refused for nodes with several outputs? A regression test should come with the fix (<a href=\"#\" data-goto=\"q1\">Q1<\/a>).<\/p>"}, "quotes_html": []}, {"id": "D-STALE", "title": "Stale image after undo or a new document", "anchor": "d-stale", "file": "findings.md", "line": 53, "area": "Findings: where the code and the spec disagree", "kind": "note", "status": "", "quotes": [], "sections": {"Kind": "Defect. Confirmed by the probe `structural_hash_distinguishes_images_after_undo` of the invariants model (its finding 1).", "Clauses": "[F2.1](02-editing-and-views.md#f2-1) (the view shows what goes to the output), [O5](03-operators.md#o5) (background removal).", "Observed": "A static image is identified in the structural hash by a graph-local id from `fresh_id` ([graph.rs:109-113](../../src/graph.rs#L109)); undo and `Graph::new` reuse ids. The preview `key` is that hash ([image_view.rs:107-120](../../src/ui/image_view.rs#L107)), and the background-removal mask cache key builds on it (`link_hash`) ([bgremove.rs:66-70](../../src/nodes/bgremove.rs#L66)).", "Consequence, derived from the code": "Import A, undo, import B of the same size: no render is requested and the view keeps showing A. A background-removal node then masks B with A's cutout until the cache entry is evicted.", "Decision": "None about the spec, which is clear; this is a fix. The invariants model proposes hashing the process-unique `SourceImage::id` instead."}, "citations": [{"entry": "D-STALE", "section": "Observed", "path": "src/graph.rs", "start": 109, "end": 113, "md": "findings.md:59"}, {"entry": "D-STALE", "section": "Observed", "path": "src/ui/image_view.rs", "start": 107, "end": 120, "md": "findings.md:59"}, {"entry": "D-STALE", "section": "Observed", "path": "src/nodes/bgremove.rs", "start": 66, "end": 70, "md": "findings.md:59"}], "tests": [], "links": ["02-editing-and-views.md#f2-1", "03-operators.md#o5"], "sections_html": {"Kind": "<p>Defect. Confirmed by the probe <code>structural_hash_distinguishes_images_after_undo<\/code> of the invariants model (its finding 1).<\/p>", "Clauses": "<p><a href=\"#\" data-goto=\"f2-1\">F2.1<\/a> (the view shows what goes to the output), <a href=\"#\" data-goto=\"o5\">O5<\/a> (background removal).<\/p>", "Observed": "<p>A static image is identified in the structural hash by a graph-local id from <code>fresh_id<\/code> (<a href=\"../../src/graph.rs#L109\" target=\"_blank\">graph.rs:109-113<\/a>); undo and <code>Graph::new<\/code> reuse ids. The preview <code>key<\/code> is that hash (<a href=\"../../src/ui/image_view.rs#L107\" target=\"_blank\">image_view.rs:107-120<\/a>), and the background-removal mask cache key builds on it (<code>link_hash<\/code>) (<a href=\"../../src/nodes/bgremove.rs#L66\" target=\"_blank\">bgremove.rs:66-70<\/a>).<\/p>", "Consequence, derived from the code": "<p>Import A, undo, import B of the same size: no render is requested and the view keeps showing A. A background-removal node then masks B with A's cutout until the cache entry is evicted.<\/p>", "Decision": "<p>None about the spec, which is clear; this is a fix. The invariants model proposes hashing the process-unique <code>SourceImage::id<\/code> instead.<\/p>"}, "quotes_html": []}, {"id": "D-IMPORT-LEFTOVER", "title": "A failed project import can leave a folder behind", "anchor": "d-import-leftover", "file": "findings.md", "line": 65, "area": "Findings: where the code and the spec disagree", "kind": "note", "status": "", "quotes": [], "sections": {"Kind": "Defect. Found by the independent review. **Confirmed.** Probe `failed_import_leaves_nothing_behind` ([probes/spec_probes.rs](probes/spec_probes.rs)): the import fails and leaves `future/` in the projects folder.", "Clauses": "[P15](04-sessions-and-projects.md#p15): \"A failed import leaves nothing behind.\"", "Observed": "`unpack` deletes the destination only when extraction or `verify` fails ([project.rs:360-362](../../src/project.rs#L360)). `open` then calls `load`, which decodes the images and builds the graph, and returns its error without cleaning up ([project.rs:289-301](../../src/project.rs#L289)). An archive with a well-formed structure but an image that does not decode, or a node kind this version does not know, fails to open and leaves its unpacked copy in the projects folder.", "Decision": "None about the spec; this is a fix (move the `load` inside `unpack`'s cleanup, or clean up in `open`). A regression test should build such an archive, as `import_rejects_invalid_archives_and_cleans_up` does for invalid ones."}, "citations": [{"entry": "D-IMPORT-LEFTOVER", "section": "Observed", "path": "src/project.rs", "start": 360, "end": 362, "md": "findings.md:71"}, {"entry": "D-IMPORT-LEFTOVER", "section": "Observed", "path": "src/project.rs", "start": 289, "end": 301, "md": "findings.md:71"}], "tests": [], "links": ["04-sessions-and-projects.md#p15"], "sections_html": {"Kind": "<p>Defect. Found by the independent review. <b>Confirmed.<\/b> Probe <code>failed_import_leaves_nothing_behind<\/code> (<a href=\"probes/spec_probes.rs\" target=\"_blank\">probes/spec_probes.rs<\/a>): the import fails and leaves <code>future/<\/code> in the projects folder.<\/p>", "Clauses": "<p><a href=\"#\" data-goto=\"p15\">P15<\/a>: \"A failed import leaves nothing behind.\"<\/p>", "Observed": "<p><code>unpack<\/code> deletes the destination only when extraction or <code>verify<\/code> fails (<a href=\"../../src/project.rs#L360\" target=\"_blank\">project.rs:360-362<\/a>). <code>open<\/code> then calls <code>load<\/code>, which decodes the images and builds the graph, and returns its error without cleaning up (<a href=\"../../src/project.rs#L289\" target=\"_blank\">project.rs:289-301<\/a>). An archive with a well-formed structure but an image that does not decode, or a node kind this version does not know, fails to open and leaves its unpacked copy in the projects folder.<\/p>", "Decision": "<p>None about the spec; this is a fix (move the <code>load<\/code> inside <code>unpack<\/code>'s cleanup, or clean up in <code>open<\/code>). A regression test should build such an archive, as <code>import_rejects_invalid_archives_and_cleans_up<\/code> does for invalid ones.<\/p>"}, "quotes_html": []}, {"id": "D-OPEN-WRITES", "title": "Opening a generator-only project can rewrite it", "anchor": "d-open-writes", "file": "findings.md", "line": 75, "area": "Findings: where the code and the spec disagree", "kind": "note", "status": "", "quotes": [], "sections": {"Kind": "Defect. Found by the independent review. **Confirmed.** Probe `opening_a_generator_project_writes_nothing` ([probes/spec_probes.rs](probes/spec_probes.rs)): after opening, with a 1000×800 image pane, `project.delos` is rewritten with `:canvas_w 920 :canvas_h 736`.", "Clauses": "[P6.2](04-sessions-and-projects.md#p6-2): \"Opening a project does not change anything on disk until the user edits it.\"", "Observed": "`replace_document` resets `canvas_user_set` ([state.rs:257](../../src/ui/state.rs#L257)). When the shown content is size-less, the image view calls `fit_canvas_to_window(false)` ([image_view.rs:69-76](../../src/ui/image_view.rs#L69)), which writes `canvas_w` and `canvas_h` to the graph if they differ from 92% of the viewport ([state.rs:323-344](../../src/ui/state.rs#L323)). That write triggers `use_autosave`. The end-to-end test runs without a viewport, so it cannot see this.", "Decision": "Should a saved canvas size be respected on open (set `canvas_user_set` when the loaded canvas is not the default), or is re-fitting to the window wanted? The spec's sentence says the former."}, "citations": [{"entry": "D-OPEN-WRITES", "section": "Observed", "path": "src/ui/state.rs", "start": 257, "end": 257, "md": "findings.md:81"}, {"entry": "D-OPEN-WRITES", "section": "Observed", "path": "src/ui/image_view.rs", "start": 69, "end": 76, "md": "findings.md:81"}, {"entry": "D-OPEN-WRITES", "section": "Observed", "path": "src/ui/state.rs", "start": 323, "end": 344, "md": "findings.md:81"}], "tests": [], "links": ["04-sessions-and-projects.md#p6-2"], "sections_html": {"Kind": "<p>Defect. Found by the independent review. <b>Confirmed.<\/b> Probe <code>opening_a_generator_project_writes_nothing<\/code> (<a href=\"probes/spec_probes.rs\" target=\"_blank\">probes/spec_probes.rs<\/a>): after opening, with a 1000×800 image pane, <code>project.delos<\/code> is rewritten with <code>:canvas_w 920 :canvas_h 736<\/code>.<\/p>", "Clauses": "<p><a href=\"#\" data-goto=\"p6-2\">P6.2<\/a>: \"Opening a project does not change anything on disk until the user edits it.\"<\/p>", "Observed": "<p><code>replace_document<\/code> resets <code>canvas_user_set<\/code> (<a href=\"../../src/ui/state.rs#L257\" target=\"_blank\">state.rs:257<\/a>). When the shown content is size-less, the image view calls <code>fit_canvas_to_window(false)<\/code> (<a href=\"../../src/ui/image_view.rs#L69\" target=\"_blank\">image_view.rs:69-76<\/a>), which writes <code>canvas_w<\/code> and <code>canvas_h<\/code> to the graph if they differ from 92% of the viewport (<a href=\"../../src/ui/state.rs#L323\" target=\"_blank\">state.rs:323-344<\/a>). That write triggers <code>use_autosave<\/code>. The end-to-end test runs without a viewport, so it cannot see this.<\/p>", "Decision": "<p>Should a saved canvas size be respected on open (set <code>canvas_user_set<\/code> when the loaded canvas is not the default), or is re-fitting to the window wanted? The spec's sentence says the former.<\/p>"}, "quotes_html": []}, {"id": "D-CONFLICT", "title": "The size-conflict dialog hides the next conflict", "anchor": "d-conflict", "file": "findings.md", "line": 85, "area": "Findings: where the code and the spec disagree", "kind": "note", "status": "", "quotes": [], "sections": {"Kind": "Defect (small). Derived from the code; not probed, because the logic lives in the dialog's button closures, which no test can call.", "Clauses": "[Z1](03-operators.md#z1).", "Observed": "The two resize buttons call `app.edit`, whose `after_edit` looks for the next conflict and stores it, and then call `app.conflict.set(None)` ([dialogs.rs:42-55](../../src/ui/dialogs.rs#L42)), erasing it. A second mismatch elsewhere in the graph is only reported after another edit.", "Decision": "None; drop the `set(None)` (the edit already recomputes the conflict)."}, "citations": [{"entry": "D-CONFLICT", "section": "Observed", "path": "src/ui/dialogs.rs", "start": 42, "end": 55, "md": "findings.md:91"}], "tests": [], "links": ["03-operators.md#z1"], "sections_html": {"Kind": "<p>Defect (small). Derived from the code; not probed, because the logic lives in the dialog's button closures, which no test can call.<\/p>", "Clauses": "<p><a href=\"#\" data-goto=\"z1\">Z1<\/a>.<\/p>", "Observed": "<p>The two resize buttons call <code>app.edit<\/code>, whose <code>after_edit<\/code> looks for the next conflict and stores it, and then call <code>app.conflict.set(None)<\/code> (<a href=\"../../src/ui/dialogs.rs#L42\" target=\"_blank\">dialogs.rs:42-55<\/a>), erasing it. A second mismatch elsewhere in the graph is only reported after another edit.<\/p>", "Decision": "<p>None; drop the <code>set(None)<\/code> (the edit already recomputes the conflict).<\/p>"}, "quotes_html": []}, {"id": "D-EXPORT-MEMORY", "title": "Export memory is bounded for PNG files only", "anchor": "d-export-memory", "file": "findings.md", "line": 95, "area": "Findings: where the code and the spec disagree", "kind": "note", "status": "", "quotes": [], "sections": {"Kind": "Gap.", "Clauses": "[F4.2](02-editing-and-views.md#f4-2) (\"renders … in bands (to bound memory)\"), [Q3](06-quality.md#q3) (\"exports must run in bounded memory\").", "Observed": "Every format is *rendered* in bands, but only `Png::encode` streams them ([formats.rs:135-149](../../src/formats.rs#L135)). `ImageCrate::encode`, used for JPEG, WebP, GIF, BMP and TIFF, appends every band to `all`, a buffer of the whole image, then encodes into a second in-memory buffer `buf` ([formats.rs:83-110](../../src/formats.rs#L83)). JPEG also builds an RGB copy (`rgb`). Exports to memory, used on the web, hold the whole encoded file even for PNG (`ExportDest::Memory`) ([worker.rs:311-315](../../src/worker.rs#L311)).", "Consequence, derived from the code": "A 16384² JPEG export holds about 1 GiB of RGBA plus 768 MiB of RGB plus the encoded file in memory at once. The 16K tests export PNG only, so nothing catches this.", "Decision": "Either stream the other encoders (JPEG and TIFF can be written in strips) or narrow the spec: \"bounded memory for PNG; other formats need memory proportional to the image\"."}, "citations": [{"entry": "D-EXPORT-MEMORY", "section": "Observed", "path": "src/formats.rs", "start": 135, "end": 149, "md": "findings.md:101"}, {"entry": "D-EXPORT-MEMORY", "section": "Observed", "path": "src/formats.rs", "start": 83, "end": 110, "md": "findings.md:101"}, {"entry": "D-EXPORT-MEMORY", "section": "Observed", "path": "src/worker.rs", "start": 311, "end": 315, "md": "findings.md:101"}], "tests": [], "links": ["02-editing-and-views.md#f4-2", "06-quality.md#q3"], "sections_html": {"Kind": "<p>Gap.<\/p>", "Clauses": "<p><a href=\"#\" data-goto=\"f4-2\">F4.2<\/a> (\"renders … in bands (to bound memory)\"), <a href=\"#\" data-goto=\"q3\">Q3<\/a> (\"exports must run in bounded memory\").<\/p>", "Observed": "<p>Every format is *rendered* in bands, but only <code>Png::encode<\/code> streams them (<a href=\"../../src/formats.rs#L135\" target=\"_blank\">formats.rs:135-149<\/a>). <code>ImageCrate::encode<\/code>, used for JPEG, WebP, GIF, BMP and TIFF, appends every band to <code>all<\/code>, a buffer of the whole image, then encodes into a second in-memory buffer <code>buf<\/code> (<a href=\"../../src/formats.rs#L83\" target=\"_blank\">formats.rs:83-110<\/a>). JPEG also builds an RGB copy (<code>rgb<\/code>). Exports to memory, used on the web, hold the whole encoded file even for PNG (<code>ExportDest::Memory<\/code>) (<a href=\"../../src/worker.rs#L311\" target=\"_blank\">worker.rs:311-315<\/a>).<\/p>", "Consequence, derived from the code": "<p>A 16384² JPEG export holds about 1 GiB of RGBA plus 768 MiB of RGB plus the encoded file in memory at once. The 16K tests export PNG only, so nothing catches this.<\/p>", "Decision": "<p>Either stream the other encoders (JPEG and TIFF can be written in strips) or narrow the spec: \"bounded memory for PNG; other formats need memory proportional to the image\".<\/p>"}, "quotes_html": []}, {"id": "D-QUICK-EXIT", "title": "Quick-mode work can be lost without confirmation", "anchor": "d-quick-exit", "file": "findings.md", "line": 107, "area": "Findings: where the code and the spec disagree", "kind": "note", "status": "", "quotes": [], "sections": {"Kind": "Gap.", "Clauses": "[P7](04-sessions-and-projects.md#p7): \"Leaving a quick-mode session that has work in it asks for confirmation.\"", "Observed": "The menu's End quick session and opening a project ask through `platform::confirm`, which returns `true` without asking outside desktop ([platform.rs:217-236](../../src/ui/platform.rs#L217)); this matters on mobile, since the web has no Project menu. Nothing intercepts closing the window or quitting: `launch` sets no close behaviour ([mod.rs:26-38](../../src/ui/mod.rs#L26)), and no close-request or `beforeunload` handler exists in `src/`.", "Consequence": "On every platform, closing the window discards quick-mode work silently. On the web, where *all* work is quick mode ([X2](04-sessions-and-projects.md#x2)), so does reloading the page.", "Decision": "Does \"leaving\" include quitting? If so, desktop needs a close handler and the web a `beforeunload` prompt. If not, the spec should say \"ending a quick-mode session from the Project menu\"."}, "citations": [{"entry": "D-QUICK-EXIT", "section": "Observed", "path": "src/ui/platform.rs", "start": 217, "end": 236, "md": "findings.md:113"}, {"entry": "D-QUICK-EXIT", "section": "Observed", "path": "src/ui/mod.rs", "start": 26, "end": 38, "md": "findings.md:113"}], "tests": [], "links": ["04-sessions-and-projects.md#p7", "04-sessions-and-projects.md#x2"], "sections_html": {"Kind": "<p>Gap.<\/p>", "Clauses": "<p><a href=\"#\" data-goto=\"p7\">P7<\/a>: \"Leaving a quick-mode session that has work in it asks for confirmation.\"<\/p>", "Observed": "<p>The menu's End quick session and opening a project ask through <code>platform::confirm<\/code>, which returns <code>true<\/code> without asking outside desktop (<a href=\"../../src/ui/platform.rs#L217\" target=\"_blank\">platform.rs:217-236<\/a>); this matters on mobile, since the web has no Project menu. Nothing intercepts closing the window or quitting: <code>launch<\/code> sets no close behaviour (<a href=\"../../src/ui/mod.rs#L26\" target=\"_blank\">mod.rs:26-38<\/a>), and no close-request or <code>beforeunload<\/code> handler exists in <code>src/<\/code>.<\/p>", "Consequence": "<p>On every platform, closing the window discards quick-mode work silently. On the web, where *all* work is quick mode (<a href=\"#\" data-goto=\"x2\">X2<\/a>), so does reloading the page.<\/p>", "Decision": "<p>Does \"leaving\" include quitting? If so, desktop needs a close handler and the web a <code>beforeunload<\/code> prompt. If not, the spec should say \"ending a quick-mode session from the Project menu\".<\/p>"}, "quotes_html": []}, {"id": "D-PLAT", "title": "Platform gaps beyond the accepted ones", "anchor": "d-plat", "file": "findings.md", "line": 119, "area": "Findings: where the code and the spec disagree", "kind": "note", "status": "", "quotes": [], "sections": {"Kind": "Gap.", "Clauses": "[R2](01-product-and-platform.md#r2), [R3](01-product-and-platform.md#r3), [O5](03-operators.md#o5). The spec accepts only the *project* limitations ([X3](04-sessions-and-projects.md#x3)).", "Observed": "- The `web` feature enables neither `gpu` nor `native`, and only `desktop` enables `rembg` ([Cargo.toml:6-13](../../Cargo.toml#L6)). The web build therefore renders on the CPU, single-threaded (background jobs run through `spawn_local`) ([worker.rs:417-425](../../src/worker.rs#L417)), and has no background removal; mobile has GPU but no background removal (the stub `compute_mask`) ([bgremove.rs:169-172](../../src/nodes/bgremove.rs#L169)).\n- The README says the mobile build \"compiles, but it has not been run on a device\". No test covers web or mobile.", "Decision": "Extend the spec's \"accepted for now\" list to these gaps, or schedule them. GPU on the web needs asynchronous readback; threads need cross-origin isolation (README, Known gaps)."}, "citations": [{"entry": "D-PLAT", "section": "Observed", "path": "Cargo.toml", "start": 6, "end": 13, "md": "findings.md:126"}, {"entry": "D-PLAT", "section": "Observed", "path": "src/worker.rs", "start": 417, "end": 425, "md": "findings.md:126"}, {"entry": "D-PLAT", "section": "Observed", "path": "src/nodes/bgremove.rs", "start": 169, "end": 172, "md": "findings.md:126"}], "tests": [], "links": ["01-product-and-platform.md#r2", "01-product-and-platform.md#r3", "03-operators.md#o5", "04-sessions-and-projects.md#x3"], "sections_html": {"Kind": "<p>Gap.<\/p>", "Clauses": "<p><a href=\"#\" data-goto=\"r2\">R2<\/a>, <a href=\"#\" data-goto=\"r3\">R3<\/a>, <a href=\"#\" data-goto=\"o5\">O5<\/a>. The spec accepts only the *project* limitations (<a href=\"#\" data-goto=\"x3\">X3<\/a>).<\/p>", "Observed": "<ul><li>The <code>web<\/code> feature enables neither <code>gpu<\/code> nor <code>native<\/code>, and only <code>desktop<\/code> enables <code>rembg<\/code> (<a href=\"../../Cargo.toml#L6\" target=\"_blank\">Cargo.toml:6-13<\/a>). The web build therefore renders on the CPU, single-threaded (background jobs run through <code>spawn_local<\/code>) (<a href=\"../../src/worker.rs#L417\" target=\"_blank\">worker.rs:417-425<\/a>), and has no background removal; mobile has GPU but no background removal (the stub <code>compute_mask<\/code>) (<a href=\"../../src/nodes/bgremove.rs#L169\" target=\"_blank\">bgremove.rs:169-172<\/a>).<\/li><li>The README says the mobile build \"compiles, but it has not been run on a device\". No test covers web or mobile.<\/li><\/ul>", "Decision": "<p>Extend the spec's \"accepted for now\" list to these gaps, or schedule them. GPU on the web needs asynchronous readback; threads need cross-origin isolation (README, Known gaps).<\/p>"}, "quotes_html": []}, {"id": "D-RESIZE", "title": "Downscaling filters are not what they say", "anchor": "d-resize", "file": "findings.md", "line": 131, "area": "Findings: where the code and the spec disagree", "kind": "note", "status": "", "quotes": [], "sections": {"Kind": "Gap.", "Clauses": "[O8](03-operators.md#o8): \"Allows choosing upscale/downscale algorithm to use.\" Also [O4](03-operators.md#o4), Downscale's \"box\" method.", "Observed": "When the request is at least as coarse as the input, or the input is size-less, `Resize::render` returns the area-filtered input whatever the `filter` says; only \"nearest\" changes the result ([resize.rs:88-98](../../src/nodes/resize.rs#L88)). Bilinear, bicubic and Fourier downscales are identical.\nDownscale's \"box\" method is the source pyramid: for factors below 2, `level_for` returns level 0, sampled nearest, so \"box\" equals \"nearest\"; above 2 it uses a power-of-two level, not a box over the factor; size-less inputs are point-sampled ([source.rs:114-133](../../src/engine/source.rs#L114)).", "Decision": "Keep one downscaler and say so in the spec and the UI, or implement the filters for downscaling. Today the inspector offers four Resize choices where three behave identically, and a Downscale \"box\" that is not a box for small factors."}, "citations": [{"entry": "D-RESIZE", "section": "Observed", "path": "src/nodes/resize.rs", "start": 88, "end": 98, "md": "findings.md:137"}, {"entry": "D-RESIZE", "section": "Observed", "path": "src/engine/source.rs", "start": 114, "end": 133, "md": "findings.md:139"}], "tests": [], "links": ["03-operators.md#o8", "03-operators.md#o4"], "sections_html": {"Kind": "<p>Gap.<\/p>", "Clauses": "<p><a href=\"#\" data-goto=\"o8\">O8<\/a>: \"Allows choosing upscale/downscale algorithm to use.\" Also <a href=\"#\" data-goto=\"o4\">O4<\/a>, Downscale's \"box\" method.<\/p>", "Observed": "<p>When the request is at least as coarse as the input, or the input is size-less, <code>Resize::render<\/code> returns the area-filtered input whatever the <code>filter<\/code> says; only \"nearest\" changes the result (<a href=\"../../src/nodes/resize.rs#L88\" target=\"_blank\">resize.rs:88-98<\/a>). Bilinear, bicubic and Fourier downscales are identical.<\/p><p>Downscale's \"box\" method is the source pyramid: for factors below 2, <code>level_for<\/code> returns level 0, sampled nearest, so \"box\" equals \"nearest\"; above 2 it uses a power-of-two level, not a box over the factor; size-less inputs are point-sampled (<a href=\"../../src/engine/source.rs#L114\" target=\"_blank\">source.rs:114-133<\/a>).<\/p>", "Decision": "<p>Keep one downscaler and say so in the spec and the UI, or implement the filters for downscaling. Today the inspector offers four Resize choices where three behave identically, and a Downscale \"box\" that is not a box for small factors.<\/p>"}, "quotes_html": []}, {"id": "D-OVERLAY", "title": "Overlay mapping: one path, affine maps only", "anchor": "d-overlay", "file": "findings.md", "line": 143, "area": "Findings: where the code and the spec disagree", "kind": "note", "status": "", "quotes": [], "sections": {"Kind": "Gap.", "Clauses": "[F3.3.1](02-editing-and-views.md#f3-3-1): controls \"must be placed correctly even when nodes between the edited node and the shown image move or scale pixels\".", "Observed": "`space_map_rec` returns the *first* path from the shown node to the edited node, trying ports in order ([graph.rs:318-343](../../src/graph.rs#L318)). Maps are separable affine `Map2`s ([geom.rs:95-102](../../src/engine/geom.rs#L95)); `Reflect` keeps the default identity `input_map` although it mirrors pixels.", "Consequence, derived from the code": "- If the edited node reaches the shown image twice, for example as `stack(clip(photo), photo)`, its controls follow only the first route (here, through the Clip). There is no single correct placement in that case.\n- Controls of a node upstream of a Reflection are placed for the unmirrored half only.", "Decision": "What should the view do when a node appears in the shown image more than once, or through a fold: draw every instance, draw the first and say so, or refuse? The spec's \"placed correctly\" does not say."}, "citations": [{"entry": "D-OVERLAY", "section": "Observed", "path": "src/graph.rs", "start": 318, "end": 343, "md": "findings.md:149"}, {"entry": "D-OVERLAY", "section": "Observed", "path": "src/engine/geom.rs", "start": 95, "end": 102, "md": "findings.md:149"}], "tests": [], "links": ["02-editing-and-views.md#f3-3-1"], "sections_html": {"Kind": "<p>Gap.<\/p>", "Clauses": "<p><a href=\"#\" data-goto=\"f3-3-1\">F3.3.1<\/a>: controls \"must be placed correctly even when nodes between the edited node and the shown image move or scale pixels\".<\/p>", "Observed": "<p><code>space_map_rec<\/code> returns the *first* path from the shown node to the edited node, trying ports in order (<a href=\"../../src/graph.rs#L318\" target=\"_blank\">graph.rs:318-343<\/a>). Maps are separable affine <code>Map2<\/code>s (<a href=\"../../src/engine/geom.rs#L95\" target=\"_blank\">geom.rs:95-102<\/a>); <code>Reflect<\/code> keeps the default identity <code>input_map<\/code> although it mirrors pixels.<\/p>", "Consequence, derived from the code": "<ul><li>If the edited node reaches the shown image twice, for example as <code>stack(clip(photo), photo)<\/code>, its controls follow only the first route (here, through the Clip). There is no single correct placement in that case.<\/li><li>Controls of a node upstream of a Reflection are placed for the unmirrored half only.<\/li><\/ul>", "Decision": "<p>What should the view do when a node appears in the shown image more than once, or through a fold: draw every instance, draw the first and say so, or refuse? The spec's \"placed correctly\" does not say.<\/p>"}, "quotes_html": []}, {"id": "D-ERROR-COLUMN", "title": "Project errors without a column", "anchor": "d-error-column", "file": "findings.md", "line": 157, "area": "Findings: where the code and the spec disagree", "kind": "note", "status": "", "quotes": [], "sections": {"Kind": "Gap (small).", "Clauses": "[E11](05-expressions.md#e11) (\"Errors are reported with a line and column\"), [P14](04-sessions-and-projects.md#p14).", "Observed": "`Project::verify` reports a missing or unsafe image as `project.delos, line N: …`, formatting `pos.line` only, although `pos.col` is known ([project.rs:218-223](../../src/project.rs#L218)).", "Decision": "Add the column (one line each), or limit the spec to syntax and semantic errors."}, "citations": [{"entry": "D-ERROR-COLUMN", "section": "Observed", "path": "src/project.rs", "start": 218, "end": 223, "md": "findings.md:163"}], "tests": [], "links": ["05-expressions.md#e11", "04-sessions-and-projects.md#p14"], "sections_html": {"Kind": "<p>Gap (small).<\/p>", "Clauses": "<p><a href=\"#\" data-goto=\"e11\">E11<\/a> (\"Errors are reported with a line and column\"), <a href=\"#\" data-goto=\"p14\">P14<\/a>.<\/p>", "Observed": "<p><code>Project::verify<\/code> reports a missing or unsafe image as <code>project.delos, line N: …<\/code>, formatting <code>pos.line<\/code> only, although <code>pos.col<\/code> is known (<a href=\"../../src/project.rs#L218\" target=\"_blank\">project.rs:218-223<\/a>).<\/p>", "Decision": "<p>Add the column (one line each), or limit the spec to syntax and semantic errors.<\/p>"}, "quotes_html": []}, {"id": "D-MODALITIES", "title": "Only the layer stack has a display modality", "anchor": "d-modalities", "file": "findings.md", "line": 167, "area": "Findings: where the code and the spec disagree", "kind": "note", "status": "", "quotes": [], "sections": {"Kind": "Gap, or a spec ambiguity.", "Clauses": "[F5](02-editing-and-views.md#f5): \"Delos shall define specific \"display modalities\" for standard operators\".", "Observed": "The layer stack is the only operator with a dedicated presentation (graph view rows `stack_chain`, the inspector's `LayerStack`, the `(stack …)` syntax) ([graph_view.rs:75-87](../../src/ui/graph_view.rs#L75)). Chains of Blend nodes, or a split and its recombination, are drawn as plain nodes.", "Decision": "Is the stack the only modality the spec wants (its only example), or should other operators get one? If more are wanted, which: blend chains as layer stacks with per-layer modes, a split and its re-stack as a \"selection\"?"}, "citations": [{"entry": "D-MODALITIES", "section": "Observed", "path": "src/ui/graph_view.rs", "start": 75, "end": 87, "md": "findings.md:173"}], "tests": [], "links": ["02-editing-and-views.md#f5"], "sections_html": {"Kind": "<p>Gap, or a spec ambiguity.<\/p>", "Clauses": "<p><a href=\"#\" data-goto=\"f5\">F5<\/a>: \"Delos shall define specific \"display modalities\" for standard operators\".<\/p>", "Observed": "<p>The layer stack is the only operator with a dedicated presentation (graph view rows <code>stack_chain<\/code>, the inspector's <code>LayerStack<\/code>, the <code>(stack …)<\/code> syntax) (<a href=\"../../src/ui/graph_view.rs#L75\" target=\"_blank\">graph_view.rs:75-87<\/a>). Chains of Blend nodes, or a split and its recombination, are drawn as plain nodes.<\/p>", "Decision": "<p>Is the stack the only modality the spec wants (its only example), or should other operators get one? If more are wanted, which: blend chains as layer stacks with per-layer modes, a split and its re-stack as a \"selection\"?<\/p>"}, "quotes_html": []}, {"id": "D-EXPORT-TARGET", "title": "Default export while editing on the input", "anchor": "d-export-target", "file": "findings.md", "line": 177, "area": "Findings: where the code and the spec disagree", "kind": "note", "status": "", "quotes": [], "sections": {"Kind": "Decision.", "Clauses": "[F4](02-editing-and-views.md#f4): by default, \"export the output currently visible in image view\".", "Observed": "When a Clip or a split is selected with \"Preview selection\" on, the view shows the node's *input* with its controls, but Export exports the node's *output*: `export_target` is the edited node when the view is not locked ([state.rs:380](../../src/ui/state.rs#L380)). The field's doc comment says this is intended (`Displayed`) ([state.rs:90-92](../../src/ui/state.rs#L90)).", "Decision": "The code's choice is defensible (nobody wants to export the uncropped image while cropping), but it contradicts the spec's wording. Update one of them."}, "citations": [{"entry": "D-EXPORT-TARGET", "section": "Observed", "path": "src/ui/state.rs", "start": 380, "end": 380, "md": "findings.md:183"}, {"entry": "D-EXPORT-TARGET", "section": "Observed", "path": "src/ui/state.rs", "start": 90, "end": 92, "md": "findings.md:183"}], "tests": [], "links": ["02-editing-and-views.md#f4"], "sections_html": {"Kind": "<p>Decision.<\/p>", "Clauses": "<p><a href=\"#\" data-goto=\"f4\">F4<\/a>: by default, \"export the output currently visible in image view\".<\/p>", "Observed": "<p>When a Clip or a split is selected with \"Preview selection\" on, the view shows the node's *input* with its controls, but Export exports the node's *output*: <code>export_target<\/code> is the edited node when the view is not locked (<a href=\"../../src/ui/state.rs#L380\" target=\"_blank\">state.rs:380<\/a>). The field's doc comment says this is intended (<code>Displayed<\/code>) (<a href=\"../../src/ui/state.rs#L90\" target=\"_blank\">state.rs:90-92<\/a>).<\/p>", "Decision": "<p>The code's choice is defensible (nobody wants to export the uncropped image while cropping), but it contradicts the spec's wording. Update one of them.<\/p>"}, "quotes_html": []}, {"id": "D-IMPORT", "title": "Importing replaces what feeds the output", "anchor": "d-import", "file": "findings.md", "line": 187, "area": "Findings: where the code and the spec disagree", "kind": "note", "status": "", "quotes": [], "sections": {"Kind": "Decision.", "Clauses": "[F1.1](02-editing-and-views.md#f1-1): an import creates a Static Image \"connected directly to the output\".", "Observed": "`finish_import` connects each new image to the output's only port, replacing the previous connection; the earlier node stays in the graph, detached ([mod.rs:264-268](../../src/ui/mod.rs#L264)). Importing several files at once leaves the last one connected.", "Decision": "The spec is followed literally, but with a second import it destroys the composition feeding the output. Alternatives: connect the first import only, or add later imports as layers of a stack (the code already supports `ImportTarget::StackLayer`)."}, "citations": [{"entry": "D-IMPORT", "section": "Observed", "path": "src/ui/mod.rs", "start": 264, "end": 268, "md": "findings.md:193"}], "tests": [], "links": ["02-editing-and-views.md#f1-1"], "sections_html": {"Kind": "<p>Decision.<\/p>", "Clauses": "<p><a href=\"#\" data-goto=\"f1-1\">F1.1<\/a>: an import creates a Static Image \"connected directly to the output\".<\/p>", "Observed": "<p><code>finish_import<\/code> connects each new image to the output's only port, replacing the previous connection; the earlier node stays in the graph, detached (<a href=\"../../src/ui/mod.rs#L264\" target=\"_blank\">mod.rs:264-268<\/a>). Importing several files at once leaves the last one connected.<\/p>", "Decision": "<p>The spec is followed literally, but with a second import it destroys the composition feeding the output. Alternatives: connect the first import only, or add later imports as layers of a stack (the code already supports <code>ImportTarget::StackLayer<\/code>).<\/p>"}, "quotes_html": []}, {"id": "D-DERIVED-PARAMS", "title": "Derived image parameters are not written", "anchor": "d-derived-params", "file": "findings.md", "line": 197, "area": "Findings: where the code and the spec disagree", "kind": "note", "status": "", "quotes": [], "sections": {"Kind": "Decision (small).", "Clauses": "[E8](05-expressions.md#e8): \"every parameter is written, including defaults\".", "Observed": "A static image's `image`, `width` and `height` parameters are skipped when printing and rejected when reading (`IMAGE_DERIVED`) ([expr.rs:35-36](../../src/expr.rs#L35), [expr.rs:355-358](../../src/expr.rs#L355)), because they are derived from the file.", "Decision": "None needed beyond noting the exception in the spec: these are hidden, derived values, not user parameters."}, "citations": [{"entry": "D-DERIVED-PARAMS", "section": "Observed", "path": "src/expr.rs", "start": 35, "end": 36, "md": "findings.md:203"}, {"entry": "D-DERIVED-PARAMS", "section": "Observed", "path": "src/expr.rs", "start": 355, "end": 358, "md": "findings.md:203"}], "tests": [], "links": ["05-expressions.md#e8"], "sections_html": {"Kind": "<p>Decision (small).<\/p>", "Clauses": "<p><a href=\"#\" data-goto=\"e8\">E8<\/a>: \"every parameter is written, including defaults\".<\/p>", "Observed": "<p>A static image's <code>image<\/code>, <code>width<\/code> and <code>height<\/code> parameters are skipped when printing and rejected when reading (<code>IMAGE_DERIVED<\/code>) (<a href=\"../../src/expr.rs#L35\" target=\"_blank\">expr.rs:35-36<\/a>, <a href=\"../../src/expr.rs#L355\" target=\"_blank\">expr.rs:355-358<\/a>), because they are derived from the file.<\/p>", "Decision": "<p>None needed beyond noting the exception in the spec: these are hidden, derived values, not user parameters.<\/p>"}, "quotes_html": []}, {"id": "D-SPEC-WORDING", "title": "Spec wording that cannot hold as written", "anchor": "d-spec-wording", "file": "findings.md", "line": 207, "area": "Findings: where the code and the spec disagree", "kind": "note", "status": "", "quotes": [], "sections": {"Kind": "Spec issue.", "Observed": "- [N1](03-operators.md#n1): generators \"should act as generators of data which can be input to other generators\", but the previous sentence says they take no inputs. The code reads \"other operators\".\n- [F5](02-editing-and-views.md#f5): a layer stack \"will never be empty\", yet the inspector offers \"+ Empty slot\" and an empty slot is a `None` layer (`push(None)`) ([inspector.rs:523](../../src/ui/inspector.rs#L523)). The chain itself is never empty, so no NIL node is needed, which is the spec's point; the wording invites confusion.\n- [O4](03-operators.md#o4): \"Downscale operator - should allow for downscaling\" is a sentence fragment, and Resize already downscales. The code gives Downscale a factor from 1 to 64 and a box or nearest method. The spec does not say how the two should differ.\n- [P2](04-sessions-and-projects.md#p2): projects are \"for sharing and collaborating with others\"; only sharing archives exists. Collaboration needs a definition before it can be traced.", "Decision": "Reword these four places so that each states something the code can be checked against."}, "citations": [{"entry": "D-SPEC-WORDING", "section": "Observed", "path": "src/ui/inspector.rs", "start": 523, "end": 523, "md": "findings.md:213"}], "tests": [], "links": ["03-operators.md#n1", "02-editing-and-views.md#f5", "03-operators.md#o4", "04-sessions-and-projects.md#p2"], "sections_html": {"Kind": "<p>Spec issue.<\/p>", "Observed": "<ul><li><a href=\"#\" data-goto=\"n1\">N1<\/a>: generators \"should act as generators of data which can be input to other generators\", but the previous sentence says they take no inputs. The code reads \"other operators\".<\/li><li><a href=\"#\" data-goto=\"f5\">F5<\/a>: a layer stack \"will never be empty\", yet the inspector offers \"+ Empty slot\" and an empty slot is a <code>None<\/code> layer (<code>push(None)<\/code>) (<a href=\"../../src/ui/inspector.rs#L523\" target=\"_blank\">inspector.rs:523<\/a>). The chain itself is never empty, so no NIL node is needed, which is the spec's point; the wording invites confusion.<\/li><li><a href=\"#\" data-goto=\"o4\">O4<\/a>: \"Downscale operator - should allow for downscaling\" is a sentence fragment, and Resize already downscales. The code gives Downscale a factor from 1 to 64 and a box or nearest method. The spec does not say how the two should differ.<\/li><li><a href=\"#\" data-goto=\"p2\">P2<\/a>: projects are \"for sharing and collaborating with others\"; only sharing archives exists. Collaboration needs a definition before it can be traced.<\/li><\/ul>", "Decision": "<p>Reword these four places so that each states something the code can be checked against.<\/p>"}, "quotes_html": []}, {"id": "U1", "title": "Undo and redo", "anchor": "u1", "file": "unspecified.md", "line": 24, "area": "Unspecified behaviour: code without a spec clause", "kind": "note", "status": "", "quotes": [], "sections": {"What": "Every edit is an undo step holding a full copy of the graph; slider and handle drags within one second share a step; the history keeps 60 steps. ⌘Z, ⇧⌘Z and ⌘Y undo and redo.", "Where": "`HISTORY_LIMIT` and `push_history` ([state.rs:142](../../src/ui/state.rs#L142), [state.rs:179-187](../../src/ui/state.rs#L179)); `edit` and `edit_coalesced` ([state.rs:190-215](../../src/ui/state.rs#L190)); `undo` and `redo` ([state.rs:262-284](../../src/ui/state.rs#L262)); the toolbar buttons ([mod.rs:395-396](../../src/ui/mod.rs#L395)).", "Why it matters": "The spec mentions undo only to say it is not part of a project ([P11](04-sessions-and-projects.md#p11)). Its depth and memory cost (each step may keep decoded images alive) are product decisions. Undo also caused the identity defect [D-STALE](findings.md#d-stale)."}, "citations": [{"entry": "U1", "section": "Where", "path": "src/ui/state.rs", "start": 142, "end": 142, "md": "unspecified.md:28"}, {"entry": "U1", "section": "Where", "path": "src/ui/state.rs", "start": 179, "end": 187, "md": "unspecified.md:28"}, {"entry": "U1", "section": "Where", "path": "src/ui/state.rs", "start": 190, "end": 215, "md": "unspecified.md:28"}, {"entry": "U1", "section": "Where", "path": "src/ui/state.rs", "start": 262, "end": 284, "md": "unspecified.md:28"}, {"entry": "U1", "section": "Where", "path": "src/ui/mod.rs", "start": 395, "end": 396, "md": "unspecified.md:28"}], "tests": [], "links": ["04-sessions-and-projects.md#p11", "findings.md#d-stale"], "sections_html": {"What": "<p>Every edit is an undo step holding a full copy of the graph; slider and handle drags within one second share a step; the history keeps 60 steps. ⌘Z, ⇧⌘Z and ⌘Y undo and redo.<\/p>", "Where": "<p><code>HISTORY_LIMIT<\/code> and <code>push_history<\/code> (<a href=\"../../src/ui/state.rs#L142\" target=\"_blank\">state.rs:142<\/a>, <a href=\"../../src/ui/state.rs#L179\" target=\"_blank\">state.rs:179-187<\/a>); <code>edit<\/code> and <code>edit_coalesced<\/code> (<a href=\"../../src/ui/state.rs#L190\" target=\"_blank\">state.rs:190-215<\/a>); <code>undo<\/code> and <code>redo<\/code> (<a href=\"../../src/ui/state.rs#L262\" target=\"_blank\">state.rs:262-284<\/a>); the toolbar buttons (<a href=\"../../src/ui/mod.rs#L395\" target=\"_blank\">mod.rs:395-396<\/a>).<\/p>", "Why it matters": "<p>The spec mentions undo only to say it is not part of a project (<a href=\"#\" data-goto=\"p11\">P11<\/a>). Its depth and memory cost (each step may keep decoded images alive) are product decisions. Undo also caused the identity defect <a href=\"#\" data-goto=\"d-stale\">D-STALE<\/a>.<\/p>"}, "quotes_html": []}, {"id": "U2", "title": "Keyboard shortcuts", "anchor": "u2", "file": "unspecified.md", "line": 32, "area": "Unspecified behaviour: code without a spec clause", "kind": "note", "status": "", "quotes": [], "sections": {"What": "⌘E exports, Delete or Backspace deletes the selection, Escape closes the export dialog or prompt or clears the selection, F fits the image.", "Where": "`on_key` ([mod.rs:286-308](../../src/ui/mod.rs#L286))."}, "citations": [{"entry": "U2", "section": "Where", "path": "src/ui/mod.rs", "start": 286, "end": 308, "md": "unspecified.md:36"}], "tests": [], "links": [], "sections_html": {"What": "<p>⌘E exports, Delete or Backspace deletes the selection, Escape closes the export dialog or prompt or clears the selection, F fits the image.<\/p>", "Where": "<p><code>on_key<\/code> (<a href=\"../../src/ui/mod.rs#L286\" target=\"_blank\">mod.rs:286-308<\/a>).<\/p>"}, "quotes_html": []}, {"id": "U3", "title": "Adding and deleting nodes rewire the graph", "anchor": "u3", "file": "unspecified.md", "line": 38, "area": "Unspecified behaviour: code without a spec clause", "kind": "note", "status": "", "quotes": [], "sections": {"What": "\"Add node\" inserts the new node after the selected one, taking over its consumers; with nothing selected it feeds an empty output. Deleting a node with one input bridges its input to its consumers; deleting a layer stack deletes the whole chain.", "Where": "`App::add_node` ([state.rs:452-488](../../src/ui/state.rs#L452)), `App::delete_node` ([state.rs:505-534](../../src/ui/state.rs#L505)).", "Why it matters": "These rules decide what a user's graph looks like after the two most common edits, and they caused [D-ADD-AFTER-SPLIT](findings.md#d-add-after-split)."}, "citations": [{"entry": "U3", "section": "Where", "path": "src/ui/state.rs", "start": 452, "end": 488, "md": "unspecified.md:42"}, {"entry": "U3", "section": "Where", "path": "src/ui/state.rs", "start": 505, "end": 534, "md": "unspecified.md:42"}], "tests": [], "links": ["findings.md#d-add-after-split"], "sections_html": {"What": "<p>\"Add node\" inserts the new node after the selected one, taking over its consumers; with nothing selected it feeds an empty output. Deleting a node with one input bridges its input to its consumers; deleting a layer stack deletes the whole chain.<\/p>", "Where": "<p><code>App::add_node<\/code> (<a href=\"../../src/ui/state.rs#L452\" target=\"_blank\">state.rs:452-488<\/a>), <code>App::delete_node<\/code> (<a href=\"../../src/ui/state.rs#L505\" target=\"_blank\">state.rs:505-534<\/a>).<\/p>", "Why it matters": "<p>These rules decide what a user's graph looks like after the two most common edits, and they caused <a href=\"#\" data-goto=\"d-add-after-split\">D-ADD-AFTER-SPLIT<\/a>.<\/p>"}, "quotes_html": []}, {"id": "U4", "title": "The inspector beyond parameters", "anchor": "u4", "file": "unspecified.md", "line": 46, "area": "Unspecified behaviour: code without a spec clause", "kind": "note", "status": "", "quotes": [], "sections": {"What": "Nodes can be renamed (the title becomes `:title`); every input port has a picker listing all outputs that would not form a cycle; each node shows its size, description, \"slow\" hint and last error.", "Where": "The title field, which sets `label` ([inspector.rs:104-118](../../src/ui/inspector.rs#L104)), input pickers built from `candidates` ([inspector.rs:160-188](../../src/ui/inspector.rs#L160)), `slow_hint` ([inspector.rs:124-129](../../src/ui/inspector.rs#L124))."}, "citations": [{"entry": "U4", "section": "Where", "path": "src/ui/inspector.rs", "start": 104, "end": 118, "md": "unspecified.md:50"}, {"entry": "U4", "section": "Where", "path": "src/ui/inspector.rs", "start": 160, "end": 188, "md": "unspecified.md:50"}, {"entry": "U4", "section": "Where", "path": "src/ui/inspector.rs", "start": 124, "end": 129, "md": "unspecified.md:50"}], "tests": [], "links": [], "sections_html": {"What": "<p>Nodes can be renamed (the title becomes <code>:title<\/code>); every input port has a picker listing all outputs that would not form a cycle; each node shows its size, description, \"slow\" hint and last error.<\/p>", "Where": "<p>The title field, which sets <code>label<\/code> (<a href=\"../../src/ui/inspector.rs#L104\" target=\"_blank\">inspector.rs:104-118<\/a>), input pickers built from <code>candidates<\/code> (<a href=\"../../src/ui/inspector.rs#L160\" target=\"_blank\">inspector.rs:160-188<\/a>), <code>slow_hint<\/code> (<a href=\"../../src/ui/inspector.rs#L124\" target=\"_blank\">inspector.rs:124-129<\/a>).<\/p>"}, "quotes_html": []}, {"id": "U5", "title": "How previews are produced", "anchor": "u5", "file": "unspecified.md", "line": 52, "area": "Unspecified behaviour: code without a spec clause", "kind": "note", "status": "", "quotes": [], "sections": {"What": "Previews render only the visible region at screen resolution, capped at 10 Mpx (`MAX_PREVIEW_PIXELS`); a newer request cancels an older one; when renders are slow a quarter-resolution frame is shown first; frames are composited over a checkerboard and sent to the webview as BMP.", "Where": "The request effect ([image_view.rs:83-125](../../src/ui/image_view.rs#L83)) and `MAX_PREVIEW_PIXELS` ([image_view.rs:15-16](../../src/ui/image_view.rs#L15)); latest-wins and progressive refinement in `run_preview` ([worker.rs:179-225](../../src/worker.rs#L179)); `encode_display_bmp` ([worker.rs:449-485](../../src/worker.rs#L449)).", "Why it matters": "This is how Delos meets the INSTRUCTIONS' \"effectively instant\" principle, which the spec turns into a single test clause ([Q3](06-quality.md#q3)). The 80 ms threshold and the 10 Mpx cap are unrecorded tuning decisions."}, "citations": [{"entry": "U5", "section": "Where", "path": "src/ui/image_view.rs", "start": 83, "end": 125, "md": "unspecified.md:56"}, {"entry": "U5", "section": "Where", "path": "src/ui/image_view.rs", "start": 15, "end": 16, "md": "unspecified.md:56"}, {"entry": "U5", "section": "Where", "path": "src/worker.rs", "start": 179, "end": 225, "md": "unspecified.md:56"}, {"entry": "U5", "section": "Where", "path": "src/worker.rs", "start": 449, "end": 485, "md": "unspecified.md:56"}], "tests": [], "links": ["06-quality.md#q3"], "sections_html": {"What": "<p>Previews render only the visible region at screen resolution, capped at 10 Mpx (<code>MAX_PREVIEW_PIXELS<\/code>); a newer request cancels an older one; when renders are slow a quarter-resolution frame is shown first; frames are composited over a checkerboard and sent to the webview as BMP.<\/p>", "Where": "<p>The request effect (<a href=\"../../src/ui/image_view.rs#L83\" target=\"_blank\">image_view.rs:83-125<\/a>) and <code>MAX_PREVIEW_PIXELS<\/code> (<a href=\"../../src/ui/image_view.rs#L15\" target=\"_blank\">image_view.rs:15-16<\/a>); latest-wins and progressive refinement in <code>run_preview<\/code> (<a href=\"../../src/worker.rs#L179\" target=\"_blank\">worker.rs:179-225<\/a>); <code>encode_display_bmp<\/code> (<a href=\"../../src/worker.rs#L449\" target=\"_blank\">worker.rs:449-485<\/a>).<\/p>", "Why it matters": "<p>This is how Delos meets the INSTRUCTIONS' \"effectively instant\" principle, which the spec turns into a single test clause (<a href=\"#\" data-goto=\"q3\">Q3<\/a>). The 80 ms threshold and the 10 Mpx cap are unrecorded tuning decisions.<\/p>"}, "quotes_html": []}, {"id": "U6", "title": "GPU memory policy", "anchor": "u6", "file": "unspecified.md", "line": 60, "area": "Unspecified behaviour: code without a spec clause", "kind": "note", "status": "", "quotes": [], "sections": {"What": "Source image levels are kept on the GPU up to 4 GiB (1 GiB on mobile) and evicted least recently used first; idle textures and readback buffers are pooled up to 512 MiB (128 MiB on mobile); every kernel is compiled at start-up; opt-in profiling times every operation.", "Where": "`DEFAULT_BUDGET` ([resident.rs:16-20](../../src/engine/resident.rs#L16)), the `Pool` and its `DEFAULT_CAP` ([pool.rs:1-20](../../src/engine/pool.rs#L1)), `warm_up` ([engine/mod.rs:106-115](../../src/engine/mod.rs#L106)), `Profile` ([profile.rs:1-14](../../src/engine/profile.rs#L1)).", "Why it matters": "The INS
