ee [P10](#p10)) ([worker.rs:366](../../src/worker.rs#L366)), and rewrites `project.delos` only when its text changed ([worker.rs:368](../../src/worker.rs#L368))."}, "citations": [{"entry": "P6", "section": "Implemented by", "path": "src/ui/session.rs", "start": 251, "end": 256, "md": "04-sessions-and-projects.md:119"}, {"entry": "P6", "section": "Implemented by", "path": "src/ui/session.rs", "start": 263, "end": 265, "md": "04-sessions-and-projects.md:119"}, {"entry": "P6", "section": "Implemented by", "path": "src/worker.rs", "start": 356, "end": 356, "md": "04-sessions-and-projects.md:120"}, {"entry": "P6", "section": "Implemented by", "path": "src/worker.rs", "start": 360, "end": 360, "md": "04-sessions-and-projects.md:120"}, {"entry": "P6", "section": "Implemented by", "path": "src/worker.rs", "start": 365, "end": 365, "md": "04-sessions-and-projects.md:120"}, {"entry": "P6", "section": "Implemented by", "path": "src/worker.rs", "start": 367, "end": 373, "md": "04-sessions-and-projects.md:120"}, {"entry": "P6", "section": "Notes", "path": "src/worker.rs", "start": 361, "end": 364, "md": "04-sessions-and-projects.md:124"}, {"entry": "P6", "section": "Notes", "path": "src/worker.rs", "start": 366, "end": 366, "md": "04-sessions-and-projects.md:124"}, {"entry": "P6", "section": "Notes", "path": "src/worker.rs", "start": 368, "end": 368, "md": "04-sessions-and-projects.md:124"}], "tests": ["tests/project_e2e.rs::edits_are_autosaved_and_reopen_identically"], "links": ["03-operators.md#n3", "04-sessions-and-projects.md#p10"], "sections_html": {"Status": "<p>Implemented.<\/p>", "Implemented by": "<ul><li><code>use_autosave<\/code> is an effect on <code>graph<\/code> and <code>session<\/code>: each change bumps <code>seq<\/code> and calls <code>Worker::save_project<\/code> with every image the session holds (<code>all_images<\/code>) (<a href=\"../../src/ui/session.rs#L251\" target=\"_blank\">session.rs:251-256<\/a>, <a href=\"../../src/ui/session.rs#L263\" target=\"_blank\">session.rs:263-265<\/a>).<\/li><li><code>save_project<\/code> runs in the background (<code>run_background<\/code>), serialises the graph with <code>to_text<\/code> and writes <code>project.delos<\/code> with <code>save_text<\/code> (<a href=\"../../src/worker.rs#L356\" target=\"_blank\">worker.rs:356<\/a>, <a href=\"../../src/worker.rs#L360\" target=\"_blank\">worker.rs:360<\/a>, <a href=\"../../src/worker.rs#L365\" target=\"_blank\">worker.rs:365<\/a>, <a href=\"../../src/worker.rs#L367\" target=\"_blank\">worker.rs:367-373<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/project_e2e.rs::edits_are_autosaved_and_reopen_identically<\/code>.<\/p>", "Notes": "<p>\"Every change\" includes moving nodes in the graph view (positions are saved as <code>:at<\/code>) and the automatic canvas fit (<a href=\"#\" data-goto=\"n3\">N3<\/a>). <code>save_project<\/code> skips saves older than the last written one (<code>saved_seq<\/code>) (<a href=\"../../src/worker.rs#L361\" target=\"_blank\">worker.rs:361-364<\/a>), syncs <code>inputs/<\/code> first (<code>sync_inputs<\/code>, see <a href=\"#\" data-goto=\"p10\">P10<\/a>) (<a href=\"../../src/worker.rs#L366\" target=\"_blank\">worker.rs:366<\/a>), and rewrites <code>project.delos<\/code> only when its text changed (<a href=\"../../src/worker.rs#L368\" target=\"_blank\">worker.rs:368<\/a>).<\/p>"}, "quotes_html": ["Projects are saved automatically after every change."]}, {"id": "P6.1", "title": "Atomic saves", "anchor": "p6-1", "file": "04-sessions-and-projects.md", "line": 126, "area": "4 · Sessions and projects", "kind": "clause", "status": "Implemented", "quotes": ["Saves are atomic, so a project file is never left half-written."], "sections": {"Status": "Implemented, without `fsync`: a crash cannot leave a half-written file in place, but power loss can lose the last save.", "Implemented by": "- `write_atomic` writes a temporary file and renames it ([project.rs:390-399](../../src/project.rs#L390)); `save_text` uses it for `project.delos` ([project.rs:191-193](../../src/project.rs#L191)) and `add_input` for copied images ([project.rs:103](../../src/project.rs#L103)).\n- `share` writes the archive the same way (`tmp_path`, then `rename`) ([project.rs:258](../../src/project.rs#L258), [project.rs:277-283](../../src/project.rs#L277)).", "Tests": "None (atomicity under failure is not tested)."}, "citations": [{"entry": "P6.1", "section": "Implemented by", "path": "src/project.rs", "start": 390, "end": 399, "md": "04-sessions-and-projects.md:133"}, {"entry": "P6.1", "section": "Implemented by", "path": "src/project.rs", "start": 191, "end": 193, "md": "04-sessions-and-projects.md:133"}, {"entry": "P6.1", "section": "Implemented by", "path": "src/project.rs", "start": 103, "end": 103, "md": "04-sessions-and-projects.md:133"}, {"entry": "P6.1", "section": "Implemented by", "path": "src/project.rs", "start": 258, "end": 258, "md": "04-sessions-and-projects.md:134"}, {"entry": "P6.1", "section": "Implemented by", "path": "src/project.rs", "start": 277, "end": 283, "md": "04-sessions-and-projects.md:134"}], "tests": [], "links": [], "sections_html": {"Status": "<p>Implemented, without <code>fsync<\/code>: a crash cannot leave a half-written file in place, but power loss can lose the last save.<\/p>", "Implemented by": "<ul><li><code>write_atomic<\/code> writes a temporary file and renames it (<a href=\"../../src/project.rs#L390\" target=\"_blank\">project.rs:390-399<\/a>); <code>save_text<\/code> uses it for <code>project.delos<\/code> (<a href=\"../../src/project.rs#L191\" target=\"_blank\">project.rs:191-193<\/a>) and <code>add_input<\/code> for copied images (<a href=\"../../src/project.rs#L103\" target=\"_blank\">project.rs:103<\/a>).<\/li><li><code>share<\/code> writes the archive the same way (<code>tmp_path<\/code>, then <code>rename<\/code>) (<a href=\"../../src/project.rs#L258\" target=\"_blank\">project.rs:258<\/a>, <a href=\"../../src/project.rs#L277\" target=\"_blank\">project.rs:277-283<\/a>).<\/li><\/ul>", "Tests": "<p>None (atomicity under failure is not tested).<\/p>"}, "quotes_html": ["Saves are atomic, so a project file is never left half-written."]}, {"id": "P6.2", "title": "Opening a project writes nothing", "anchor": "p6-2", "file": "04-sessions-and-projects.md", "line": 138, "area": "4 · Sessions and projects", "kind": "clause", "status": "Partial", "quotes": ["Opening a project does not change anything on disk until the user edits it."], "sections": {"Status": "Partial. The autosave skips the first run after opening, but a generator-only project can be rewritten without any edit: `replace_document` resets `canvas_user_set`, and the image view's automatic canvas fit then writes `canvas_w`/`canvas_h` when the window size differs, which autosaves ([D-OPEN-WRITES](findings.md#d-open-writes)).", "Implemented by": "- `on_project_opened` sets `SaveState::Saved` ([session.rs:210-211](../../src/ui/session.rs#L210)); `use_autosave` skips the first run after the project directory changes while the state is `Saved` (`switched`) ([session.rs:257-262](../../src/ui/session.rs#L257)).", "Tests": "`tests/project_e2e.rs::opening_a_project_does_not_rewrite_it` (runs headless, with no viewport, so the canvas fit never fires).", "Notes": "The fit: `fit_canvas_to_window` ([state.rs:323-344](../../src/ui/state.rs#L323)), called by the image view whenever size-less content is shown ([image_view.rs:69-76](../../src/ui/image_view.rs#L69)); `canvas_user_set` is reset in `replace_document` ([state.rs:257](../../src/ui/state.rs#L257)). Confirmed by a failing probe ([D-OPEN-WRITES](findings.md#d-open-writes)). Importing a `.delosproject` necessarily writes the unpacked copy; the clause concerns the opened project's own files."}, "citations": [{"entry": "P6.2", "section": "Implemented by", "path": "src/ui/session.rs", "start": 210, "end": 211, "md": "04-sessions-and-projects.md:145"}, {"entry": "P6.2", "section": "Implemented by", "path": "src/ui/session.rs", "start": 257, "end": 262, "md": "04-sessions-and-projects.md:145"}, {"entry": "P6.2", "section": "Notes", "path": "src/ui/state.rs", "start": 323, "end": 344, "md": "04-sessions-and-projects.md:149"}, {"entry": "P6.2", "section": "Notes", "path": "src/ui/image_view.rs", "start": 69, "end": 76, "md": "04-sessions-and-projects.md:149"}, {"entry": "P6.2", "section": "Notes", "path": "src/ui/state.rs", "start": 257, "end": 257, "md": "04-sessions-and-projects.md:149"}], "tests": ["tests/project_e2e.rs::opening_a_project_does_not_rewrite_it"], "links": ["findings.md#d-open-writes", "findings.md#d-open-writes"], "sections_html": {"Status": "<p>Partial. The autosave skips the first run after opening, but a generator-only project can be rewritten without any edit: <code>replace_document<\/code> resets <code>canvas_user_set<\/code>, and the image view's automatic canvas fit then writes <code>canvas_w<\/code>/<code>canvas_h<\/code> when the window size differs, which autosaves (<a href=\"#\" data-goto=\"d-open-writes\">D-OPEN-WRITES<\/a>).<\/p>", "Implemented by": "<ul><li><code>on_project_opened<\/code> sets <code>SaveState::Saved<\/code> (<a href=\"../../src/ui/session.rs#L210\" target=\"_blank\">session.rs:210-211<\/a>); <code>use_autosave<\/code> skips the first run after the project directory changes while the state is <code>Saved<\/code> (<code>switched<\/code>) (<a href=\"../../src/ui/session.rs#L257\" target=\"_blank\">session.rs:257-262<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/project_e2e.rs::opening_a_project_does_not_rewrite_it<\/code> (runs headless, with no viewport, so the canvas fit never fires).<\/p>", "Notes": "<p>The fit: <code>fit_canvas_to_window<\/code> (<a href=\"../../src/ui/state.rs#L323\" target=\"_blank\">state.rs:323-344<\/a>), called by the image view whenever size-less content is shown (<a href=\"../../src/ui/image_view.rs#L69\" target=\"_blank\">image_view.rs:69-76<\/a>); <code>canvas_user_set<\/code> is reset in <code>replace_document<\/code> (<a href=\"../../src/ui/state.rs#L257\" target=\"_blank\">state.rs:257<\/a>). Confirmed by a failing probe (<a href=\"#\" data-goto=\"d-open-writes\">D-OPEN-WRITES<\/a>). Importing a <code>.delosproject<\/code> necessarily writes the unpacked copy; the clause concerns the opened project's own files.<\/p>"}, "quotes_html": ["Opening a project does not change anything on disk until the user edits it."]}, {"id": "P7", "title": "Confirm before leaving quick mode with work", "anchor": "p7", "file": "04-sessions-and-projects.md", "line": 151, "area": "4 · Sessions and projects", "kind": "clause", "status": "Partial", "quotes": ["Leaving a quick-mode session that has work in it asks for confirmation."], "sections": {"Status": "Partial. On desktop, End quick session and opening a project ask first. On mobile, `confirm` answers yes without asking. On the web the Project menu is hidden, so the only way to leave is closing the tab, and on every platform closing the window or quitting is not intercepted ([D-QUICK-EXIT](findings.md#d-quick-exit)).", "Implemented by": "- `has_unsaved_work`: not `Fresh`, not a project, more than the output node ([session.rs:243-245](../../src/ui/session.rs#L243)).\n- Callers: \"End quick session\" (`close`) ([mod.rs:509-517](../../src/ui/mod.rs#L509)), opening a project from the menu (`open_with`) ([mod.rs:479-481](../../src/ui/mod.rs#L479)) or by dropping one, also guarded by `has_unsaved_work` ([mod.rs:96](../../src/ui/mod.rs#L96)).\n- `platform::confirm` shows a native dialog on desktop and returns `true` elsewhere ([platform.rs:217-236](../../src/ui/platform.rs#L217)).", "Tests": "`tests/project_e2e.rs::quick_mode_imports_without_copying` asserts `has_unsaved_work`; the confirmation itself is UI and untested."}, "citations": [{"entry": "P7", "section": "Implemented by", "path": "src/ui/session.rs", "start": 243, "end": 245, "md": "04-sessions-and-projects.md:158"}, {"entry": "P7", "section": "Implemented by", "path": "src/ui/mod.rs", "start": 509, "end": 517, "md": "04-sessions-and-projects.md:159"}, {"entry": "P7", "section": "Implemented by", "path": "src/ui/mod.rs", "start": 479, "end": 481, "md": "04-sessions-and-projects.md:159"}, {"entry": "P7", "section": "Implemented by", "path": "src/ui/mod.rs", "start": 96, "end": 96, "md": "04-sessions-and-projects.md:159"}, {"entry": "P7", "section": "Implemented by", "path": "src/ui/platform.rs", "start": 217, "end": 236, "md": "04-sessions-and-projects.md:160"}], "tests": ["tests/project_e2e.rs::quick_mode_imports_without_copying"], "links": ["findings.md#d-quick-exit"], "sections_html": {"Status": "<p>Partial. On desktop, End quick session and opening a project ask first. On mobile, <code>confirm<\/code> answers yes without asking. On the web the Project menu is hidden, so the only way to leave is closing the tab, and on every platform closing the window or quitting is not intercepted (<a href=\"#\" data-goto=\"d-quick-exit\">D-QUICK-EXIT<\/a>).<\/p>", "Implemented by": "<ul><li><code>has_unsaved_work<\/code>: not <code>Fresh<\/code>, not a project, more than the output node (<a href=\"../../src/ui/session.rs#L243\" target=\"_blank\">session.rs:243-245<\/a>).<\/li><li>Callers: \"End quick session\" (<code>close<\/code>) (<a href=\"../../src/ui/mod.rs#L509\" target=\"_blank\">mod.rs:509-517<\/a>), opening a project from the menu (<code>open_with<\/code>) (<a href=\"../../src/ui/mod.rs#L479\" target=\"_blank\">mod.rs:479-481<\/a>) or by dropping one, also guarded by <code>has_unsaved_work<\/code> (<a href=\"../../src/ui/mod.rs#L96\" target=\"_blank\">mod.rs:96<\/a>).<\/li><li><code>platform::confirm<\/code> shows a native dialog on desktop and returns <code>true<\/code> elsewhere (<a href=\"../../src/ui/platform.rs#L217\" target=\"_blank\">platform.rs:217-236<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/project_e2e.rs::quick_mode_imports_without_copying<\/code> asserts <code>has_unsaved_work<\/code>; the confirmation itself is UI and untested.<\/p>"}, "quotes_html": ["Leaving a quick-mode session that has work in it asks for confirmation."]}, {"id": "P8", "title": "A project is a directory with project.delos and inputs/", "anchor": "p8", "file": "04-sessions-and-projects.md", "line": 164, "area": "4 · Sessions and projects", "kind": "clause", "status": "Implemented", "quotes": ["A project is a directory:"], "sections": {"Status": "Implemented.", "Implemented by": "- `PROJECT_FILE` and `INPUTS_DIR` ([project.rs:29-30](../../src/project.rs#L29)); `Project::create` makes `inputs/` and writes an empty graph ([project.rs:73-76](../../src/project.rs#L73)).\n- Images are referred to as `inputs/<file>` (`add_input`) ([project.rs:112](../../src/project.rs#L112)).", "Tests": "`tests/project.rs::create_makes_the_project_layout`."}, "citations": [{"entry": "P8", "section": "Implemented by", "path": "src/project.rs", "start": 29, "end": 30, "md": "04-sessions-and-projects.md:171"}, {"entry": "P8", "section": "Implemented by", "path": "src/project.rs", "start": 73, "end": 76, "md": "04-sessions-and-projects.md:171"}, {"entry": "P8", "section": "Implemented by", "path": "src/project.rs", "start": 112, "end": 112, "md": "04-sessions-and-projects.md:172"}], "tests": ["tests/project.rs::create_makes_the_project_layout"], "links": [], "sections_html": {"Status": "<p>Implemented.<\/p>", "Implemented by": "<ul><li><code>PROJECT_FILE<\/code> and <code>INPUTS_DIR<\/code> (<a href=\"../../src/project.rs#L29\" target=\"_blank\">project.rs:29-30<\/a>); <code>Project::create<\/code> makes <code>inputs/<\/code> and writes an empty graph (<a href=\"../../src/project.rs#L73\" target=\"_blank\">project.rs:73-76<\/a>).<\/li><li>Images are referred to as <code>inputs/&lt;file&gt;<\/code> (<code>add_input<\/code>) (<a href=\"../../src/project.rs#L112\" target=\"_blank\">project.rs:112<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/project.rs::create_makes_the_project_layout<\/code>.<\/p>"}, "quotes_html": ["A project is a directory:"]}, {"id": "P9", "title": "Images copied unchanged, or as PNG", "anchor": "p9", "file": "04-sessions-and-projects.md", "line": 176, "area": "4 · Sessions and projects", "kind": "clause", "status": "Implemented", "quotes": ["Imported images are copied into `inputs/` unchanged (no re-encoding) when their original bytes are available.", "Images known only by their pixels are written as PNG."], "sections": {"Status": "Implemented.", "Implemented by": "- `adopt_image` copies the bytes of the image's `origin` file, else encodes `to_rgba8` as PNG, and points the image at its copy (`set_project_file`) ([project.rs:117-131](../../src/project.rs#L117)). `add_input` writes those bytes as they are into `inputs/` (`write_atomic`) ([project.rs:90-93](../../src/project.rs#L90), [project.rs:101-104](../../src/project.rs#L101)).\n- Images dropped or picked without a path keep their bytes in the session stash when a project is open (`keep_bytes`), so they too have an `origin` ([worker.rs:257-264](../../src/worker.rs#L257)).", "Tests": "`tests/project.rs::inputs_are_copied_and_deduplicated`, `tests/project.rs::sync_copies_images_without_a_file_and_moves_out_strays`, `tests/project_e2e.rs::first_import_asks_and_creates_a_project`.", "Notes": "`add_input` reuses an identical file of the same name and otherwise picks a free name ([project.rs:98-111](../../src/project.rs#L98))."}, "citations": [{"entry": "P9", "section": "Implemented by", "path": "src/project.rs", "start": 117, "end": 131, "md": "04-sessions-and-projects.md:184"}, {"entry": "P9", "section": "Implemented by", "path": "src/project.rs", "start": 90, "end": 93, "md": "04-sessions-and-projects.md:184"}, {"entry": "P9", "section": "Implemented by", "path": "src/project.rs", "start": 101, "end": 104, "md": "04-sessions-and-projects.md:184"}, {"entry": "P9", "section": "Implemented by", "path": "src/worker.rs", "start": 257, "end": 264, "md": "04-sessions-and-projects.md:185"}, {"entry": "P9", "section": "Notes", "path": "src/project.rs", "start": 98, "end": 111, "md": "04-sessions-and-projects.md:189"}], "tests": ["tests/project.rs::inputs_are_copied_and_deduplicated", "tests/project.rs::sync_copies_images_without_a_file_and_moves_out_strays", "tests/project_e2e.rs::first_import_asks_and_creates_a_project"], "links": [], "sections_html": {"Status": "<p>Implemented.<\/p>", "Implemented by": "<ul><li><code>adopt_image<\/code> copies the bytes of the image's <code>origin<\/code> file, else encodes <code>to_rgba8<\/code> as PNG, and points the image at its copy (<code>set_project_file<\/code>) (<a href=\"../../src/project.rs#L117\" target=\"_blank\">project.rs:117-131<\/a>). <code>add_input<\/code> writes those bytes as they are into <code>inputs/<\/code> (<code>write_atomic<\/code>) (<a href=\"../../src/project.rs#L90\" target=\"_blank\">project.rs:90-93<\/a>, <a href=\"../../src/project.rs#L101\" target=\"_blank\">project.rs:101-104<\/a>).<\/li><li>Images dropped or picked without a path keep their bytes in the session stash when a project is open (<code>keep_bytes<\/code>), so they too have an <code>origin<\/code> (<a href=\"../../src/worker.rs#L257\" target=\"_blank\">worker.rs:257-264<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/project.rs::inputs_are_copied_and_deduplicated<\/code>, <code>tests/project.rs::sync_copies_images_without_a_file_and_moves_out_strays<\/code>, <code>tests/project_e2e.rs::first_import_asks_and_creates_a_project<\/code>.<\/p>", "Notes": "<p><code>add_input<\/code> reuses an identical file of the same name and otherwise picks a free name (<a href=\"../../src/project.rs#L98\" target=\"_blank\">project.rs:98-111<\/a>).<\/p>"}, "quotes_html": ["Imported images are copied into <code>inputs/<\/code> unchanged (no re-encoding) when their original bytes are available.", "Images known only by their pixels are written as PNG."]}, {"id": "P10", "title": "inputs/ holds exactly the images in use", "anchor": "p10", "file": "04-sessions-and-projects.md", "line": 191, "area": "4 · Sessions and projects", "kind": "clause", "status": "Implemented", "quotes": ["`inputs/` contains exactly the images the current graph uses.", "Images that are no longer used are removed from it."], "sections": {"Status": "Implemented.", "Implemented by": "- `sync_inputs` adopts used images that lack a file and moves every other file out to the stash ([project.rs:142-153](../../src/project.rs#L142), [project.rs:154-175](../../src/project.rs#L154)); it runs before each save ([worker.rs:366](../../src/worker.rs#L366)).", "Tests": "`tests/project.rs::sync_keeps_inputs_equal_to_the_images_in_use`, `tests/project_e2e.rs::removed_images_leave_the_project_and_undo_restores_them`.", "Notes": "Hidden files, `*.tmp` files and anything that is not a regular file (subfolders) are left alone. Until the first edit after opening, a stray file in `inputs/` stays (by [P6.2](#p6-2))."}, "citations": [{"entry": "P10", "section": "Implemented by", "path": "src/project.rs", "start": 142, "end": 153, "md": "04-sessions-and-projects.md:199"}, {"entry": "P10", "section": "Implemented by", "path": "src/project.rs", "start": 154, "end": 175, "md": "04-sessions-and-projects.md:199"}, {"entry": "P10", "section": "Implemented by", "path": "src/worker.rs", "start": 366, "end": 366, "md": "04-sessions-and-projects.md:199"}], "tests": ["tests/project.rs::sync_keeps_inputs_equal_to_the_images_in_use", "tests/project_e2e.rs::removed_images_leave_the_project_and_undo_restores_them"], "links": ["04-sessions-and-projects.md#p6-2"], "sections_html": {"Status": "<p>Implemented.<\/p>", "Implemented by": "<ul><li><code>sync_inputs<\/code> adopts used images that lack a file and moves every other file out to the stash (<a href=\"../../src/project.rs#L142\" target=\"_blank\">project.rs:142-153<\/a>, <a href=\"../../src/project.rs#L154\" target=\"_blank\">project.rs:154-175<\/a>); it runs before each save (<a href=\"../../src/worker.rs#L366\" target=\"_blank\">worker.rs:366<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/project.rs::sync_keeps_inputs_equal_to_the_images_in_use<\/code>, <code>tests/project_e2e.rs::removed_images_leave_the_project_and_undo_restores_them<\/code>.<\/p>", "Notes": "<p>Hidden files, <code>*.tmp<\/code> files and anything that is not a regular file (subfolders) are left alone. Until the first edit after opening, a stray file in <code>inputs/<\/code> stays (by <a href=\"#\" data-goto=\"p6-2\">P6.2<\/a>).<\/p>"}, "quotes_html": ["<code>inputs/<\/code> contains exactly the images the current graph uses.", "Images that are no longer used are removed from it."]}, {"id": "P11", "title": "Undo history is not part of the project", "anchor": "p11", "file": "04-sessions-and-projects.md", "line": 205, "area": "4 · Sessions and projects", "kind": "clause", "status": "Implemented", "quotes": ["Undo history is not part of a project.", "It belongs to the editing session and is not expected to survive closing and reopening a project."], "sections": {"Status": "Implemented.", "Implemented by": "- `History` (undo and redo stacks of `Graph` snapshots) lives in `App`, not in the project ([state.rs:100-106](../../src/ui/state.rs#L100)); `replace_document` clears it on open and close ([state.rs:249](../../src/ui/state.rs#L249)).\n- `to_text` serialises only the graph ([expr.rs:376](../../src/expr.rs#L376)).", "Tests": "`tests/project_e2e.rs::edits_are_autosaved_and_reopen_identically` (asserts no undo after reopening)."}, "citations": [{"entry": "P11", "section": "Implemented by", "path": "src/ui/state.rs", "start": 100, "end": 106, "md": "04-sessions-and-projects.md:213"}, {"entry": "P11", "section": "Implemented by", "path": "src/ui/state.rs", "start": 249, "end": 249, "md": "04-sessions-and-projects.md:213"}, {"entry": "P11", "section": "Implemented by", "path": "src/expr.rs", "start": 376, "end": 376, "md": "04-sessions-and-projects.md:214"}], "tests": ["tests/project_e2e.rs::edits_are_autosaved_and_reopen_identically"], "links": [], "sections_html": {"Status": "<p>Implemented.<\/p>", "Implemented by": "<ul><li><code>History<\/code> (undo and redo stacks of <code>Graph<\/code> snapshots) lives in <code>App<\/code>, not in the project (<a href=\"../../src/ui/state.rs#L100\" target=\"_blank\">state.rs:100-106<\/a>); <code>replace_document<\/code> clears it on open and close (<a href=\"../../src/ui/state.rs#L249\" target=\"_blank\">state.rs:249<\/a>).<\/li><li><code>to_text<\/code> serialises only the graph (<a href=\"../../src/expr.rs#L376\" target=\"_blank\">expr.rs:376<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/project_e2e.rs::edits_are_autosaved_and_reopen_identically<\/code> (asserts no undo after reopening).<\/p>"}, "quotes_html": ["Undo history is not part of a project.", "It belongs to the editing session and is not expected to survive closing and reopening a project."]}, {"id": "P11.1", "title": "Images the history needs live in a session stash", "anchor": "p11-1", "file": "04-sessions-and-projects.md", "line": 218, "area": "4 · Sessions and projects", "kind": "clause", "status": "Implemented", "quotes": ["Within a session, images the history may still need are kept outside the project (in a temporary session folder)."], "sections": {"Status": "Implemented.", "Implemented by": "- `new_stash_dir` makes a per-session folder under the system temp directory, named from the process id and `now_ms` ([worker.rs:402-403](../../src/worker.rs#L402), [worker.rs:413-414](../../src/worker.rs#L413)).\n- `sync_inputs` moves unused files there and repoints every `known` image to the stashed copy (`set_origin`) ([project.rs:163-180](../../src/project.rs#L163)).", "Tests": "`tests/project_e2e.rs::removed_images_leave_the_project_and_undo_restores_them`.", "Notes": "The decoded pixels of every image in the history also stay in memory (up to `HISTORY_LIMIT` = 60 snapshots). `new_stash_dir` also prunes stashes left by earlier sessions that are older than a day ([worker.rs:404-412](../../src/worker.rs#L404))."}, "citations": [{"entry": "P11.1", "section": "Implemented by", "path": "src/worker.rs", "start": 402, "end": 403, "md": "04-sessions-and-projects.md:225"}, {"entry": "P11.1", "section": "Implemented by", "path": "src/worker.rs", "start": 413, "end": 414, "md": "04-sessions-and-projects.md:225"}, {"entry": "P11.1", "section": "Implemented by", "path": "src/project.rs", "start": 163, "end": 180, "md": "04-sessions-and-projects.md:226"}, {"entry": "P11.1", "section": "Notes", "path": "src/worker.rs", "start": 404, "end": 412, "md": "04-sessions-and-projects.md:230"}], "tests": ["tests/project_e2e.rs::removed_images_leave_the_project_and_undo_restores_them"], "links": [], "sections_html": {"Status": "<p>Implemented.<\/p>", "Implemented by": "<ul><li><code>new_stash_dir<\/code> makes a per-session folder under the system temp directory, named from the process id and <code>now_ms<\/code> (<a href=\"../../src/worker.rs#L402\" target=\"_blank\">worker.rs:402-403<\/a>, <a href=\"../../src/worker.rs#L413\" target=\"_blank\">worker.rs:413-414<\/a>).<\/li><li><code>sync_inputs<\/code> moves unused files there and repoints every <code>known<\/code> image to the stashed copy (<code>set_origin<\/code>) (<a href=\"../../src/project.rs#L163\" target=\"_blank\">project.rs:163-180<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/project_e2e.rs::removed_images_leave_the_project_and_undo_restores_them<\/code>.<\/p>", "Notes": "<p>The decoded pixels of every image in the history also stay in memory (up to <code>HISTORY_LIMIT<\/code> = 60 snapshots). <code>new_stash_dir<\/code> also prunes stashes left by earlier sessions that are older than a day (<a href=\"../../src/worker.rs#L404\" target=\"_blank\">worker.rs:404-412<\/a>).<\/p>"}, "quotes_html": ["Within a session, images the history may still need are kept outside the project (in a temporary session folder)."]}, {"id": "P11.2", "title": "Undo copies images back unchanged", "anchor": "p11-2", "file": "04-sessions-and-projects.md", "line": 232, "area": "4 · Sessions and projects", "kind": "clause", "status": "Implemented", "quotes": ["If an undo brings an image back, it is copied back into `inputs/` unchanged."], "sections": {"Status": "Implemented.", "Implemented by": "- After an undo, the next autosave's `sync_inputs` finds the image without a project file and calls `adopt_image`, which copies the stashed bytes (`origin`) ([project.rs:148-153](../../src/project.rs#L148), [project.rs:118-120](../../src/project.rs#L118)).", "Tests": "`tests/project_e2e.rs::removed_images_leave_the_project_and_undo_restores_them`.", "Notes": "If the stash was pruned (another instance, a session longer than a day), the image is re-encoded as PNG instead: the pixels survive, the bytes do not."}, "citations": [{"entry": "P11.2", "section": "Implemented by", "path": "src/project.rs", "start": 148, "end": 153, "md": "04-sessions-and-projects.md:239"}, {"entry": "P11.2", "section": "Implemented by", "path": "src/project.rs", "start": 118, "end": 120, "md": "04-sessions-and-projects.md:239"}], "tests": ["tests/project_e2e.rs::removed_images_leave_the_project_and_undo_restores_them"], "links": [], "sections_html": {"Status": "<p>Implemented.<\/p>", "Implemented by": "<ul><li>After an undo, the next autosave's <code>sync_inputs<\/code> finds the image without a project file and calls <code>adopt_image<\/code>, which copies the stashed bytes (<code>origin<\/code>) (<a href=\"../../src/project.rs#L148\" target=\"_blank\">project.rs:148-153<\/a>, <a href=\"../../src/project.rs#L118\" target=\"_blank\">project.rs:118-120<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/project_e2e.rs::removed_images_leave_the_project_and_undo_restores_them<\/code>.<\/p>", "Notes": "<p>If the stash was pruned (another instance, a session longer than a day), the image is re-encoded as PNG instead: the pixels survive, the bytes do not.<\/p>"}, "quotes_html": ["If an undo brings an image back, it is copied back into <code>inputs/<\/code> unchanged."]}, {"id": "P12", "title": "Share Project writes ort_file` and `import_folder` ([mod.rs:535-536](../../src/ui/mod.rs#L535)), built with `open_with`, which runs a picker (`pick_project_file` or `pick_folder`) and then `open_project` ([mod.rs:472-478](../../src/ui/mod.rs#L472), [mod.rs:482](../../src/ui/mod.rs#L482), [mod.rs:487](../../src/ui/mod.rs#L487), [mod.rs:489](../../src/ui/mod.rs#L489), [platform.rs:172-173](../../src/ui/platform.rs#L172), [platform.rs:183](../../src/ui/platform.rs#L183)).\n- `on_project_opened` replaces the document with the loaded graph and switches to `Session::Project` ([mod.rs:223](../../src/ui/mod.rs#L223), [session.rs:205-209](../../src/ui/session.rs#L205)).", "Tests": "`tests/project.rs::open_accepts_folder_or_project_file`, `tests/project.rs::share_and_import_round_trip`.", "Notes": "The file picker accepts any `*.delos` file (`pick_project_file`), but `open` accepts only one named exactly `project.delos`, so `other.delos` passes the picker and is then refused."}, "citations": [{"entry": "P13", "section": "Implemented by", "path": "src/project.rs", "start": 290, "end": 298, "md": "04-sessions-and-projects.md:266"}, {"entry": "P13", "section": "Implemented by", "path": "src/ui/mod.rs", "start": 535, "end": 536, "md": "04-sessions-and-projects.md:267"}, {"entry": "P13", "section": "Implemented by", "path": "src/ui/mod.rs", "start": 472, "end": 478, "md": "04-sessions-and-projects.md:267"}, {"entry": "P13", "section": "Implemented by", "path": "src/ui/mod.rs", "start": 482, "end": 482, "md": "04-sessions-and-projects.md:267"}, {"entry": "P13", "section": "Implemented by", "path": "src/ui/mod.rs", "start": 487, "end": 487, "md": "04-sessions-and-projects.md:267"}, {"entry": "P13", "section": "Implemented by", "path": "src/ui/mod.rs", "start": 489, "end": 489, "md": "04-sessions-and-projects.md:267"}, {"entry": "P13", "section": "Implemented by", "path": "src/ui/platform.rs", "start": 172, "end": 173, "md": "04-sessions-and-projects.md:267"}, {"entry": "P13", "section": "Implemented by" ler finds the first dropped item that <code>is_project_path<\/code> and passes it to <code>open_project<\/code> (<a href=\"../../src/ui/mod.rs#L92\" target=\"_blank\">mod.rs:92-99<\/a>, <a href=\"../../src/ui/mod.rs#L244\" target=\"_blank\">mod.rs:244-249<\/a>).<\/li><\/ul>", "Tests": "<p>None.<\/p>"}, "quotes_html": ["Projects can also be opened by dropping them onto the window."]}, {"id": "P14", "title": "Verify the structure before opening", "anchor": "p14", "file": "04-sessions-and-projects.md", "line": 307, "area": "4 · Sessions and projects", "kind": "clause", "status": "Implemented", "quotes": ["Before opening, Delos verifies the structure:", "`project.delos` exists and parses;", "`inputs/` exists;", "every image the graph refers to exists inside `inputs/`.", "It reports precisely what is wrong otherwise."], "sections": {"Status": "Implemented.", "Implemented by": "- `Project::verify` checks the file, the folder, the parse and each `image_files` path, with a message naming the project, the line and the image ([project.rs:206-225](../../src/project.rs#L206)). `load` calls it first and `unpack` calls it after extracting ([project.rs:231](../../src/project.rs#L231), [project.rs:357](../../src/project.rs#L357)).\n- Failures reach the user as a toast (`on_project_opened`) ([session.rs:214](../../src/ui/session.rs#L214)).", "Tests": "`tests/project.rs::verify_rejects_broken_projects`, `tests/project_e2e.rs::invalid_projects_are_rejected_with_a_message`.", "Notes": "Missing-image messages give a line but no column (see [E11](05-expressions.md#e11)). `inputs/` is checked before parsing, the reverse of the spec's order; the outcome is the same."}, "citations": [{"entry": "P14", "section": "Implemented by", "path": "src/project.rs", "start": 206, "end": 225, "md": "04-sessions-and-projects.md:318"}, {"entry": "P14", "section": "Implemented by", "path": "src/project.rs", "start": 231, "end": 231, "md": "04-sessions-and-projects.md:318"}, {"entry": "P14", "section": "Implemented by", "path": "src/project.rs", "start": 357, "end": 357, "md": "04-sessions-and-projects.md:318"}, {"entry": "P14", "section": "Implemented by", "path": "src/ui/session.rs", "start": 214, "end": 214, "md": "04-sessions-and-projects.md:319"}], "tests": ["tests/project.rs::verify_rejects_broken_projects", "tests/project_e2e.rs::invalid_projects_are_rejected_with_a_message"], "links": ["05-expressions.md#e11"], "sections_html": {"Status": "<p>Implemented.<\/p>", "Implemented by": "<ul><li><code>Project::verify<\/code> checks the file, the folder, the parse and each <code>image_files<\/code> path, with a message naming the project, the line and the image (<a href=\"../../src/project.rs#L206\" target=\"_blank\">project.rs:206-225<\/a>). <code>load<\/code> calls it first and <code>unpack<\/code> calls it after extracting (<a href=\"../../src/project.rs#L231\" target=\"_blank\">project.rs:231<\/a>, <a href=\"../../src/project.rs#L357\" target=\"_blank\">project.rs:357<\/a>).<\/li><li>Failures reach the user as a toast (<code>on_project_opened<\/code>) (<a href=\"../../src/ui/session.rs#L214\" target=\"_blank\">session.rs:214<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/project.rs::verify_rejects_broken_projects<\/code>, <code>tests/project_e2e.rs::invalid_projects_are_rejected_with_a_message<\/code>.<\/p>", "Notes": "<p>Missing-image messages give a line but no column (see <a href=\"#\" data-goto=\"e11\">E11<\/a>). <code>inputs/<\/code> is checked before parsing, the reverse of the spec's order; the outcome is the same.<\/p>"}, "quotes_html": ["Before opening, Delos verifies the structure:", "<code>project.delos<\/code> exists and parses;", "<code>inputs/<\/code> exists;", "every image the graph refers to exists inside <code>inputs/<\/code>.", "It reports precisely what is wrong otherwise."]}, {"id": "P15", "title": "Unsafe paths are rejected; failed imports leave nothing", "anchor": "p15", "file": "04-sessions-and-projects.md", "line": 325, "area": "4 · Sessions and projects", "kind": "clause", "status": "Partial", "quotes": ["Paths that would point outside the project, whether in the project file or inside an archive, are rejected.", "A failed import leaves nothing behind."], "sections": {"Status": "Partial. Unsafe paths are rejected. A failed import leaves nothing behind only when the failure is in extraction or `verify`: if the unpacked project then fails to *load* (an image that does not decode, an unknown node kind), `open` returns the error and the unpacked folder stays in the projects folder ([D-IMPORT-LEFTOVER](findings.md#d-import-leftover)).", "Implemented by": "- In the project file: `resolve` accepts only `inputs/` followed by normal components ([project.rs:195-204](../../src/project.rs#L195)).\n- In an archive: `unpack` checks every entry before extracting and refuses one without an `enclosed_name` ([project.rs:310-316](../../src/project.rs#L310)).\n- Cleanup: `unpack` extracts and verifies inside one fallible `result` and removes the destination when extraction or `verify` fails ([project.rs:330](../../src/project.rs#L330), [project.rs:356-363](../../src/project.rs#L356)); an archive without `project.delos` is refused before anything is created ([project.rs:323](../../src/project.rs#L323)).", "Tests": "`tests/project.rs::verify_rejects_broken_projects`, `tests/project.rs::import_rejects_invalid_archives_and_cleans_up`.", "Notes": "The defect: `open` calls `load` after `unpack` returns, with no cleanup ([project.rs:291](../../src/project.rs#L291), [project.rs:299](../../src/project.rs#L299)). Confirmed by a failing probe ([D-IMPORT-LEFTOVER](findings.md#d-import-leftover))."}, "citations": [{"entry": "P15", "section": "Implemented by", "path": "src/project.rs", "start": 195, "end": 204, "md": "04-sessions-and-projects.md:333"}, {"entry": "P15", "section": "Implemented by", "path": "src/project.rs", "start": 310, "end": 316, "md": "04-sessions-and-projects.md:334"}, {"entry": "P15", "section": "Implemented by", "path": "src/project.rs", "start": 330, "end": 330, "md": "04-sessions-and-projects.md:335"}, {"entry": "P15", "section": "Implemented by", "path": "src/project.rs", "start": 356, "end": 363, "md": "04-sessions-and-projects.md:335"}, {"entry": "P15", "section": "Implemented by", "path": "src/project.rs", "start": 323, "end": 323, "md": "04-sessions-and-projects.md:335"}, {"entry": "P15", "section": "Notes", "path": "src/project.rs", "start": 291, "end": 291, "md": "04-sessions-and-projects.md:339"}, {"entry": "P15", "section": "Notes", "path": "src/project.rs", "start": 299, "end": 299, "md": "04-sessions-and-projects.md:339"}], "tests": ["tests/project.rs::verify_rejects_broken_projects", "tests/project.rs::import_rejects_invalid_archives_and_cleans_up"], "links": ["findings.md#d-import-leftover", "findings.md#d-import-leftover"], "sections_html": {"Status": "<p>Partial. Unsafe paths are rejected. A failed import leaves nothing behind only when the failure is in extraction or <code>verify<\/code>: if the unpacked project then fails to *load* (an image that does not decode, an unknown node kind), <code>open<\/code> returns the error and the unpacked folder stays in the projects folder (<a href=\"#\" data-goto=\"d-import-leftover\">D-IMPORT-LEFTOVER<\/a>).<\/p>", "Implemented by": "<ul><li>In the project file: <code>resolve<\/code> accepts only <code>inputs/<\/code> followed by normal components (<a href=\"../../src/project.rs#L195\" target=\"_blank\">project.rs:195-204<\/a>).<\/li><li>In an archive: <code>unpack<\/code> checks every entry before extracting and refuses one without an <code>enclosed_name<\/code> (<a href=\"../../src/project.rs#L310\" target=\"_blank\">project.rs:310-316<\/a>).<\/li><li>Cleanup: <code>unpack<\/code> extracts and verifies inside one fallible <code>result<\/code> and removes the destination when extraction or <code>verify<\/code> fails (<a href=\"../../src/project.rs#L330\" target=\"_blank\">project.rs:330<\/a>, <a href=\"../../src/project.rs#L356\" target=\"_blank\">project.rs:356-363<\/a>); an archive without <code>project.delos<\/code> is refused before anything is created (<a href=\"../../src/project.rs#L323\" target=\"_blank\">project.rs:323<\/a>).<\/li><\/ul>", "Tests": "<p><code>tests/project.rs::verify_rejects_broken_projects<\/code>, <code>tests/project.rs::import_rejects_invalid_archives_and_cleans_up<\/code>.<\/p>", "Notes": "<p>The defect: <code>open<\/code> calls <code>load<\/code> after <code>unpack<\/code> returns, with no cleanup (<a href=\"../../src/project.rs#L291\" target=\"_blank\">project.rs:291<\/a>, <a href=\"../../src/project.rs#L299\" target=\"_blank\">project.rs:299<\/a>). Confirmed by a failing probe (<a href=\"#\" data-goto=\"d-import-leftover\">D-IMPORT-LEFTOVER<\/a>).<\/p>"}, "quotes_html": ["Paths that would point outside the project, whether in the project file or inside an archive, are rejected.", "A failed import leaves nothing behind."]}, {"id": "X1", "title": "Mobile: projects without pickers", "anchor": "x1", "file": "04-sessions-and-projects.md", "line": 342, "area": "4 · Sessions and projects", "kind": "clause", "status": "Implemented", "quotes": ["Projects are currently desktop-first:", "Mobile supports projects but has no file pickers yet, so Import and Share Project are unavailable there."], "sections": {"Status": "Implemented (the limitation is as described).", "Implemented by": "- `mobile` enables `native`, hence projects ([Cargo.toml:9](../../Cargo.toml#L9)); `HAS_PICKERS` is the `desktop` feature ([platform.rs:164-165](../../src/ui/platform.rs#L164)) and hides Import, Open folder and Share ([mod.rs:534-544](../../src/ui/mod.rs#L534)).", "Tests": "None (no mobile build is tested).", "Notes": "On mobile, exports go to `~/Documents` without asking (`choose_save_target`) ([platform.rs:129-135](../../src/ui/platform.rs#L129))."}, "citations": [{"entry": "X1", "section": "Implemented by", "path": "Cargo.toml", "start": 9, "end": 9, "md": "04-sessions-and-pro
